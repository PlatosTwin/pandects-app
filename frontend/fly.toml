# fly.toml app configuration file generated for pandects-app on 2025-07-14T22:19:56-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pandects-app'
primary_region = 'iad'

[build]
  [build.args]
    VITE_API_BASE_URL = "https://api.pandects.org"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 0 since 2026-11-02: every visitor arrives at the public hostname through Fly's
  # proxy, which starts a stopped machine, so there is nothing to keep pinned up.
  # It was 1 only because `fly launch` generated it that way.
  min_machines_running = 0
  processes = ['app']

# 512 MB since 2026-11-02: this serves the built Vite bundle as static files and
# measured 152 MB resident at 1 GB, 62 MB at 512 MB. Raise it if the image ever
# does real work at runtime.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
