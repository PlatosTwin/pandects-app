# Hand-written documentation for every table and column in the public bulk dump.
#
# bulk/schema_docs/generate_schema_docs.py merges this file with the live
# MariaDB schema (types, keys, indexes come from the database; prose comes from
# here) and fails if any dump table or column is missing a description, or if a
# description refers to a table/column that no longer exists.
#
# Groups control the order and section structure of the generated docs.

groups:
  - name: Agreements and documents
    description: >-
      The corpus itself: one row per merger agreement, plus the versioned XML
      conversions, the per-section breakdown of the latest XML, and the
      clause-level spans carved out of sections.
    tables: [agreements, xml, sections, clauses]

  - name: Section taxonomy
    description: >-
      A three-level taxonomy of merger-agreement section types. Sections are
      labeled with these `standard_id`s via
      `sections.section_standard_id_gold_label` and, in exploded form, via
      `latest_sections_search_standard_ids`.
    tables: [taxonomy_l1, taxonomy_l2, taxonomy_l3]

  - name: Clause taxonomy (tax module)
    description: >-
      A separate, deeper taxonomy applied at the clause level, organized into
      modules. The first module, `tax`, covers tax provisions; its nodes use
      dotted identifiers (`tax.1`, `tax.1.1`, `tax.1.1.1`).
      `tax_clause_assignments` links clauses to these nodes.
    tables:
      [
        tax_clause_taxonomy_l1,
        tax_clause_taxonomy_l2,
        tax_clause_taxonomy_l3,
        tax_clause_assignments,
      ]

  - name: Search denormalizations
    description: >-
      Precomputed tables that power section search in the app and API. They
      duplicate agreement metadata per section so searches can filter without
      joins; if you are doing your own analysis, prefer joining the source
      tables directly.
    tables: [latest_sections_search, latest_sections_search_standard_ids]

  - name: Counsel
    description: >-
      Law firms advising each side of each deal, extracted from the agreements
      and normalized to canonical firm names.
    tables: [counsel, agreement_counsel]

  - name: Reference data
    description: NAICS industry classification reference tables.
    tables: [naics_sectors, naics_sub_sectors]

  - name: Analytics summaries
    description: >-
      Pre-aggregated statistics that power the public data/analytics pages.
      Everything here is derivable from the core tables; these exist so the
      app can serve charts without heavy queries.
    tables:
      [
        summary_data,
        agreement_overview_summary,
        agreement_index_summary,
        agreement_filter_option_summary,
        agreement_metadata_field_coverage_summary,
        agreement_status_summary,
        agreement_deal_type_summary,
        agreement_target_industry_summary,
        agreement_industry_pairing_summary,
        agreement_ownership_mix_summary,
        agreement_ownership_deal_size_summary,
        agreement_buyer_type_matrix_summary,
        agreement_counsel_leaderboard_summary,
      ]

tables:
  agreements:
    description: >-
      One row per merger agreement. Rows are discovered from SEC EDGAR filings
      (or the original DMA seed corpus) and enriched with AI-extracted deal
      metadata. This is the root table: nearly every other table references
      `agreement_uuid`.
    columns:
      agreement_uuid: Primary key (UUID).
      url: EDGAR URL of the filing exhibit the agreement was ingested from.
      secondary_filing_url: >-
        URL of a duplicate filing of the same agreement, when one was detected
        during ingestion.
      target: Name of the target company.
      acquirer: Name of the acquiring company.
      filing_date: Date the agreement was filed with the SEC.
      prob_filing: >-
        Classifier probability (0-1) that the source filing actually contains
        a merger agreement.
      filing_company_name: Name of the EDGAR filer that submitted the filing.
      filing_company_cik: SEC Central Index Key (CIK) of the filer.
      form_type: SEC form type of the parent filing (e.g. 8-K, S-4, DEFM14A).
      exhibit_type: >-
        Exhibit series the agreement appeared as: 2 (EX-2.x), 10 (EX-10.x), or
        99 (EX-99.x).
      transaction_price_total: Total transaction value, in USD.
      transaction_price_stock: Stock component of the transaction value, in USD.
      transaction_price_cash: Cash component of the transaction value, in USD.
      transaction_price_assets: Asset component of the transaction value, in USD.
      transaction_consideration: Form of consideration paid to target holders.
      target_type: Whether the target is a public or private company.
      acquirer_type: Whether the acquirer is a public or private company.
      target_industry: Industry label for the target.
      acquirer_industry: Industry label for the acquirer.
      announce_date: Date the deal was publicly announced.
      close_date: Date the deal closed, if it completed.
      deal_status: Deal outcome to date.
      attitude: Deal attitude (friendly, hostile, or unsolicited).
      deal_type: Transaction structure.
      purpose: Whether the acquisition is strategic or financial.
      target_pe: 1 if the target is private-equity-owned or -backed.
      acquirer_pe: 1 if the acquirer is private-equity-owned or -backed.
      metadata_sources: >-
        JSON blob of per-field citations backing the extracted deal metadata
        (field, source URL, supporting quote).
      metadata: 1 once AI deal-metadata extraction has completed for this agreement.
      verified: 1 if the agreement has passed validation.
      seed: Internal flag marking rows from the original seed corpus.
      status: >-
        Validation status. verified means the document is a well-formed merger
        agreement; invalid means it was rejected during validation.
      paginated: >-
        1 once the source document has been split into pages by the
        pre-processing pipeline (the page-level tables are internal and not
        part of the public dump).
      source: >-
        Where the record originated: dma (original seed corpus) or edgar
        (ongoing SEC EDGAR discovery).
      ingested_date: When the row was first ingested (UTC).
      updated_date: When the row was last updated (UTC).
      gated: >-
        1 holds the agreement out of public app/API surfaces until it is
        verified. Gated, unverified agreements are excluded from API results.
      validation_priority: >-
        Score used to order agreements in the internal validation queue.
      metadata_uncited_fields: >-
        JSON list of extracted metadata fields that lack a supporting citation.
      target_counsel: >-
        JSON array of law-firm names advising the target, as extracted from
        the agreement. Normalized form lives in `counsel` /
        `agreement_counsel`.
      acquirer_counsel: >-
        JSON array of law-firm names advising the acquirer, as extracted from
        the agreement. Normalized form lives in `counsel` /
        `agreement_counsel`.
      utils_abandoned: >-
        Internal flag hiding the agreement from the maintainer review UI. No
        public meaning.

  xml:
    description: >-
      Versioned XML conversions of each agreement. The ETL pipeline converts
      the raw filing into structured XML (articles, sections, sub-clauses);
      re-runs produce new versions rather than overwriting. Use `latest = 1`
      and `status = 'verified'` for the current public text of an agreement.
    columns:
      agreement_uuid: Agreement this XML conversion belongs to (composite PK with `version`).
      xml: Full agreement text as structured Pandects XML.
      version: >-
        Version number of the conversion for this agreement (composite PK with
        `agreement_uuid`).
      status: Validation status of this XML version.
      status_source: >-
        How the status was assigned: asset (automated pipeline validation) or
        manual (human review).
      created_date: When this version was produced (UTC).
      latest: 1 for the newest XML version of each agreement; older versions keep 0.
      gated: 1 if this XML version is gated out of public serving.
      validation_priority: Internal review-queue priority flag.
      status_reason_code: >-
        Machine-readable reason an XML version was marked invalid (e.g.
        section_article_mismatch, too_few_articles, llm_invalid).
      status_reason_detail: Free-text detail accompanying `status_reason_code`.
      ai_repair_attempted: 1 if the AI-repair stage attempted to fix this XML version.

  sections:
    description: >-
      One row per section of each agreement's XML, in document order. This is
      the main unit of retrieval in the app and API: sections carry the
      section text, taxonomy labels, and a vector embedding.
    columns:
      section_uuid: Primary key (UUID).
      agreement_uuid: Agreement the section belongs to.
      article_title: >-
        Title of the article (top-level heading) containing this section, as
        written in the agreement.
      article_title_normed: Normalized article title used for matching.
      article_order: Position of the article within the agreement.
      section_title: Title of the section, as written in the agreement.
      section_title_normed: Normalized section title used for matching.
      section_order: Position of the section within its article.
      xml_content: XML markup of the section body.
      section_standard_id: >-
        Legacy single-value section-taxonomy assignment. Currently
        unpopulated; use `section_standard_id_gold_label`.
      section_standard_id_gold_label: >-
        JSON array of section-taxonomy `standard_id`s (nodes of `taxonomy_l2`
        / `taxonomy_l3`) assigned to this section.
      xml_version: The `xml.version` this section was extracted from.
      embedding: >-
        1024-dimension MariaDB VECTOR embedding of the section text, used for
        semantic search.
      gold_label_model: Model that produced `section_standard_id_gold_label`.

  clauses:
    description: >-
      Clause-level spans carved out of sections for clause-taxonomy modules.
      Each row is a contiguous span of a section's text. Only sections
      relevant to a module are carved; currently the only module is `tax`.
    columns:
      clause_uuid: Primary key (UUID).
      agreement_uuid: Agreement the clause belongs to.
      section_uuid: Section the clause was carved from.
      xml_version: XML version of the parent section at extraction time.
      module: Clause-taxonomy module the clause was extracted for. Currently always tax.
      clause_order: Order of the clause within its section.
      anchor_label: 'Subsection anchor the clause starts at (e.g. (a), (h)), when present.'
      start_char: Start character offset of the clause span within the section text.
      end_char: End character offset (exclusive) of the clause span within the section text.
      clause_text: Plain text of the clause span.
      source_method: >-
        How the span was carved: paragraph_split, enumerated_split,
        section_title_match, or whole_section_fallback.
      context_type: >-
        Where the clause sits in the agreement: operative provisions or
        rep_warranty (representations and warranties).
      created_at: Row creation time (UTC).
      updated_at: Row last-update time (UTC).

  taxonomy_l1:
    description: >-
      Top level of the section taxonomy — broad categories such as
      "Definitions and Interpretation" or "Representations and Warranties
      (Company/Seller)".
    columns:
      standard_id: Primary key; 16-character hex identifier.
      label: Human-readable category name.
      parent_id: Always NULL at the top level.

  taxonomy_l2:
    description: Middle level of the section taxonomy.
    columns:
      standard_id: Primary key; 16-character hex identifier.
      label: Human-readable category name.
      parent_id: The `taxonomy_l1.standard_id` this node belongs to.

  taxonomy_l3:
    description: >-
      Leaf level of the section taxonomy — the most specific section types
      (e.g. "Termination Events; Outside Date; Extensions").
    columns:
      standard_id: Primary key; 16-character hex identifier.
      label: Human-readable category name.
      parent_id: The `taxonomy_l2.standard_id` this node belongs to.

  tax_clause_taxonomy_l1:
    description: >-
      Top level of the tax-module clause taxonomy (e.g. tax.1 "Intended Tax
      Treatment, Elections, and Purchase Price Allocation").
    columns:
      standard_id: Primary key; dotted identifier (`tax.N`).
      label: Human-readable category name.

  tax_clause_taxonomy_l2:
    description: Middle level of the tax-module clause taxonomy.
    columns:
      standard_id: Primary key; dotted identifier (`tax.N.N`).
      label: Human-readable category name.
      parent_id: The `tax_clause_taxonomy_l1.standard_id` this node belongs to.

  tax_clause_taxonomy_l3:
    description: >-
      Leaf level of the tax-module clause taxonomy (e.g. tax.1.1.1 "Intended
      Tax-Free Reorganization").
    columns:
      standard_id: Primary key; dotted identifier (`tax.N.N.N`).
      label: Human-readable category name.
      parent_id: The `tax_clause_taxonomy_l2.standard_id` this node belongs to.

  tax_clause_assignments:
    description: >-
      Assignments of clauses to clause-taxonomy nodes. `standard_id` may point
      at an L2 or an L3 node — clauses are labeled at the most specific level
      the model supports for that branch.
    columns:
      clause_uuid: The `clauses.clause_uuid` being labeled (composite PK with `standard_id`).
      standard_id: >-
        The assigned taxonomy node — a `tax_clause_taxonomy_l2` or
        `tax_clause_taxonomy_l3` `standard_id` (composite PK with
        `clause_uuid`).
      is_gold_label: 1 if the assignment is a curated gold label rather than a raw model output.
      model_name: Model that produced the assignment, when model-generated.
      assigned_at: When the assignment was made (UTC).

  latest_sections_search:
    description: >-
      Denormalized search index: one row per section of the latest verified
      XML of each public agreement, with the deal metadata from `agreements`
      copied onto every row so searches can filter without joins. Metadata
      columns have the same meaning as their `agreements` counterparts.
    columns:
      section_uuid: Primary key; the `sections.section_uuid` this row mirrors.
      agreement_uuid: Agreement the section belongs to.
      filing_date: Copied from `agreements.filing_date`.
      prob_filing: Copied from `agreements.prob_filing`.
      filing_company_name: Copied from `agreements.filing_company_name`.
      filing_company_cik: Copied from `agreements.filing_company_cik`.
      form_type: Copied from `agreements.form_type`.
      exhibit_type: Copied from `agreements.exhibit_type`.
      target: Copied from `agreements.target`.
      acquirer: Copied from `agreements.acquirer`.
      transaction_price_total: Copied from `agreements.transaction_price_total`.
      transaction_price_stock: Copied from `agreements.transaction_price_stock`.
      transaction_price_cash: Copied from `agreements.transaction_price_cash`.
      transaction_price_assets: Copied from `agreements.transaction_price_assets`.
      transaction_consideration: Copied from `agreements.transaction_consideration`.
      target_type: Copied from `agreements.target_type`.
      acquirer_type: Copied from `agreements.acquirer_type`.
      target_counsel: Copied from `agreements.target_counsel`.
      acquirer_counsel: Copied from `agreements.acquirer_counsel`.
      target_industry: Copied from `agreements.target_industry`.
      acquirer_industry: Copied from `agreements.acquirer_industry`.
      announce_date: Copied from `agreements.announce_date`.
      close_date: Copied from `agreements.close_date`.
      deal_status: Copied from `agreements.deal_status`.
      attitude: Copied from `agreements.attitude`.
      deal_type: Copied from `agreements.deal_type`.
      purpose: Copied from `agreements.purpose`.
      target_pe: Copied from `agreements.target_pe`.
      acquirer_pe: Copied from `agreements.acquirer_pe`.
      verified: Copied from `agreements.verified`.
      url: Copied from `agreements.url`.
      section_standard_ids: >-
        JSON array of section-taxonomy `standard_id`s; mirrors
        `sections.section_standard_id_gold_label`.
      article_title: Copied from `sections.article_title`.
      section_title: Copied from `sections.section_title`.

  latest_sections_search_standard_ids:
    description: >-
      Exploded one-row-per-(taxonomy node, section) form of
      `latest_sections_search.section_standard_ids`, for indexed taxonomy
      filtering.
    columns:
      standard_id: >-
        A section-taxonomy node (`taxonomy_l2` or `taxonomy_l3`
        `standard_id`) assigned to the section (composite PK with
        `section_uuid`).
      section_uuid: The labeled section (composite PK with `standard_id`).
      agreement_uuid: Agreement the section belongs to.

  counsel:
    description: Canonical law firms, deduplicated by normalized name.
    columns:
      counsel_id: Primary key (auto-increment).
      canonical_name: Canonical display name of the firm.
      canonical_name_normalized: Normalized name used for deduplication; unique.
      created_at: Row creation time (UTC).
      updated_at: Row last-update time (UTC).

  agreement_counsel:
    description: >-
      Law firms advising each side of each agreement, in the order they were
      listed. Join through `counsel` for canonical firm names.
    columns:
      agreement_uuid: The agreement (composite PK with `side` and `position`).
      side: Which party the firm advised (target or acquirer).
      position: Order of the firm within that side's counsel list.
      raw_name: Firm name as extracted from the agreement, before canonicalization.
      counsel_id: The canonical firm (`counsel.counsel_id`).
      created_at: Row creation time (UTC).
      updated_at: Row last-update time (UTC).

  naics_sectors:
    description: NAICS sector reference (two-digit sector codes) with Pandects' groupings.
    columns:
      sector_code: Primary key; two-digit NAICS sector code.
      sector_desc: Official NAICS sector description.
      sector_group: Pandects grouping of related sectors.
      super_sector: Broadest Pandects grouping.

  naics_sub_sectors:
    description: NAICS subsector reference (three-digit codes).
    columns:
      sub_sector_code: Primary key; three-digit NAICS subsector code.
      sub_sector_desc: Official NAICS subsector description.
      sector_code: Parent NAICS sector (`naics_sectors.sector_code`).

  summary_data:
    description: >-
      Pre-aggregated corpus statistics: one row per observed combination of
      filing year, form type, exhibit type, party types, deal type, attitude,
      and purpose, with agreement/page/section counts and total deal value.
    columns:
      year: Filing year of the aggregated agreements.
      form_type: SEC form type dimension.
      exhibit_type: Exhibit series dimension.
      target_type: Target ownership dimension (public/private).
      acquirer_type: Acquirer ownership dimension (public/private).
      deal_type: Transaction structure dimension.
      attitude: Deal attitude dimension.
      purpose: Deal purpose dimension.
      count_agreements: Number of agreements in this bucket.
      count_pages: Number of source-document pages across those agreements.
      count_sections: Number of sections across those agreements.
      count_distinct_acquirer: Distinct acquirer names in this bucket.
      count_distinct_target: Distinct target names in this bucket.
      sum_transaction_value_total: Sum of total transaction values, in USD.
      count_verified: Number of verified agreements in this bucket.

  agreement_overview_summary:
    description: Single-row headline statistics for the data overview page.
    columns:
      singleton_key: Always 1; enforces the single row.
      metadata_coverage_pct: Share of eligible agreements with extracted deal metadata.
      taxonomy_coverage_pct: Share of eligible sections with taxonomy labels.
      latest_filing_date: Most recent `agreements.filing_date` in the corpus.
      metadata_covered_agreements: Number of agreements with extracted deal metadata.
      taxonomy_covered_sections: Number of sections with taxonomy labels.

  agreement_index_summary:
    description: One row per public agreement, powering the agreement browse/index pages.
    columns:
      agreement_uuid: Primary key; the agreement.
      year: Filing year.
      target: Target company name.
      acquirer: Acquirer company name.
      verified: 1 if the agreement is verified.

  agreement_filter_option_summary:
    description: >-
      Distinct filter options offered by the search UI, with the number of
      agreements each matches.
    columns:
      field_name: >-
        Which filter the option belongs to: targets, acquirers,
        target_industries, acquirer_industries, target_counsels, or
        acquirer_counsels.
      option_value: The filterable value.
      agreement_count: Number of agreements matching this option.

  agreement_metadata_field_coverage_summary:
    description: >-
      Extraction coverage per deal-metadata field: how many agreements are
      eligible for the field and how many have it populated, over all ingested
      agreements and over fully processed agreements.
    columns:
      field_name: Primary key; the `agreements` metadata column being measured.
      label: Display label for the field.
      ingested_eligible_agreements: Ingested agreements eligible for this field.
      ingested_covered_agreements: Ingested agreements with the field populated.
      ingested_coverage_pct: Coverage percentage over ingested agreements.
      processed_eligible_agreements: Fully processed agreements eligible for this field.
      processed_covered_agreements: Fully processed agreements with the field populated.
      processed_coverage_pct: Coverage percentage over fully processed agreements.
      note: Caveats about how coverage is measured for this field.

  agreement_status_summary:
    description: >-
      Pipeline progress counts by filing year: how many agreements sit at each
      processing stage.
    columns:
      year: Filing year.
      color: Display bucket for the stage (gray, green, or red).
      current_stage: 'Pipeline stage (e.g. 1_pre_processing, 3_xml, processed).'
      count: Number of agreements at this stage for this year.

  agreement_deal_type_summary:
    description: Deal counts by filing year and transaction structure.
    columns:
      year: Filing year.
      deal_type: Transaction structure.
      count: Number of agreements.

  agreement_target_industry_summary:
    description: Deal count and total transaction value by filing year and target industry.
    columns:
      year: Filing year.
      industry: Target industry label.
      deal_count: Number of agreements.
      total_transaction_value: Sum of total transaction values, in USD.

  agreement_industry_pairing_summary:
    description: >-
      Deal count and total transaction value for each (target industry,
      acquirer industry) pairing.
    columns:
      target_industry: Target industry label.
      acquirer_industry: Acquirer industry label.
      deal_count: Number of agreements.
      total_transaction_value: Sum of total transaction values, in USD.

  agreement_ownership_mix_summary:
    description: >-
      Deal count and total transaction value by filing year and target
      ownership bucket.
    columns:
      year: Filing year.
      target_bucket: Target ownership bucket (public or private).
      deal_count: Number of agreements.
      total_transaction_value: Sum of total transaction values, in USD.

  agreement_ownership_deal_size_summary:
    description: >-
      Transaction-value quartiles by filing year and target ownership bucket.
    columns:
      year: Filing year.
      target_bucket: Target ownership bucket (public or private).
      deal_count: Number of agreements.
      p25_transaction_value: 25th-percentile total transaction value, in USD.
      median_transaction_value: Median total transaction value, in USD.
      p75_transaction_value: 75th-percentile total transaction value, in USD.

  agreement_buyer_type_matrix_summary:
    description: >-
      Deal count and median transaction value for each target ownership bucket
      x buyer type cell.
    columns:
      target_bucket: Target ownership bucket (public or private).
      buyer_bucket: 'Buyer type: private_equity, private_strategic, public_buyer, or other.'
      deal_count: Number of agreements.
      median_transaction_value: Median total transaction value, in USD.

  agreement_counsel_leaderboard_summary:
    description: >-
      Counsel league table: deal count and total transaction value per law
      firm, by side and filing year.
    columns:
      side: buy_side or sell_side.
      counsel_key: Normalized firm key (composite PK with `side` and `year`).
      counsel: Display name of the firm.
      year: Filing year.
      deal_count: Number of deals the firm advised on.
      total_transaction_value: Sum of total transaction values, in USD.

# Documented relationships rendered as refs in the DBML / ER diagram.
# Format: "child_table.column > parent_table.column" (many-to-one),
# "a.column - b.column" (one-to-one). Enforced foreign keys discovered from
# the database are merged in automatically; list only implicit joins here.
relationships:
  - sections.agreement_uuid > agreements.agreement_uuid
  - clauses.agreement_uuid > agreements.agreement_uuid
  - clauses.section_uuid > sections.section_uuid
  - xml.agreement_uuid > agreements.agreement_uuid
  - taxonomy_l2.parent_id > taxonomy_l1.standard_id
  - taxonomy_l3.parent_id > taxonomy_l2.standard_id
  - tax_clause_taxonomy_l2.parent_id > tax_clause_taxonomy_l1.standard_id
  - tax_clause_taxonomy_l3.parent_id > tax_clause_taxonomy_l2.standard_id
  - tax_clause_assignments.clause_uuid > clauses.clause_uuid
  - tax_clause_assignments.standard_id > tax_clause_taxonomy_l3.standard_id
  - latest_sections_search.section_uuid - sections.section_uuid
  - latest_sections_search.agreement_uuid > agreements.agreement_uuid
  - latest_sections_search_standard_ids.section_uuid > latest_sections_search.section_uuid
  - latest_sections_search_standard_ids.standard_id > taxonomy_l3.standard_id
  - naics_sub_sectors.sector_code > naics_sectors.sector_code
  - agreement_index_summary.agreement_uuid - agreements.agreement_uuid
