    label stock or mixed have an empty stock leg (1,912 before it), 248 of
    them with a private acquirer: on each, no party states a value of the
    stock in a source that the readers could open. The reread did not read
    again a stock leg that already held a value, and uses only values that a
    party prints, not a market price that a reader looked up.
    A closing blind sample then covered all four parts of the full price
    pass. Two blind readers, who were also told to look for a value of the
    stock in the investor presentation, the merger proxy and the S-4, read 60
    of 12,014 of the agreements that the four parts read (the 12,059 less the
    45 agreements of two lists that were left out of the sample frame), and
