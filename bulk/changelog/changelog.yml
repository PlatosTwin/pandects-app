# Pandects dataset changelog — source of truth.
#
# RULE (humans and agents): any change that alters the public dataset or its
# meaning — bulk/public_tables.txt, bulk/schema_docs/table_docs.yml, DB
# migrations or data fixes affecting allowlisted tables, backend/schemas/
# public_api.py, or the backend/mcp/ tool surface — must append an entry to
# `unreleased:` below IN THE SAME COMMIT. See bulk/changelog/DESIGN.md.
#
# Entry shape (only `unreleased:` is hand-edited; `releases:` is stamped by
# bulk/push_to_r2.sh via render_changelog.py — do not hand-edit it):
#   - type: schema | data | api | mcp | docs | pipeline
#     severity: breaking | notable | minor
#     summary: "One-line, consumer-facing description."
#     details: >            # optional longer prose
#     tables: [agreements]  # optional; must be subset of bulk/public_tables.txt
#     migration: null       # optional guidance/SQL for consumers
#     refs: ["<commit or PR>"]  # optional
#
# severity: breaking = consumer queries against the previous dump can return
# wrong/empty results; notable = results change but queries still run;
# minor = additive/cosmetic.

unreleased:
- type: mcp
  severity: minor
  summary: "MCP OAuth client registration validates client_name, and the consent screen's Deny goes through /authorize."
  details: >
    POST /v1/auth/oauth/register now rejects a client_name that is not a
    string, is longer than 255 characters, or contains control or formatting
    characters (such as bidirectional overrides) with 400
    invalid_client_metadata. A name over 255 characters previously failed with
    a server error. Surrounding whitespace is trimmed. GET
    /v1/auth/oauth/authorize accepts deny=1: after validating the client and
    redirect URI it redirects to the registered callback with
    error=access_denied and the state. The consent screen's Deny button uses
    it instead of sending the browser to the redirect URI in the page address.
    The consent screen now leads with the redirect host and warns about
    unrecognized applications and names that claim a known client.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP OAuth /authorize reports an unsupported scope to the client as an invalid_scope redirect."
  details: >
    GET /v1/auth/oauth/authorize used to answer a request for a scope the
    server does not support with a JSON 400 shown in the browser, before it had
    checked the client or redirect URI. It now validates the client and
    redirect URI first and, as RFC 6749 section 4.1.2.1 requires, redirects
    back to the client with error=invalid_scope, the original state, and an
    error_description that names the scope when it is a well-formed scope token
    of at most 64 characters. A request with an unknown client or
    unregistered redirect URI still gets an error page and is never
    redirected. The consent endpoint keeps its 400 for unsupported scopes.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP OAuth token and client-registration errors now use the codes the OAuth RFCs define."
  details: >
    POST /v1/auth/oauth/token errors return {"error", "error_description",
    "message"} with the RFC 6749 codes invalid_request, invalid_client,
    invalid_grant, unauthorized_client and unsupported_grant_type.
    POST /v1/auth/oauth/register errors use the RFC 7591 codes
    invalid_redirect_uri and invalid_client_metadata. Errors from both
    endpoints carry Cache-Control: no-store and Pragma: no-cache. Both used to
    return the generic bad_request
    code. A code or refresh token whose Pandects account is not verified is
    now 400 invalid_grant instead of 403. `message` still carries the same
    text. The /.well-known OAuth discovery endpoints now return the standard
    error envelope codes (not_found, service_unavailable) instead of HTTP
    reason phrases.
  migration: >
    MCP clients that follow the OAuth RFCs need no change. Code that matched
    `error == "bad_request"` on these two endpoints should match the RFC code
    or the status.
  refs: []
- type: docs
  severity: minor
  summary: "The published OpenAPI spec now matches what the API returns."
  details: >
    The spec at /openapi.yaml is regenerated from the API on every change (CI
    fails when it is stale), so it now documents the endpoints and parameters
    added since the last manual export, including /v1/taxonomy/counts and
    /v1/taxonomy/tax-clauses/counts. The `Error` schema now describes the real
    error body, {"error": <code>, "message": <text>}, instead of
    flask-smorest's {code, status, message, errors}. Response fields that are
    always present are marked required, and target_pe / acquirer_pe are
    documented as the 0/1 integers (or null) the API returns. Responses
    themselves are unchanged.
  refs: []
- type: api
  severity: notable
  summary: "Error responses now carry a machine code in `error` instead of the HTTP reason phrase."
  details: >
    Every /v1 error body is {"error": <code>, "message": <text>}. Generic errors
    used to put the HTTP reason phrase in `error` ("Bad Request", "Not Found",
    "Unprocessable Entity", ...); they now use stable snake_case codes:
    bad_request (400), unauthorized (401), forbidden (403), not_found (404),
    method_not_allowed (405), conflict (409), validation_error (422),
    rate_limited (429), internal_error (500), service_unavailable (503). Other
    statuses use the snake_case reason phrase. Codes that were already
    specific (validation_error, rate_limited, captcha_required, legal_required,
    ...) are unchanged. A 422 from query-parameter parsing now names the field
    in `message` ("page_size: Not a valid integer.") instead of a generic
    sentence. Status codes and the /mcp JSON-RPC errors are unchanged.
  migration: >
    Clients that compared `error` to a reason phrase should compare it to the
    new code, or branch on the HTTP status.
  refs: []
- type: api
  severity: minor
  summary: "REST responses carry industry and taxonomy labels next to the raw codes."
  details: >
    Agreement rows on /v1/agreements, /v1/agreements/{uuid}, and
    /v1/search/agreements gain target_industry_label and acquirer_industry_label:
    the NAICS description of the code (a code with no catalog entry of its own
    rolls up to its 2-digit sector; null when it cannot be resolved). The
    /v1/sections result metadata block gains the same labels for the industry
    fields that were requested. Section results, /v1/sections/{uuid},
    /v1/agreements/{uuid}/sections, and /v1/search/agreements matched_sections
    gain standard_id_labels, a {standard_id: label} map for the clause-taxonomy
    ids in standard_id. Tax-clause results on /v1/tax-clauses gain
    tax_standard_id_labels for tax_standard_ids, and the agreement and section
    tax-clause lists gain standard_id_labels for standard_ids. /v1/filter-options
    gains industry_labels ({code: label}) whenever target_industries or
    acquirer_industries is returned. Existing fields are unchanged; callers no
    longer need /v1/naics or /v1/taxonomy just to print a label.
  refs: []
- type: api
  severity: minor
  summary: "New /v1/taxonomy/counts and /v1/taxonomy/tax-clauses/counts endpoints."
  details: >
    GET /v1/taxonomy/counts returns {"counts": {standard_id: n}}: how many
    sections /v1/sections?standard_id=<id> matches for each clause-taxonomy
    node, a parent counting the distinct sections tagged with it or any
    descendant. GET /v1/taxonomy/tax-clauses/counts returns the same shape for
    the tax-clause taxonomy, counting the clauses /v1/tax-clauses?tax_standard_id=<id>
    matches with default options (rep-and-warranty clauses excluded). Nodes with
    no matches are omitted.
  refs: []
- type: api
  severity: minor
  summary: "The clause_types field of /v1/filter-options is deprecated in favor of /v1/taxonomy."
  details: >
    clause_types has always returned the same tree as GET /v1/taxonomy; both now
    come from one builder and one cache. clause_types keeps working for existing
    callers, but new code should read /v1/taxonomy, which is cacheable on its
    own. The Pandects web client no longer requests clause_types.
  refs: []
- type: api
  severity: minor
  summary: "/v1/agreements-summary now reports processed_agreements alongside agreements."
  details: >
    The new processed_agreements field counts the agreements that have been
    processed and can be browsed and searched (the rows behind
    /v1/agreements-index). The existing agreements field is unchanged and still
    counts every agreement ingested, including those pending processing or
    verification.
  refs: []
- type: api
  severity: minor
  summary: "An out-of-range page_size now returns the largest allowed page instead of 25 rows."
  details: >
    On /v1/sections, /v1/tax-clauses, /v1/agreements, /v1/search/agreements, and
    the MCP search_sections, search_tax_clauses, search_agreements,
    list_agreements, and list_agreement_sections tools, a page_size above the
    caller's ceiling (100 for signed-in and API-key callers, 10 for anonymous
    callers) is now clamped to that ceiling rather than reset to the default of
    25. A page_size below 1 still falls back to the default. Requests within
    range are unchanged.
  refs: []
- type: mcp
  severity: notable
  summary: "search_sections phrase queries for common language now return results instead of an error."
  details: >
    A phrase common enough to match a large share of the corpus -- "material
    adverse effect", "reasonable best efforts", "governing law" -- previously
    exceeded the database time bound and came back as a validation error telling
    the caller to add filters, which could not help. Phrase mode now picks
    between two query plans per search, so these queries return normally. Two
    consumer-visible consequences: the error text for a phrase that still cannot
    be served now asks for a longer or more distinctive phrase rather than
    filters, and for the most common phrases total_count is reported as a lower
    bound with method `filtered_lower_bound` and planning_reliability `low`,
    because an exact count of those matches is not affordable. Read total_count
    together with has_next on those searches; count_mode=exact degrades the same
    way rather than failing. Result rows and their order are unchanged.
  refs: []
- type: api
  severity: notable
  summary: "/v1/search/agreements now applies text_query, and rejects metadata with a 422."
  details: >
    text_query and text_match_mode (phrase, all_terms, any_terms) were accepted
    on /v1/search/agreements but silently ignored, so a text search returned
    every agreement matching the other filters. An agreement now matches when at
    least one of its latest sections matches the text (and, together with
    standard_id or section_uuid, when one section matches all of them).
    match_count counts those sections, matched_sections previews the first three
    in document order with a snippet centered on the match, and each preview
    carries a new matched_terms list of the matched spans. When an exact count
    is not affordable, total_count is a lower bound (total_count_is_approximate
    true, count_metadata.method filtered_lower_bound); read it with has_next. A
    text query too expensive to serve returns a 422 on text_query. The metadata
    parameter, previously accepted and ignored, now returns a 422: every result
    already carries the full agreement metadata. Responses also gain
    count_metadata, and dump_version on searches without section criteria.
  refs: []
- type: api
  severity: minor
  summary: "/v1/agreements accepts year_min, year_max, filed_after, and filed_before."
  details: >
    The year and filing-date range filters already accepted by /v1/sections and
    /v1/search/agreements now work on /v1/agreements too, with the same
    semantics (filed_after inclusive, filed_before exclusive, YYYY-MM-DD). Every
    agreement endpoint and MCP tool now shares one metadata filter
    implementation, so the same arguments select the same agreements everywhere.
  refs: []
- type: api
  severity: notable
  summary: "Section search and GET /v1/sections/{section_uuid} exclude gated, unverified agreements."
  details: >
    /v1/sections and GET /v1/sections/{section_uuid} now apply the same
    public-eligibility rule as the agreement endpoints, which already hid
    agreements that are gated and not yet verified. A section of such an
    agreement no longer appears in search results and returns 404 when fetched
    directly. The MCP get_section, get_sections_batch, and get_agreement tools
    apply the same rule.
  refs: []
- type: api
  severity: minor
  summary: "Canonical id fields on single reads, sort_direction on the agreements index, dump_version on tax clauses."
  details: >
    GET /v1/agreements/{agreement_uuid} and the MCP get_agreement tool now
    return agreement_uuid. GET /v1/sections/{section_uuid} returns standard_id
    (the name used everywhere else); section_standard_id stays as a deprecated
    alias with the same value. /v1/agreements-index accepts sort_direction like
    every other paginated endpoint; sort_dir keeps working as a deprecated
    alias, and sort_direction wins when both are sent. /v1/tax-clauses returns
    dump_version and accepts include_dump=false to omit it, as /v1/sections does.
  refs: []
- type: api
  severity: notable
  summary: "An unknown price bucket is a 422 instead of being ignored."
  details: >
    transaction_price_total, transaction_price_stock, transaction_price_cash,
    and transaction_price_assets accept only the canonical bucket labels
    (0 - 100M, 100M - 250M, 250M - 500M, 500M - 750M, 750M - 1B, 1B - 2B,
    2B - 5B, 5B - 10B, 10B - 20B, 20B+). Any other value (for example
    "1B - 5B") used to be dropped silently, so the request returned results
    unfiltered by price. /v1/sections, /v1/search/agreements, /v1/agreements,
    and /v1/tax-clauses now answer 422 validation_error, and the message names
    the field, the rejected value, and the valid labels. The MCP
    search_sections, search_agreements, list_agreements, and
    search_tax_clauses tools return the same detail as a -32602 invalid-arguments
    error. The OpenAPI spec lists the labels as an enum.
  migration: >
    Send one of the listed labels; list_filter_options (MCP) returns them under
    transaction_price_totals.
  refs: []
- type: api
  severity: minor
  summary: "Search snippets no longer contain page numbers and page ids."
  details: >
    A section that crosses a page break carries <page> and <pageUUID> markers in
    its XML, and their contents leaked into /v1/search/agreements
    matched_sections[].snippet as text ("... more than 20 69
    66af9b9a-20dc-11f1-ac97-be44a5e954c8 Business Days ..."). Snippets are now
    built from the agreement text only, so a text_query phrase that spans a
    page break also matches and is reported in matched_terms. The XML returned
    by the section and agreement endpoints is unchanged.
  refs: []
- type: mcp
  severity: minor
  summary: "Snippets and monetary_values ignore page numbers and page ids."
  details: >
    get_section_snippet, get_section_snippets_batch, get_sections_batch, and
    search_sections / search_agreements with snippets now drop the <page> and
    <pageUUID> markers before excerpting, so snippets read as clean text and a
    focus term that spans a page break is found. monetary_values is extracted
    from the same cleaned text.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP industry labels roll an unlisted NAICS code up to its sector, as REST does."
  details: >
    target_industry_label / acquirer_industry_label (list_agreements,
    get_agreement, get_agreements_batch, search_sections
    metadata) and the list_filter_options industry_labels map used to match the
    code exactly, so a code with no catalog entry of its own (for example "459",
    "513", "922") was null in MCP while REST labeled it with its 2-digit sector
    ("Retail Trade" for "459"). Both surfaces now share one resolver. A
    non-numeric value or a code whose sector is also missing stays null.
  refs: []
- type: data
  severity: notable
  summary: "Adjacent headings of the same type are no longer merged into one section: 1,370 agreements re-sectioned."
  details: >
    The tagger printed two back-to-back headings of the same kind (for example
    "Section 3.5 [Reserved]." directly followed by "Section 3.6 Material
    Contracts.") as a single tag, so the XML and the sections table held one
    section where the agreement has two. The 2,261 affected body pages in 1,370
    agreements were re-tagged, adding 2,436 section, 71 article and 114 page
    boundaries, and their XML and sections were rebuilt. Of those agreements,
    1,301 that were verified stay verified and 11 that were invalid now verify;
    none went from verified to invalid. Three agreements also had typos in the
    filed section numbers corrected in the source text (cb7e8e4d, 0b3a6ac0,
    e739fd7e). Rebuilt sections get new section ids, and sections with new ids
    carry no taxonomy label (standard_id) until the taxonomy is rebuilt, so
    standard_id coverage is lower in these agreements for now.
  tables: [xml, sections, latest_sections_search, latest_sections_search_standard_ids]
  migration: >
    Section ids for the 1,370 agreements changed; re-fetch them rather than
    joining on ids saved from the previous dump.
  refs: ["2e4190bd"]
- type: data
  severity: notable
  summary: "Page boundaries corrected: signature pages, exhibits and tables of contents removed from agreement body text in 93 agreements."
  details: >
    Each filing's pages are labeled front matter, table of contents, body,
    signature or back matter, and only body pages become XML sections. The page
    classifier was replaced with a more accurate model (see Sources & Methods),
    and its labels were rechecked for 1,912 agreements whose stored labels looked
    least reliable. 668 page labels changed across 228 agreements (113 of them
    in 7 hand-labeled agreements whose labels were wrong). In 93 agreements the
    body itself changed: typically a signature page or an attached exhibit (a
    transition services or escrow agreement, for example) had been parsed as
    the agreement's last sections, or a table-of-contents page as its first.
    Their XML and sections were rebuilt; 2 agreements that previously failed XML
    validation now pass. Changes that moved pages only among the non-body
    classes do not affect the XML or sections.
  tables: [xml, sections, latest_sections_search, latest_sections_search_standard_ids]
  refs: ["b5a626a2", "54955dea"]
- type: data
  severity: notable
  summary: "Deal metadata gaps filled: 976 empty fields across 580 agreements."
  details: >
    Fills were written only into empty fields; no existing value changed.
    Missing values dropped for deal_status (647 -> 405), attitude (300 -> 129),
    acquirer_industry (318 -> 261), target_industry (232 -> 188) and purpose
    (113 -> 95).
  tables: [agreements]
- type: data
  severity: notable
  summary: "Deal metadata corrected on about 1,300 agreements, including consideration type on roughly 870 deals previously marked mixed."
  details: >
    An audit of 250 deals found systematic errors, which were then corrected
    across the dataset. 706 agreements were corrected in a first pass: 71 audit
    findings confirmed by an independent second check (45 deal price totals, 13
    close dates, 10 consideration types), 113 deals whose SPAC acquirer is
    listed now recorded as having a public acquirer, 213 deals left as pending
    long after closing resolved to complete or cancelled, and 309 deals marked
    mixed consideration corrected (292 of them to all-stock with the price
    cleaned). A second pass made 631 corrections to deals marked mixed that have
    only one price component; 571 of those changed consideration type. Deals
    marked mixed fell from 4,919 to 4,046. Deal price now means the equity value
    at signing, without earnouts or CVRs, and cash paid in lieu of fractional
    shares no longer makes a deal mixed.
  tables: [agreements]
- type: data
  severity: minor
  summary: "Counsel refreshed for 46 agreements."
  tables: [agreement_counsel, counsel]
# FILL AT PUSH TIME: the gated-queue load (validation session, 2026-10-20) admitted
# 2,171 deals filed 2021-01-04 to 2026-10-08, but they are still being paginated,
# tagged and built. Replace [N] with the number that have verified XML and sections
# at push time, [M] with their section count, and [R] with the originals actually
# retired (58 are planned). Their deal metadata is mostly empty until a later fill.
- type: data
  severity: notable
  summary: "[N] agreements added from a review of the previously unadmitted EDGAR filing queue (filings 2021-01 to 2026-10)."
  details: >
    3,542 EDGAR filings that the automatic title check could not admit were
    reviewed against a written rubric, with a second, independent read of every
    admitted filing: an executed, arm's-length, definitive agreement in which a
    buyer acquires a company or operating business. 2,171 were admitted and
    1,371 rejected. [N] of the admitted deals
    have completed XML and sections in this release, adding [M] searchable
    sections; the rest will follow. Where an admitted filing is an amended and
    restated version of an agreement already in the dataset, the newer version
    replaces the older one ([R] agreements removed). Deal metadata (parties,
    price, consideration) for the new agreements is mostly empty and will be
    filled in a later release.
  tables: [agreements, xml, sections, latest_sections_search]
