    counsel (the notices name none). Served agreements with any counsel: 9,208
    of 9,787 (94.1%) -> 11,375 of 11,979 (95.0%).
  tables: [agreement_counsel, counsel, agreements, latest_sections_search, agreement_filter_option_summary, agreement_counsel_leaderboard_summary]
  migration: >
    counsel_id values are stable for the 1,211 firms in both releases (no
    renames); 187 ids were retired, by folding variants or splitting strings
    that joined two firms, with no forwarding row, and 501 are new.
  refs: ["f341db34"]

