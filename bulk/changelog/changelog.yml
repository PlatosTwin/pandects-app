    by their amended and restated version, which is now served under its own
    agreement_uuid, and 1 agreement filed twice (the earlier copy is kept).
    These agreements rows are deleted. In the previous release no agreements row
    had status 'invalid'; now 1,604 do (1,346 rejected in the EDGAR queue
