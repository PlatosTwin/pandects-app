  refs: ["03a480f2", "#178", "#227"]

- type: data
  severity: breaking
  summary: "298 previously served agreements removed: 226 filings outside the dataset's scope and 72 duplicates. agreements now holds 1,432 rows with status = 'invalid'."
  details: >
    Outside the dataset's scope (226): sponsor drop-downs to a controlled MLP or
    affiliate, guaranties, voting and support agreements, subscription,
    registration-rights and note-purchase agreements, financing documents,
    unexecuted forms and bidder proposals, amendments, proxy statements and an option plan, and 6 side agreements rather than acquisitions (PIPEs, a recapitalization, a block share sale, a JV contribution and a financing), 167 in all.
    59 more were removed after two independent reads. 58 fail the property
    rule: 52 are bare property or lease packages and 6 are vehicles with no
    business of their own (companies that only hold property or projects). 1 is
    the formation of a 50/50 joint venture in which no party gains control, a
    side agreement rather than an acquisition. Their sections, counsel, clauses and index rows are removed, and so is the XML of all but those 6 side agreements, whose latest XML stays with status 'invalid'; the agreements row stays, with status = 'invalid', so the filing is
    not re-ingested. Duplicates (72 served): 71 originals superseded
    by their amended and restated version, which is now served under its own
    agreement_uuid, and 1 agreement filed twice (the earlier copy is kept).
    The agreements rows of 65 of the superseded originals and of the copy filed
    twice are deleted (70 agreements rows deleted in all, counting 4 duplicates
    from the EDGAR queue review). The other 6 superseded originals were removed
    later and keep their agreements row (5 with status 'verified', 1 with no
    status) and their XML, whose latest version has status 'invalid'; their
    sections, counsel and index rows are removed. The last of them is the Disney /
    Fox agreement of December 2017: the amended and restated agreement of June
    20, 2018, the version in force at closing, was added and is served, and the
    2017 row now has deal_status 'cancelled' and no close date. In the previous release no agreements row
    had status 'invalid'; now 1,432 do (1,118 from the EDGAR queue review, the 226 removed above, 21 rejected new filings, and 67 filings that
    were not served in the previous release: 66 rejected after their XML failed
    validation or was never built, and 1 newly served agreement later removed
    under the property rule).
  tables: [agreements, xml, sections, latest_sections_search, latest_sections_search_standard_ids, agreement_counsel, agreement_index_summary, clauses, tax_clause_assignments]
  migration: >
    Count or join served agreements through latest_sections_search or
    agreement_index_summary. Do not derive them from agreements: a plain
    COUNT(*) includes 1,432 invalid rows and other unserved filings, status
    is NULL on most served agreements, so `status <> 'invalid'` drops them, and
    status = 'verified' does not mean served (5 of the 6 superseded originals
    above are among the exceptions). 70
    agreement_uuid values from the previous dump no longer exist; for the 65
    amended and restated replacements, look the deal up by target and acquirer.
    The agreement_uuid values of the other 6 superseded originals still exist in
    agreements but have no sections.
  refs: []

- type: data
  severity: breaking
  summary: "Section text and structure corrected across the corpus: of the 9,489 agreements served in both releases, 4,820 have changed words, 325 have a different number of sections and 2,580 have a changed outline; 656 keep identical section text, though their titles may differ."
  details: >
    Every served XML was rebuilt with the current builder (see the refs below), and at least 1,959 agreements (1,932 of them served, 1,130 continuing) also had reviewed corrections to their heading tags, page labels or source text
    (29,579 text edits, 736 page-label edits). Main changes: (1) Page
    furniture is no longer served as section text: running titles, page numbers,
    document IDs, "Execution Version" and confidentiality legends ("confidential
    treatment requested ... omitted and filed separately with the Securities and
    Exchange Commission"), table-of-contents headers repeated on body pages and
    EDGAR SGML markup. Across all the changes in this entry, 329,508 words were removed from section
    text in continuing agreements, 4,697 agreements lost at least one word and 518 lost 50 or
    more. (2) Headings not detected before are now their own sections: final
    sections folded into the one before, whole articles, sections printed
    without a number, back-to-back headings of the same kind, and closing
    sections that sat on a page labeled as a signature page. 277 agreements gained sections and 48 lost some (signature pages, exhibits and schedules
    that had been served as the last sections, or as the first ones from a table
    of contents); net +597 sections. Section and article titles were cleaned
    (cross-references no longer read as titles, glued words split, heading
    periods and separator dashes dropped), which changes the outline of 2,580 agreements. (3) Spacing and punctuation now follow the filed page: no space
    before closing punctuation, split ordinals and possessives rejoined ("3 rd"
    -> "3rd"), glued words separated, page-text lines the HTML prints as one
    block joined, table rows of malformed HTML emitted once, and HTML paragraphs
    kept in page order. 552 continuing agreements keep the same words in the same order (only spacing, punctuation, markup or section boundaries changed); 136,459 words were added in all (rejoined tokens and recovered text, including the definitions in (5)). (4) A final text pass changed 257 agreements (164 continuing, 91 newly served and 2 since removed)
    with 5,179 text fixes, counted against the text just before that pass; the
    continuing ones are included in the counts above.
    In 210 agreements it repaired inline text (5,118 fixes): page furniture left
    inside sections, words split at a line break ("Sub- sidiary"), leftover Word
    field codes, glued references ("Section3.3"), and lost spaces and hyphens. In
    44 it repaired headings and section structure (58 fixes): headings cut at an
    abbreviation, body text served as a title, and stray numbers or
    cross-references tagged as sections. In 3 it restored to the body a title,
    preamble and recitals that were served only with the table of contents,
    so those agreements now open at the start of the text. (5) Two builder changes were then rolled out, rebuilding 8,754 agreements. A paragraph cut by a page break is now joined into one paragraph where the builder can tell that the sentence continues, with the page number and page id that split it placed after it (about 60,000 cut paragraphs are left as two): 3,461 continuing agreements keep exactly the same words, in a different order, and in nearly all of them only those page markers moved. Stray numbers are no longer promoted to sections, titles cut at an abbreviation or running past the heading now end where the printed heading ends, definitions printed before Article 1 are served as their own article-level section (25 agreements), and table-of-contents lines left above the preamble are no longer served as text (23 agreements). Conventions: an article that prints no sections is served as one
    untitled section holding the article's text (99 agreements have no titled
    section at all, up from 42; 33,757 untitled sections, up from 24,913; 3,159 sections have no text, up from 2,178); a signature block printed on the same
    page as the last clause stays in the body; the testimonium may sit inside
    the last section.
  tables: [xml, sections, latest_sections_search]
  migration: >
    96.0% of section_uuid values survive: 916,755 of the 954,483 previous ids still exist. 11,699 ids in 767 continuing agreements changed (resectioned
    agreements) and 26,029 belong to removed agreements. Re-fetch section ids
    rather than joining on ids saved from the previous dump; to find changed
    agreements, compare sections rather than whole XMLs: no continuing XML is byte-identical, while 723,808 of the 916,755 surviving sections (79.0%) are.
  refs: ["#175", "#177", "#227", "#228", "#229", "#230", "#231", "#232", "#233", "#234", "#235", "#236", "#237", "#238", "#239", "#241", "#242", "#244", "#245", "#246", "#248", "#249", "#250", "#256", "#257", "b5a626a2", "54955dea", "5fc61492", "17706a9b"]

- type: data
  severity: breaking
  summary: "Deal parties and listing status corrected: acquirer changed on 4,351 and target on 3,896 of the 9,489 continuing agreements; acquirer_type on 792, target_type on 544, acquirer_pe on 216, target_pe on 429."
  details: >
    Parties now follow written rules applied to the whole corpus: the acquirer
    and target are the parties the agreement prints (a parent counts only when
    the preamble names it as a party, not when it appears only as a guarantor or
    owner; no roll-ups to a parent found only in SEC filings), a transitory
    merger subsidiary gives way to the parent named as a party while a printed
    buying vehicle stays as printed, a sponsor buying through a vehicle is
    stored as the printed sponsor funds, a portfolio company buying in its own
    name is stored as that company, and names are as at signing. One agreement prints its target only under a code name ("Star plc"); the stored target is the real name, Synergy Health plc, from the 8-K that the agreement is attached to. A name the agreement prints in all capitals is stored in mixed case, and a long final suffix is stored in its short form (Corp., Inc., Ltd., Co.). A later pass set 1,626 party names on 1,511 agreements served at the time (1,484 of them are still served) to the form the agreement prints outside its all-capital lines (letter case and the comma before the suffix). Of the changes counted here, 1,749 target changes and 1,533 acquirer changes are changes of letter case, suffix form or punctuation only. A carve-out target is stored as the seller followed by a business tag between slashes, and the tag uses words the agreement prints. A later pass read every stored tag whose words a script could not find in the agreement and, after an independent second read, changed 679 target names: tags were rewritten in printed words, and a printed target company replaced a parent plus a tag. 1,175 served targets now carry a tag. 18 of them keep their stored tag as an exception: on 11 the agreement prints only a bare term such as "Business", so a descriptive tag stays, and on 7 the readers did not agree. Further passes removed from 139 agreements 150 name tags the agreement does not print (places in brackets and count suffixes such as "(3)"), and 67 EDGAR suffixes such as /Old/, and changed 7 acquirers after two independent reads. In a de-SPAC the SPAC is the acquirer and the operating company the target, even where a new holding company is printed. A check of 1,158 served agreements that print "Trust Account" or "Trust Fund" (a list that includes bank and insurance deals) found 11 de-SPAC rows that did not follow this rule: 8 stored the new public company as the acquirer, 1 stored a spelling of the SPAC that the agreement does not print, and 2 had the target and acquirer reversed (Arbe Robotics / Industrial Tech Acquisitions, and the Ardagh metal packaging business / Gores Holdings V). All 11 now store the SPAC as the acquirer. On the 2 swapped rows the types, industries, counsel and price were set again, and the price follows the de-SPAC price rule. A deal done under a new holding company that becomes the parent of both companies stores the combining company on the buyer's side first and the holding company second ("CIGNA Corp.; Halfmoon Parent, Inc."). The buyer's side is the combining company that is a party in the preamble and is not the stored target; on most rows the agreement prints it as the owner of the holding company at signing. The same form is used where the buyer merges into the new company, or contributes a business to a new company that it owns, and that company acquires the target. Where both companies own the holding company in equal parts (Dow / DuPont), the holding company alone is the acquirer and both companies are the target. Where the agreement prints "merger of equals" and names the new company (Great Plains Energy / Westar, MB Financial / MidCity), the new company alone is also the acquirer and both companies are the target. On the rows that store both companies as the target, the counsel of both is under target_counsel and acquirer_counsel is empty. Where the stored target owns the holding company, the other company goes first if the target's holders are paid cash or the other company takes printed control of the holding company (WWE / Endeavor). If the agreement prints neither, the owner is the buyer, which swapped the target and acquirer on Veritas DGC / Petroleum Geo-Services. This form was set on the largest deals (see the price entry) and then on the other served agreements that three searches of the opening text found. The first search looked for a holding-company term or two named mergers and found 389 candidates of the deal types merger, stock_acquisition and tender_offer. The second search added 665 candidates: the hits of the first search with other deal types or with SPAC words, and agreements with other wording (for example a new holding company, a common parent, or a chain of subsidiaries). The third search read more of the opening text with wider terms (for example "IrishCo") and added 303 candidates. A first reader read the opening text of every candidate. A second reader read each agreement that the first reader kept or could not class, 147 in all, and a third reader tried to disprove each proposed change. 46 more kept candidates of the second and third searches are de-SPACs; they had no second read, because the de-SPAC rule above governs them, and each stores the SPAC as the acquirer. Of the 147, 111 agreements changed: 103 now store the buyer's side and the holding company, and 8 store the new company alone with both companies as the target. 36 keep their stored form (2 of them had a name corrected). The reasons are: the agreement does not have this structure; the holding company has no printed name or is not formed at signing; both companies merge into the new company and the agreement does not print "merger of equals"; the row already stored the new company alone with both companies as the target; the holding company prints the same name as its owner; the holding company is not a party to the agreement; the printed buyer itself acquires the target and the new parent only reorganizes the buyer's owners (U.S. HealthWorks / Concentra); and, on one deal, the stored target's side controls the new company and the stored price is the value of the target's shares (XTEND / JFB Construction). The searches read only the opening text, so a deal that shows the structure only later in the agreement can still be missed. Where a parent spins off a company and that company issues the shares in the combination, the spun-off company alone is the acquirer. On Mylan / Upjohn this swapped the target and acquirer, with their counsel: the acquirer is now Upjohn Inc. A printed
    unlisted subsidiary of a listed parent is a public acquirer; OTC-quoted
    companies are public; non-traded REITs and BDCs and blank-check shells
    without a quote are private. Most changes of substance were checked against the agreement
    text by an independent second read before they were written. Missing parties
    among the served corpus: none (all 12,198 have target and acquirer). Type coverage: target_type 12,198 and acquirer_type 12,198 of 12,198. target_pe now counts only named buyout-style sponsors that hold a majority or a stated control group, not venture-capital, hedge, distressed or credit funds or a minority block. All 2,004 served targets stored at 1 were
    reviewed for venture backing, and hedge and credit holders were then swept
    by manager name, so a few of those may remain: 547 were set to 0, and 203 with an unclear investor
    stayed at 1. The final metadata review then returned 2 of the 547 to 1 (4 more are no longer served) and set 45 other served targets from 1 to 0. Of the 541 still at 0 (475 private, 66 public),
    against the previous release 354 went from 1 to 0, 78 were empty, 9 were
    already 0 and 100 are newly served. The final metadata review read every agreement served at that time (11,973, plus the 6 side agreements later removed) against the agreement text and, where the text did not settle a field, SEC filings or a party's own announcement. Against the values stored just before
    that review, it changed at least one metadata field (parties, types, sponsor
    flags, prices, consideration, deal type, dates, deal status or industries) on 3,291 agreements and counsel on 334, or 3,497 agreements in all. These
    changes, and those of the later check of the largest deals (see the price
    entry), of the holding-company census and of the de-SPAC check, are included in the counts in this entry and in the price and
    counsel entries.
  tables: [agreements, latest_sections_search, agreement_index_summary, agreement_filter_option_summary]
  refs: []

- type: data
  severity: breaking
  summary: "Deal price, consideration and dates corrected: price total changed on 4,383, filled on 675 and cleared on 363 continuing agreements; consideration type changed on 1,081; deal type changed on 664; deal status filled on 170 and changed on 170."
  details: >
    Prices now mean the headline price at signing, including assumed or repaid
    debt and rolled equity, and as signed (not as later amended). The total
    is the value of what the deal acquires: shares that the buyer already
    holds are left out. The rules on stated per-share
    values, seller notes, "up to" headlines, elections and collars, de-SPAC
    prices and late filings below came late, and the rules on rolled equity
    and on shares the buyer already holds came last (see the rollover and
    buyer-owned rereads below). Two readers applied them first to
