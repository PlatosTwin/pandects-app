# Pandects dataset changelog — source of truth.
#
# RULE (humans and agents): any change that alters the public dataset or its
# meaning — bulk/public_tables.txt, bulk/schema_docs/table_docs.yml, DB
# migrations or data fixes affecting allowlisted tables, backend/schemas/
# public_api.py, or the backend/mcp/ tool surface — must append an entry to
# `unreleased:` below IN THE SAME COMMIT. See bulk/changelog/DESIGN.md.
#
# Entry shape (only `unreleased:` is hand-edited; `releases:` is stamped by
# bulk/push_to_r2.sh via render_changelog.py — do not hand-edit it):
#   - type: schema | data | api | mcp | docs | pipeline
#     severity: breaking | notable | minor
#     summary: "One-line, consumer-facing description."
#     details: >            # optional longer prose
#     tables: [agreements]  # optional; must be subset of bulk/public_tables.txt
#     migration: null       # optional guidance/SQL for consumers
#     refs: ["<commit or PR>"]  # optional
#
# severity: breaking = consumer queries against the previous dump can return
# wrong/empty results; notable = results change but queries still run;
# minor = additive/cosmetic.

unreleased:
- type: api
  severity: minor
  summary: 'Added changelog distribution: dumps/changelog.json is published next to
    each dump, GET /v1/changelog serves it (filterable by since/dump_sha256), and
    /v1/dumps entries gain changelog_url'
  refs: ['1eb2010']
- type: mcp
  severity: minor
  summary: get_server_capabilities gains a changelog section (latest release, breaking
    flag, URLs) and the initialize instructions point agents at it
  details: >
    The section reports the newest published release and whether it carries
    breaking changes. Its latest_version, latest_released, and
    breaking_changes_in_latest fields are null when the published changelog is
    unreachable; the url and api_route fields are always populated.
  refs: ['1eb2010']
- type: data
  severity: notable
  summary: 'Fixed SPAC acquirer misattribution: 135 agreements had the Pubco recorded
    as acquirer'
  details: >
    Offline acquirer extraction now disambiguates the SPAC counterparty from the
    surviving Pubco entity. acquirer name fields on 135 agreements rows were
    corrected in place; one agreement (Overture) still awaits a re-scrape.
  tables: [agreements]
  refs: ['0da4871']

