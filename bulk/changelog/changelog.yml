  severity: breaking
  summary: "transaction_price_total on 1,528 deals, 1,509 of them with a public target, was set to the value the parties announced at signing, including the debt-inclusive headline where one was stated; 1,491 still hold it; the cash and stock legs moved with it only on 240 single-form deals."
  details: >
    On public-target deals, the value stated in the announcement press release
    or filing at signing now takes precedence over per-share arithmetic or a
    closing-date value when they differ by more than 5%: 1,409 totals changed
    and 119 were filled, measured against the value stored before this pass. The final metadata
    review, the later price passes, the check of the largest deals and the rollover, buyer-owned and stock-value rereads then left 36 of these totals changed and 1 cleared. Against the previous
    release, 1,368 changed, 91 were filled, 15 match and 1 was cleared among the 1,475 continuing agreements; the other 53 are newly served. Where
    the release states a value including assumed or
    repaid debt, or the deal's enterprise value, the total holds that figure, less the buyer's own stake where a source prints its size. The final metadata review also took a value from a party's own release page or investor deck where EDGAR holds none; a combined-company or pro forma value never counts.
    Mixed cash-and-stock deals where no party values the stock get
    the announced total, and the stock leg stays empty. On 240 single-form
    deals the cash or stock leg moved with the total: 17 were checked against
    share counts, and on the other 223 the value is at most 25% above the
    prior leg and can include some debt. 15 further legs were corrected from the
    filings. All other legs are untouched by this entry. Now 203
    of the legs set from the announced value still hold it. These totals come
    from the release, not the agreement, and metadata_sources cites it. A deal with no announced value in the filer's own announcement filings (or, in the final metadata review, a party's own release page or deck) keeps its existing total, so across public targets the field holds a debt-inclusive
    value on some deals and an equity value on others. Other private-target
    deals are unchanged by this entry. The 1,475 continuing agreements are
    included in the price counts in the entry above. The later passes on deals
    with an empty total (465 filled) are described and counted in the entry above.
  tables: [agreements, latest_sections_search, summary_data, agreement_ownership_deal_size_summary, agreement_ownership_mix_summary, agreement_buyer_type_matrix_summary, agreement_industry_pairing_summary, agreement_counsel_leaderboard_summary]
  migration: >
    transaction_price_total need not equal the sum of transaction_price_cash,
    transaction_price_stock, transaction_price_assets and
    transaction_price_rollover: it exceeds that sum by more than 1% on 2,761 served agreements (10 of them hold a rollover value and no leg) and falls below it by more than 1% on 32 (by 2% to 5% on 12 of them, and by more than 5% on none). Do not test
    total = cash + stock + assets + rollover, and do not treat the gap as an
    exact debt figure: an empty leg or an empty rollover field also leaves a
    gap. The legs are the closest measure of what holders receive in cash,
    stock and assets, with three limits: on the 203 deals above the leg holds
    the announced value; a leg is empty where no party prints a value for it at signing
    (the stock leg on 636 served mixed deals that have a total); and 362 served deals with a total have no legs (10 of them hold a rollover value). No field gives a like-for-like
