# Pandects dataset changelog — source of truth.
#
# RULE (humans and agents): any change that alters the public dataset or its
# meaning — bulk/public_tables.txt, bulk/schema_docs/table_docs.yml, DB
# migrations or data fixes affecting allowlisted tables, backend/schemas/
# public_api.py, or the backend/mcp/ tool surface — must append an entry to
# `unreleased:` below IN THE SAME COMMIT. See bulk/changelog/DESIGN.md.
#
# Entry shape (only `unreleased:` is hand-edited; `releases:` is stamped by
# bulk/push_to_r2.sh via render_changelog.py — do not hand-edit it):
#   - type: schema | data | api | mcp | docs | pipeline
#     severity: breaking | notable | minor
#     summary: "One-line, consumer-facing description."
#     details: >            # optional longer prose
#     tables: [agreements]  # optional; must be subset of bulk/public_tables.txt
#     migration: null       # optional guidance/SQL for consumers
#     refs: ["<commit or PR>"]  # optional
#
# severity: breaking = consumer queries against the previous dump can return
# wrong/empty results; notable = results change but queries still run;
# minor = additive/cosmetic.

unreleased:
- type: schema
  severity: notable
  summary: "latest_sections_search.target and .acquirer widened from varchar(512) to varchar(1024); their two indexes now cover the first 600 characters."
  details: >
    Some acquirer lists (sponsor consortia and their printed funds) are longer
    than 512 characters; the longest served acquirer is now 882 characters and 7 served agreements exceed 512 in one of the two columns (6 acquirers, 1 target). idx_lss_target_section and
    idx_lss_acquirer_section are now (target(600), section_uuid) and
    (acquirer(600), section_uuid) instead of full-column indexes.
    agreements.target and .acquirer (varchar(2048)) are unchanged.
  tables: [latest_sections_search]
  migration: >
    A plain restore of the dump needs no action, because the dump creates the
    table with the new definition. If you load the data into a table you created
    yourself, change the columns and the indexes together first; a full index on
    varchar(1024) is too long for InnoDB in utf8mb4: `ALTER TABLE
    latest_sections_search DROP INDEX idx_lss_target_section, DROP INDEX
    idx_lss_acquirer_section, MODIFY target varchar(1024) NULL, MODIFY acquirer
    varchar(1024) NULL, ADD INDEX idx_lss_target_section (target(600),
    section_uuid), ADD INDEX idx_lss_acquirer_section (acquirer(600),
    section_uuid);` With the old varchar(512) columns, the rows of those 7 agreements fail to load, or are cut at 512
    characters outside strict SQL mode. Equality and prefix lookups return the
    same rows as before, but sorting on these columns can no longer be read from
    the index.
  refs: []

- type: data
  severity: notable
  summary: "Served agreements 9,787 -> 12,198 (+2,709 added, -298 removed) and searchable sections 954,483 -> 1,196,580; this release is mostly a data-quality release (see the entries below)."
  details: >
    "Served" means the agreement has a verified XML and rows in
    latest_sections_search. Of the 9,787 agreements served in 2026-09-09, 9,489 are still served; 298 were removed (226 filings outside the dataset's scope, 72 duplicates). 2,709 are newly served: 2,231 from a review of the
    previously unadmitted EDGAR queue, 135 newly filed (2026-08-17 to
    2026-10-09), 297 whose XML previously failed validation, 45 that
    previously had no XML, and the amended and restated Disney / Fox agreement
    of June 2018, which replaces its served original of December 2017 (see the
    removal entry). Every served XML was rebuilt with the current builder
    (none of the 9,489 continuing agreements has a byte-identical XML), so text,
    sections and metadata changed widely; the entries below give the exact
    counts. Words in served section text: 385.1M -> 474.8M. The taxonomy
    (standard_id) labels are not yet rebuilt. Not served, besides the 1,432 rows with agreements.status = 'invalid': 8 superseded originals whose amended and restated version is served (see the removal entry), 5 duplicates of a served agreement, 2 side agreements, and 571 filings that the page splitter leaves at 10 pages or fewer, so no XML is built for them
    (a known limit).
  tables: [agreements, xml, sections, latest_sections_search]
  refs: []

- type: data
  severity: notable
  summary: "2,231 agreements added from a review of the previously unadmitted EDGAR filing queue (filings 2021-01-04 to 2026-08-13), with 221,766 searchable sections."
  details: >
    The automatic title check had held EDGAR filings out of the dataset. Each
    was reviewed against a written rubric (an executed, arm's-length, definitive
    agreement in which a buyer acquires a company or operating business), with a
    second, independent read of every admitted filing. A later pass re-read the filings that were rejected only because the
    preamble leaves the date blank. It found 48 valid: 39 are now served (37 from
    this queue and 2 from the monthly load below), 7 cannot be split into pages,
    1 is a superseded original and 1 is held for review; these 9 keep status
    'invalid'. A second reader then read the 1,059 other rejected filings that had
    only one read (1,038 from this queue and 21 from the monthly load below): 729
    stay rejected, 263 were held for a ruling and 67 were found valid. A third,
    independent reader confirmed 38 of the 67, rejected 7 and held 22, and 3 more
    of the 38 were held. Of the other 35, 31 are now served (29 from this
    queue and 2 from the monthly load), 3 cannot be split into pages and 1 is a
    duplicate of a served agreement. The maintainer then ruled on the 288 held
    filings by class (draft legends on signed copies, control stakes below 100%,
    property and plant sales, related-party deals and the like): 185 were
    admitted and 103 stay rejected. Of the 185, 161 are now served (155 from this
    queue and 6 from the monthly load), 14 cannot be split into pages, 5 are
    duplicates of a served agreement, 2 are side agreements and 3 are outside the
    dataset's scope. Each of the 161 has reviewed page labels, a structure check
    against the filed document, metadata from two readers and counsel from its
    notices section where it names a law firm (129 of the 161). The rejected and unsplit filings keep status 'invalid'. Of
    the filings rejected in the first review, those with no second read are
    duplicates of other filings or filings on which two readers already agreed.
    2,231 of the
    queue filings now have verified XML and sections. 1,118 carry
    agreements.status = 'invalid': the filings rejected (duplicates of filings already in the queue or
    dataset, single-asset and property sales, oil and gas packages, affiliate
    deals, minority stakes and joint ventures, unexecuted forms, financing
    documents, shells and the like), held, left unsplit or found outside the dataset's scope as above; 4 more duplicates were deleted. 106 others passed review but are not served:
    97 have no XML, 5 are duplicates of a served agreement, 2 are side agreements,
    and 2 are superseded originals whose amended and restated version is served
    (see the removal entry). Their pages
    were labeled and checked by model reviewers and their XML went through the
    same validation as the rest of the corpus. Metadata is filled: target,
    acquirer, consideration, deal type and announce date for all 2,231, price
    total for 1,920 (86%; the rest state no price, or pay in stock that no party
    values), target counsel for 1,918. Their sections carry no taxonomy
    label (standard_id) until the taxonomy is rebuilt, so filtering sections by
    clause type does not yet return them.
  tables: [agreements, xml, sections, latest_sections_search, agreement_counsel]
  refs: ["4f2873ed"]

