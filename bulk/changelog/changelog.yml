    assumes counts as debt, which makes 5 deals stock); served deals
    marked mixed 3,193 -> 3,069 while the corpus grew by 2,411. Deal type: a two-step deal (a tender or exchange offer followed by a back-end merger) is now tender_offer, so 615 continuing agreements moved from merger to tender_offer. A scheme or plan of arrangement under which the buyer acquires the shares of the stored target is now stock_acquisition, while an arrangement carried out as an amalgamation of the target stays merger: after a read of each candidate, 92 served agreements moved from merger to stock_acquisition (4 of the largest deals and 88 from a sweep of the other served agreements), 30 of them continuing agreements (29 of these were merger in the previous release and 1 was tender_offer). Deal status: 154
    empty and 125 pending deals are now complete, 34 pending and 15 empty are now 'cancelled' (a deal that went dark, delisted or passed its deadline without closing is 'cancelled', and so is a deal the parties replaced with a new agreement that closed); empty deal_status among served agreements 182 -> 3. Close date filled on 280, changed on 117 and cleared on 35 (it is the last closing of a staged deal, and empty where sources give only the month); announce date changed on 205 and filled on 11 (it is the announcement of the signed agreement, not of an earlier offer; for a served amended and restated agreement it is the announcement of the restated agreement, which changed 105 dates).
