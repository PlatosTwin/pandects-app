- type: data
  severity: breaking
  summary: "Section text and structure corrected across the corpus: of the 9,489 agreements served in both releases, 4,820 have changed words, 325 have a different number of sections and 2,580 have a changed outline; 656 keep identical section text, though their titles may differ."
  details: >
    Every served XML was rebuilt with the current builder (see the refs below), and at least 1,958 agreements (1,931 of them served, 1,130 continuing) also had reviewed corrections to their heading tags, page labels or source text
    (29,547 text edits, 736 page-label edits). Main changes: (1) Page
    furniture is no longer served as section text: running titles, page numbers,
    document IDs, "Execution Version" and confidentiality legends ("confidential
    treatment requested ... omitted and filed separately with the Securities and
    Exchange Commission"), table-of-contents headers repeated on body pages and
    EDGAR SGML markup. Across all the changes in this entry, 329,508 words were removed from section
    text in continuing agreements, 4,697 agreements lost at least one word and 518 lost 50 or
    more. (2) Headings not detected before are now their own sections: final
    sections folded into the one before, whole articles, sections printed
    without a number, back-to-back headings of the same kind, and closing
    sections that sat on a page labeled as a signature page. 277 agreements gained sections and 48 lost some (signature pages, exhibits and schedules
    that had been served as the last sections, or as the first ones from a table
    of contents); net +597 sections. Section and article titles were cleaned
    (cross-references no longer read as titles, glued words split, heading
    periods and separator dashes dropped), which changes the outline of 2,580 agreements. (3) Spacing and punctuation now follow the filed page: no space
    before closing punctuation, split ordinals and possessives rejoined ("3 rd"
    -> "3rd"), glued words separated, page-text lines the HTML prints as one
    block joined, table rows of malformed HTML emitted once, and HTML paragraphs
    kept in page order. 552 continuing agreements keep the same words in the same order (only spacing, punctuation, markup or section boundaries changed); 136,459 words were added in all (rejoined tokens and recovered text, including the definitions in (5)). (4) A final text pass changed 257 agreements (164 continuing, 91 newly served and 2 since removed)
    with 5,179 text fixes, counted against the text just before that pass; the
    continuing ones are included in the counts above.
    In 210 agreements it repaired inline text (5,118 fixes): page furniture left
    inside sections, words split at a line break ("Sub- sidiary"), leftover Word
    field codes, glued references ("Section3.3"), and lost spaces and hyphens. In
    44 it repaired headings and section structure (58 fixes): headings cut at an
    abbreviation, body text served as a title, and stray numbers or
    cross-references tagged as sections. In 3 it restored to the body a title,
    preamble and recitals that were served only with the table of contents,
    so those agreements now open at the start of the text. (5) Two builder changes were then rolled out, rebuilding 8,754 agreements. A paragraph cut by a page break is now joined into one paragraph where the builder can tell that the sentence continues, with the page number and page id that split it placed after it (about 60,000 cut paragraphs are left as two): 3,461 continuing agreements keep exactly the same words, in a different order, and in nearly all of them only those page markers moved. Stray numbers are no longer promoted to sections, titles cut at an abbreviation or running past the heading now end where the printed heading ends, definitions printed before Article 1 are served as their own article-level section (25 agreements), and table-of-contents lines left above the preamble are no longer served as text (23 agreements). Conventions: an article that prints no sections is served as one
    untitled section holding the article's text (99 agreements have no titled
    section at all, up from 42; 33,757 untitled sections, up from 24,913; 3,160 sections have no text, up from 2,178); a signature block printed on the same
    page as the last clause stays in the body; the testimonium may sit inside
    the last section.
  tables: [xml, sections, latest_sections_search]
  migration: >
    96.0% of section_uuid values survive: 916,755 of the 954,483 previous ids still exist. 11,699 ids in 767 continuing agreements changed (resectioned
    agreements) and 26,029 belong to removed agreements. Re-fetch section ids
    rather than joining on ids saved from the previous dump; to find changed
    agreements, compare sections rather than whole XMLs: no continuing XML is byte-identical, while 723,808 of the 916,755 surviving sections (79.0%) are.
  refs: ["#175", "#177", "#227", "#228", "#229", "#230", "#231", "#232", "#233", "#234", "#235", "#236", "#237", "#238", "#239", "#241", "#242", "#244", "#245", "#246", "#248", "#249", "#250", "#256", "#257", "b5a626a2", "54955dea", "5fc61492", "17706a9b"]

- type: data
  severity: breaking
  summary: "Deal parties and listing status corrected: acquirer changed on 4,339 and target on 3,893 of the 9,489 continuing agreements; acquirer_type on 786, target_type on 540, acquirer_pe on 216, target_pe on 429."
  details: >
    Parties now follow written rules applied to the whole corpus: the acquirer
    and target are the parties the agreement prints (a parent counts only when
    the preamble names it as a party, not when it appears only as a guarantor or
    owner; no roll-ups to a parent found only in SEC filings), a transitory
    merger subsidiary gives way to the parent named as a party while a printed
    buying vehicle stays as printed, a sponsor buying through a vehicle is
    stored as the printed sponsor funds, a portfolio company buying in its own
    name is stored as that company, and names are as at signing. A name the agreement prints in all capitals is stored in mixed case, and a long final suffix is stored in its short form (Corp., Inc., Ltd., Co.). A later pass set 1,626 party names on 1,511 agreements served at the time (1,484 of them are still served) to the form the agreement prints outside its all-capital lines (letter case and the comma before the suffix). Of the changes counted here, 1,752 target changes and 1,538 acquirer changes are changes of letter case, suffix form or punctuation only. A carve-out target is stored as the seller followed by a business tag between slashes, and the tag uses words the agreement prints. A later pass read every stored tag whose words a script could not find in the agreement and, after an independent second read, changed 679 target names: tags were rewritten in printed words, and a printed target company replaced a parent plus a tag. 1,174 served targets now carry a tag. 18 of them keep their stored tag as an exception: on 11 the agreement prints only a bare term such as "Business", so a descriptive tag stays, and on 7 the readers did not agree. Further passes removed from 139 agreements 150 name tags the agreement does not print (places in brackets and count suffixes such as "(3)"), and 67 EDGAR suffixes such as /Old/, and changed 7 acquirers after two independent reads. In a de-SPAC the SPAC is the acquirer and the operating company the target, even where a new holding company is printed. A deal done under a new holding company that becomes the parent of both companies stores the combining company on the buyer's side first and the holding company second ("CIGNA Corp.; Halfmoon Parent, Inc."). The buyer's side is the combining company that is a party in the preamble and is not the stored target; on most rows the agreement prints it as the owner of the holding company at signing. The same form is used where the buyer merges into the new company, or contributes a business to a new company that it owns, and that company acquires the target. Where both companies own the holding company in equal parts (Dow / DuPont), the holding company alone is the acquirer and both companies are the target. This form was set on the largest deals (see the price entry) and then on the other served agreements that a text search found. The search of the opening text found 389 candidates of the deal types merger, stock_acquisition and tender_offer. A first reader kept 102 of them, a second reader read each of those agreements, and a third reader tried to disprove each proposed change. 83 agreements changed: 78 now store the buyer's side and the holding company, and 5 store the holding company alone with both companies as the target. 19 stay as stored. They include deals where the holding company has no printed name at signing, deals where both companies merge into the new company, and 3 deals where the third reader doubted which side is the buyer. The search looks for a holding-company term or two named mergers in the opening text. It can miss a deal that uses other words. It did not cover asset and membership-interest purchases, and it left out deals with SPAC words in the opening text. Where a parent spins off a company and that company issues the shares in the combination, the spun-off company alone is the acquirer. On Mylan / Upjohn this swapped the target and acquirer, with their counsel: the acquirer is now Upjohn Inc. A printed
    unlisted subsidiary of a listed parent is a public acquirer; OTC-quoted
    companies are public; non-traded REITs and BDCs and blank-check shells
    without a quote are private. Most changes of substance were checked against the agreement
    text by an independent second read before they were written. Missing parties
    among the served corpus: none (all 12,198 have target and acquirer). Type coverage: target_type 12,198 and acquirer_type 12,198 of 12,198. target_pe now counts only named buyout-style sponsors that hold a majority or a stated control group, not venture-capital, hedge, distressed or credit funds or a minority block. All 2,004 served targets stored at 1 were
    reviewed for venture backing, and hedge and credit holders were then swept
    by manager name, so a few of those may remain: 547 were set to 0, and 203 with an unclear investor
    stayed at 1. The final metadata review then returned 2 of the 547 to 1 (4 more are no longer served) and set 45 other served targets from 1 to 0. Of the 541 still at 0 (474 private, 67 public),
    against the previous release 354 went from 1 to 0, 78 were empty, 9 were
    already 0 and 100 are newly served. The final metadata review read every agreement served at that time (11,973, plus the 6 side agreements later removed) against the agreement text and, where the text did not settle a field, SEC filings or a party's own announcement. Against the values stored just before
    that review, it changed at least one metadata field (parties, types, sponsor
    flags, prices, consideration, deal type, dates, deal status or industries) on 3,291 agreements and counsel on 334, or 3,497 agreements in all. These
    changes, and those of the later check of the largest deals (see the price
    entry) and of the holding-company census, are included in the counts in this entry and in the price and
    counsel entries.
  tables: [agreements, latest_sections_search, agreement_index_summary, agreement_filter_option_summary]
  refs: []

- type: data
  severity: breaking
  summary: "Deal price, consideration and dates corrected: price total changed on 3,757, filled on 576 and cleared on 477 continuing agreements; consideration type changed on 880; deal type changed on 664; deal status filled on 170 and changed on 170."
  details: >
    Prices now mean the headline price at signing, including assumed or repaid
    debt, and as signed (not as later amended). The rules on stated per-share
    values, seller notes, "up to" headlines, elections and collars, de-SPAC
    prices and late filings below came last. Two readers applied them first to
    the price rows held for a ruling (114 agreements). A full price pass then
    read 3,075 agreements, most of them filed since November 2021 (see the end
    of this entry). Some of the finer points below were settled while that pass
    ran, and agreements read before a point was settled were not all read
    again. The other 9,123 served agreements have not had this pass: 2,486 had
    a two-reader price read in the earlier passes or when they were added, and
    6,637, all filed before 2021-11-11, have not had a two-reader price read
    under these rules, apart from 90 of them that are among the largest deals
    (see the end of this entry). Earnouts, CVRs and other contingent payments are in no
    leg. They count in the total only where a party prints the combined
    figure "up to $X" in the signing release or the signing 8-K, which is then
    stored as X. Shares the buyer already
    owns and shares that holders roll over are left out of the total; their
    count may come from the merger proxy or a Schedule 13D or 13E-3 where no
    signing source prints it. The exception is the check of the largest deals:
    there a headline value that the parties announced for the whole company
    stays as the total, and only the legs leave those shares out. The headline comes from the signed agreement, except mainly on public-target deals, where the value the parties announced at signing takes precedence (see the
    separate entry on announced values). Elsewhere a stock leg is valued only
    where a party states a per-share value that holders get (in the signing
    release, an investor deck, or the agreement's own collar or reference price)
    and a signing source prints the share count; a market price quoted in passing
    does not count. A stock leg with no such value is cleared, and so is the
    total unless a party release states one. Where no single total is printed but its pieces are, the total is arithmetic on printed figures only (a per-share price times a printed share count, or cash plus separately stated assumed debt); a partial purchase is priced at what is actually bought; an agreement buying several separately printed companies lists them all as the target and sums their prices; a deal priced in a foreign currency has a USD price only where the agreement or a party's release prints one; a price that depends on an election, collar or cap settled after signing holds the base case or cap printed at signing; and a de-SPAC price is the equity value the agreement prints for the target holders' shares at the SPAC share price (usually $10.00) plus printed cash, never a pro forma or combined value; earnout shares count in no field. An exchange-ratio valuation in a reverse merger or a merger of equals is not a price; a party's statement that the deal values the target at a stated amount counts. Legs follow the same standard: a leg holds a dollar figure that a party prints for that leg, valued at signing, or arithmetic on printed figures, such as a per-share price times a printed share count. A seller note, or a fixed cash payment due on a fixed date or schedule more than 90 days after closing, goes in the assets leg; deferred stock stays in the stock leg; cash plus such a payment has the consideration label mixed. A closing-date or purchase-accounting value does not count, and neither does a leg that no party prints and that is only a share or a difference of other figures. A value a party prints only in a later filing counts only when its value date is within 7 days of signing; an implied value a party prints in the proxy as of such a date counts. A leg with no such figure is empty, except the 224 legs set from the announced value (next entry). Price total coverage among served agreements rose from
    89.4% (8,752 of 9,787) to 89.5% (10,921 of 12,198). Among
    continuing agreements 477 totals were cleared, mostly where no party values
    a stock leg, and 576 were filled (89.5% -> 90.5%). The 2,709
    newly served agreements have lower coverage (86.0%). Two later passes read
    the parties' signing announcement (a release, an 8-K or an investor deck)
    for served deals with an empty total. The first read 676 of the 1,673 served
    deals that then had an empty total and filled 353 (346 with a private
    target); 243 had no usable party figure, and 80 were held for review. The
    second read 485 more, each with a public target or mixed consideration, and
    filled 112 (105 with a private target); 304 had no usable party figure, and
    69 were held for review. A second, independent reader confirmed each
    fill, and metadata_sources cites the source. A leg was filled only where the
    source prints that leg's own dollar value (166 legs in the first pass, 38 in
    the second). Of the 465 filled, 349 are continuing agreements: 62 count as
    filled and 225 as changed in this entry, 61 hold their 2026-09-09 total
    again and 1 was later cleared. The other 116 are newly served. Two further passes, each with two
    readers, checked price legs against the standard above. The first read 504
    served deals whose stock leg matched only a closing-date source and changed
    395 fields on 229 of them. The second read 652 deals (legs above the total
    by more than 5%, cash or asset legs cited to a post-closing filing, and
    all-cash deals with an empty cash leg) and, with the fixes from two blind
    samples, changed 366 fields on 268 agreements, 343 of them price fields.
    After these passes two blind samples of 60 served agreements each were read
    field by field. In the second, 7 of 240 price fields and 4 of about 1,020
    other fields were wrong, on 8 agreements, and those errors were corrected,
    apart from a few held for a ruling. Price legs are the least reliable fields.
    The maintainer then ruled on the cases that had been held (the rules above on
    stated per-share values, seller notes, "up to" headlines, elections and
    collars, de-SPAC prices and late filings). Two readers read the held rows
    again under these rulings, and 150 price fields changed on 114 agreements.
    Of the 149 deals held with an empty total in the two passes on empty totals,
    43 now have a total and 106 are empty. 25 price fields on 23 agreements stay
    held for review, 13 of them totals of those 149 deals.
    The full price pass then read 3,075 served agreements: the 3,000 filed from
    2021-11-12 to 2026-10-09 whose price row no earlier two-reader pass had
    read, 60 filed in 2005 and 2018, and 15 whose legs exceeded the total. A
    first reader checked the total, the three legs and the consideration label
    against the agreement and the signing announcement. A second reader checked
    every proposed change. Where the two did not agree, a third reader or a
    final review decided. The pass changed 1,307 fields on 736 agreements:
    totals 301 changed, 53 filled and 91 cleared; cash legs 237 changed, 37
    filled and 94 cleared; stock legs 70 changed, 46 filled and 127 cleared;
    asset legs 3 changed, 106 filled and 21 cleared; and 121 consideration
    labels. The readers most often found values from closing documents or
    purchase accounting, deferred payments and seller notes stored in the cash
    leg, legs that were only a share or a difference of other figures, "up to"
    headlines whose contingent part was missed, and totals that counted
    rolled-over or buyer-owned shares. After the pass a blind sample of 60 of
    the 3,000 agreements found a price error on 2 (3 of 300 price and label
    fields); both errors were corrected. In the second sample above, 5 of the
    60 agreements had a price error. This sample measures only the agreements the pass read.
    The largest deals were then checked separately: the 100 largest of the
    whole dataset and the 10 largest of each announcement year from 2015 on, by
    stored total, plus 30 large deals whose total was empty or had been
    lowered, so that a wrong empty total could not keep a deal off the list.
    After the fixes the list was drawn again, and two readers read the 5
    further deals that entered it in the same way: 190 agreements in all, 189
    of them still served (50 read in the full price pass, 49 with an earlier
    two-reader price read and 90 with neither). Two readers each read 13
    fields against the agreement and SEC filings or a party's announcement,
    without seeing the stored values or each other's read. The fields are
    target, acquirer, both party types, deal type, announce and close date,
    deal status, consideration type, the total and the three legs. A final
    review read every proposed change and kept some stored values. The check
    changed 144 fields on 89 served agreements. For 17 of them the two reads
    agreed with each other against the stored value. For 121, on the first 185
    agreements, a third reader decided between the two reads and the stored
    value. For 6, on the 5 later agreements, the final review decided. Of the
    144, 114 are price and consideration fields on 75 agreements (totals 14
    changed, 12 filled and 3 cleared; cash legs 15 changed, 4 filled and 6
    cleared; stock legs 18 changed, 28 filled and 7 cleared; asset legs 1
    changed, 2 filled and 1 cleared; 3 consideration types) and 30 are other
    fields (8 acquirers, 7 targets, 4 party types, 7 announce dates, 3 close
    dates and 1 deal status). 2 of the filled totals are stock mergers whose
    total the full price pass had cleared; they now hold an implied value that
    a party prints in the proxy as of a date within 7 days of signing. On
    Pfizer / Allergan the total stays the announced $160 billion and the cash
    leg is empty, because holders could elect cash only within a printed
    range.
    Stock price legs: 1,292 cleared, 739 changed; cash legs: 1,781 changed, 724 cleared; asset legs: 399 cleared. Of the cleared legs, 138 stock, 207 cash and 156 asset
    legs were stored zeros. Consideration type: 428 mixed deals are now cash and 419 now stock
    (a deal with one real form of payment is no longer mixed, cash plus a seller
    note or a fixed deferred payment is mixed, cash paid in
    lieu of fractional shares does not count as a second form, and cash paid to
