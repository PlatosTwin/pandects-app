    260). A second reader checked every proposed change or hold (871 fields
    on 581 agreements: 608 confirmed, 104 rejected, 159 held). A third reader
    decided 273 fields on 191 agreements (104 set, 165 kept, 4 held) and
    added 6 fields so that a row fits, and a final review decided 20 fields
    on 15 agreements. The reread changed 705 fields on 469 agreements: 458
    stock legs filled; totals 201 filled and 4 changed; cash legs 31 filled,
    2 changed and 2 cleared; 2 asset legs cleared; 4 buyer-owned values
    filled; and 1 consideration label (1 of the cleared cash legs and 1 of
    the cleared asset legs were a stored zero on one agreement, found by a
    data check). Of the 260 with a private acquirer, 13 changed (21 fields).
    On 195 agreements the stock value was the missing piece
    of the total, and both were filled. These counts are not part of the
    counts of the passes above. 21 of these fields had also been changed by
    the fourth part and 99 by the first three parts; 95 of the 99 (75 stock
    legs, 17 totals and 3 cash legs) had been cleared by those parts and were
    filled again here, from a value that a party states. On Flyers Energy /
    World Fuel Services the cash leg was cleared, because no party prints the
