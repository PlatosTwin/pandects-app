    compared with the stored rows after every change of the stock-value
    reread. They differed by more than 5% on 10 fields of 9 agreements. A
    third reader checked each against the sources and found the stored value
    wrong on 5 fields of 4 agreements (5 of 420 price and label fields) and
    right on the other 5. A final review kept 1 of the 5 (below). The other 4
    fields, on 3 agreements, were corrected: JH Capital Group / Easterly
    Acquisition (a $1 million cash leg cleared; label mixed, now stock),
    ViroPharma / Shire (cash leg now $4.2 billion, the total consideration
    that the release states for an all-cash deal, instead of $3.30 billion)
    and Omthera Pharmaceuticals / Zeneca (AstraZeneca; total now $443 million,
    the total potential value with the contingent payments that the release
    states, instead of $323 million). The field that was kept is the stock leg
    of Panhandle Eastern Pipe Line / Southern Union ($38.4 million), which the
