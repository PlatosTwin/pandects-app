    because a quarterly report that the seller's group filed within days of
    signing prints the signing-day share price in its statement of the value
    of the deal, and the legs with the assumed debt then sum to the $1.79
    billion purchase price that the buyer's release states. None of the
    errors was an empty stock leg that a party values. These 4 fields are not
    part of the counts of the passes above. The five blind samples taken
    after the full price pass found a price error on 2, 2, 0, 5 and 3 of
    their 60 agreements.
    Stock price legs: 814 cleared, 1,540 changed; cash legs: 2,418 changed, 792 cleared; asset legs: 435 cleared. Of the cleared legs, 131 stock, 206 cash and 155 asset
    legs were stored zeros. Consideration type: 489 mixed deals are now cash and 492 now stock
