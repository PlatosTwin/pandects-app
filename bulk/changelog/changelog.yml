# Pandects dataset changelog — source of truth.
#
# RULE (humans and agents): any change that alters the public dataset or its
# meaning — bulk/public_tables.txt, bulk/schema_docs/table_docs.yml, DB
# migrations or data fixes affecting allowlisted tables, backend/schemas/
# public_api.py, or the backend/mcp/ tool surface — must append an entry to
# `unreleased:` below IN THE SAME COMMIT. See bulk/changelog/DESIGN.md.
#
# Entry shape (only `unreleased:` is hand-edited; `releases:` is stamped by
# bulk/push_to_r2.sh via render_changelog.py — do not hand-edit it):
#   - type: schema | data | api | mcp | docs | pipeline
#     severity: breaking | notable | minor
#     summary: "One-line, consumer-facing description."
#     details: >            # optional longer prose
#     tables: [agreements]  # optional; must be subset of bulk/public_tables.txt
#     migration: null       # optional guidance/SQL for consumers
#     refs: ["<commit or PR>"]  # optional
#
# severity: breaking = consumer queries against the previous dump can return
# wrong/empty results; notable = results change but queries still run;
# minor = additive/cosmetic.

unreleased:
- type: schema
  severity: notable
  summary: "latest_sections_search.target and .acquirer widened from varchar(512) to varchar(1024); their two indexes now cover the first 600 characters."
  details: >
    Some acquirer lists (sponsor consortia and their printed funds) are longer
    than 512 characters; the longest served acquirer is now 885 characters and 5
    served agreements exceed 512. idx_lss_target_section and
    idx_lss_acquirer_section are now (target(600), section_uuid) and
    (acquirer(600), section_uuid) instead of full-column indexes.
    agreements.target and .acquirer (varchar(2048)) are unchanged.
  tables: [latest_sections_search]
  migration: >
    A plain restore of the dump needs no action, because the dump creates the
    table with the new definition. If you load the data into a table you created
    yourself, change the columns and the indexes together first; a full index on
    varchar(1024) is too long for InnoDB in utf8mb4: `ALTER TABLE
    latest_sections_search DROP INDEX idx_lss_target_section, DROP INDEX
    idx_lss_acquirer_section, MODIFY target varchar(1024) NULL, MODIFY acquirer
    varchar(1024) NULL, ADD INDEX idx_lss_target_section (target(600),
    section_uuid), ADD INDEX idx_lss_acquirer_section (acquirer(600),
    section_uuid);` With the old varchar(512) columns, the rows of the 5
    agreements with longer acquirer lists fail to load, or are cut at 512
    characters outside strict SQL mode. Equality and prefix lookups return the
    same rows as before, but sorting on these columns can no longer be read from
    the index.
  refs: []

- type: data
  severity: notable
  summary: "Served agreements 9,787 -> 11,979 (+2,419 added, -227 removed) and searchable sections 954,483 -> 1,175,540; this release is mostly a data-quality release (see the entries below)."
  details: >
    "Served" means the agreement has a verified XML and rows in
    latest_sections_search. Of the 9,787 agreements served in 2026-09-09, 9,560
    are still served; 227 were removed (161 filings outside the dataset's scope,
    66 duplicates). 2,419 are newly served: 1,997 from a review of the
    previously unadmitted EDGAR queue, 125 newly filed (2026-08-17 to
    2026-10-09), 253 whose XML previously failed validation and 44 that
    previously had no XML. Every served XML was rebuilt with the current builder
    (only 1 of 9,560 continuing agreements has a byte-identical XML), so text,
    sections and metadata changed widely; the entries below give the exact
    counts. Words in served section text: 385.1M -> 467.5M. The taxonomy
    (standard_id) labels are not yet rebuilt, and 61 filings whose XML cannot be
    validated are not served.
  tables: [agreements, xml, sections, latest_sections_search]
  refs: []

- type: data
  severity: notable
  summary: "1,997 agreements added from a review of the previously unadmitted EDGAR filing queue (filings 2021-01-04 to 2026-08-13), with 199,378 searchable sections."
  details: >
    The automatic title check had held EDGAR filings out of the dataset. Each
    was reviewed against a written rubric (an executed, arm's-length, definitive
    agreement in which a buyer acquires a company or operating business), with a
    second, independent read of every admitted filing. 1,997 of them now have
    verified XML and sections. 1,346 were rejected and now carry
    agreements.status = 'invalid' (duplicates of filings already in the queue or
    dataset, single-asset and property sales, oil and gas packages, affiliate
    deals, minority stakes and joint ventures, unexecuted forms, financing
    documents, shells and the like); 4 more duplicates were deleted. Their pages
    were labeled and checked by model reviewers and their XML went through the
    same validation as the rest of the corpus. Metadata is filled: target,
    acquirer, consideration, deal type and announce date for all 1,997, price
    total for 1,540 (77%; the rest state no price, or pay in stock the agreement
    does not value), target counsel for 1,702. Their sections carry no taxonomy
    label (standard_id) until the taxonomy is rebuilt, so filtering sections by
    clause type does not yet return them.
  tables: [agreements, xml, sections, latest_sections_search, agreement_counsel]
  refs: ["4f2873ed"]

- type: data
