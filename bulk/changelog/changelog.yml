    an agreement that starts at Article 0), the XML was accepted as printed;
    such hand-accepted XMLs carry xml.status_source = 'manual' (220 served, up from 35). An agreement whose whole text prints no section numbers is served with its printed headings as section titles. Latest XMLs that fail validation fell from 352 to none: 297 of the
    352 were cured and are served, 54 were rejected on review, and 1 was cured,
    served and later removed as outside the dataset's scope (see the removal entry). 23 latest XMLs
    still carry status 'invalid' because their agreement is not served: 8 side
