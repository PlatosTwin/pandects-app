- type: mcp
  severity: breaking
  summary: "MCP tools are tuned for progressive tool discovery in Claude and Codex: self-contained descriptions, standard annotations, a task-to-tool map in the instructions, a compact get_server_capabilities default, and result data in the text content."
  details: >
    Clients that load tool definitions on demand (tool search) show the model
    only tool names and the server instructions up front, then one tool at a
    time. Each tools/list description now ends with that tool's "Use when"
    guidance and an "Avoid" list, which before lived only in annotations and
    get_server_capabilities. annotations now carries only the standard MCP
    hints (title, readOnlyHint, destructiveHint, idempotentHint, openWorldHint);
    the custom selectionHint, negativeGuidance, pagination and requiredScopes
    keys are gone, with scopes and pagination moved to _meta as
    pandects/requiredScopes and pandects/pagination. Each tool gains a title,
    the non-standard top-level examples field is removed from tools/list, and
    filter arguments that had no description now have one. The initialize
    instructions map every tool to the job it does. get_server_capabilities
    with no arguments now returns a compact index (server, auth_help,
    changelog, a new one-line-per-tool tool_index, workflows, and
    sections_available); field_inventory, concept_notes and tool_limitations
    must be requested by name, and a new tool_names argument narrows the
    per-tool sections. Tool results now carry the data as JSON in a second
    text block after the one-line summary, so clients that show the model
    only content (not structuredContent) get the data too; results over
    250,000 characters get a short note there instead. The
    pandects://capabilities resource returns the same compact index. On
    search_sections, search_agreements, list_agreements and
    search_tax_clauses, argument descriptions are shorter so each input
    schema fits the 5,000 bytes Codex allows before it strips all of them,
    and transaction_price_stock, transaction_price_cash and
    transaction_price_assets no longer repeat the bucket enum (their labels
    are the ones on transaction_price_total; other values are still
    rejected). search_agreements no longer advertises cursor or include_xml,
    which it accepted but ignored. get_server_capabilities reports unknown
    section names under unrecognized_sections.
  migration: >
    Clients that read annotations.requiredScopes or annotations.pagination
    should read _meta["pandects/requiredScopes"] and _meta["pandects/pagination"].
    Pass sections=["field_inventory", "concept_notes", "tool_limitations"] to
    get_server_capabilities to get the sections the old default included.
- type: schema
  severity: minor
  summary: "New table reader_index: the outline, defined terms and cross-references of each verified XML version of an agreement."
  details: >
    One row per indexed XML version (composite key agreement_uuid,
    xml_version), so older versions are included. Join on xml with latest = 1
    to get the row for the served text. payload_gz holds gzip-compressed JSON with the outline,
    defined terms with their declarations and uses, and cross-references with
    their status and target, all as stand-off anchors (container uuid, text
    ordinal and UTF-16 span) into that XML. Count columns and
    body_section_level_rate summarize each row without parsing the payload.
  refs: []
- type: api
  severity: minor
  summary: "New GET /v1/agreements/{agreement_uuid}/reader-index returns the reader index for the XML version the agreement endpoint serves."
  details: >
    The response holds no agreement text, only anchors into the XML that
    /v1/agreements/{agreement_uuid} returns. It is gzip-encoded when the
    client accepts it and carries a weak ETag for If-None-Match. For
    anonymous callers it follows the same focus_section_uuid and
    neighbor_sections window as the XML: term uses and cross-references in
    redacted text are left out, and declarations there are reduced to
    {"redacted": true, "label": "Section 1.1"}. Returns 404 when no index
    has been built for the current XML version.
  refs: []
- type: api
  severity: minor
  summary: "Keyword searches are capped server-wide and answer 503 with Retry-After when busy; an auth database outage answers 503, not the access-lockdown 403."
  details: >
    Text searches (text_query on /v1/sections and /v1/search/agreements, and
    the MCP search_sections tool) share a server-wide limit on concurrent
    full-text queries. A search that cannot start within a few seconds gets
    503 with a Retry-After header and the message "Keyword search is busy
    right now. Please try again in a few seconds."; the MCP tool returns a
    -32004 error marked retryable with the same message. /v1 JSON error
    responses now keep the headers the error sets (Retry-After, Allow). When
    the auth database fails while checking a request's session or API key,
    the temporary access lockdown answers 503 "Auth backend is unavailable
    right now." instead of 403; requests without credentials still get 403.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP OAuth hardening: client_name is validated, consent requires a registered redirect URI, and Deny goes through /authorize."
  details: >
    POST /v1/auth/oauth/register now rejects a client_name that is not a
    string, is longer than 255 characters, or contains control, formatting,
    invisible, or line-separator characters, or long runs of combining marks,
    with 400 invalid_client_metadata. A name over 255 characters, or one with
    an unpaired surrogate, previously failed with a server error. Surrounding
    whitespace is trimmed, and a name that is only whitespace is stored as no
    name. POST /v1/auth/oauth/consent now requires redirect_uri and returns
    400 unless it is registered for the client. The new GET
    /v1/auth/oauth/consent/client returns a client's registered name and
    redirect URIs for the consent screen, which no longer reads the client's
    name from its own address. The consent screen names a known application
    only when every registered redirect URI is on that application's host,
    lists any other hosts that can receive access, and warns about
    unrecognized applications and names that claim a known client. GET
    /v1/auth/oauth/authorize accepts deny=1: once the client and redirect URI
    match the registration, it redirects to that redirect URI with
    error=access_denied and the state. A loopback redirect URI that differs
    from the registered one only by port must otherwise be well formed (no
    backslash, userinfo, or fragment), as at registration. The consent screen's Deny button uses
    it instead of sending the browser to the redirect URI in the page address.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP OAuth /authorize reports an unsupported scope to the client as an invalid_scope redirect."
  details: >
    GET /v1/auth/oauth/authorize used to answer a request for a scope the
    server does not support with a JSON 400 shown in the browser, before it had
    checked the client or redirect URI. It now validates the client and
    redirect URI first and, as RFC 6749 section 4.1.2.1 requires, redirects
    back to the client with error=invalid_scope, the original state, and an
    error_description that names the scope when it is a well-formed scope token
    of at most 64 characters. A request with an unknown client or
    unregistered redirect URI still gets an error page and is never
    redirected. The consent endpoint keeps its 400 for unsupported scopes.
  refs: []
- type: mcp
  severity: minor
  summary: "MCP OAuth token and client-registration errors now use the codes the OAuth RFCs define."
  details: >
    POST /v1/auth/oauth/token errors return {"error", "error_description",
    "message"} with the RFC 6749 codes invalid_request, invalid_client,
    invalid_grant, unauthorized_client and unsupported_grant_type.
    POST /v1/auth/oauth/register errors use the RFC 7591 codes
    invalid_redirect_uri and invalid_client_metadata. Errors from both
    endpoints carry Cache-Control: no-store and Pragma: no-cache. Both used to
    return the generic bad_request
    code. A code or refresh token whose Pandects account is not verified is
    now 400 invalid_grant instead of 403. `message` still carries the same
    text. The /.well-known OAuth discovery endpoints now return the standard
    error envelope codes (not_found, service_unavailable) instead of HTTP
    reason phrases.
  migration: >
    MCP clients that follow the OAuth RFCs need no change. Code that matched
    `error == "bad_request"` on these two endpoints should match the RFC code
    or the status.
  refs: []
- type: docs
  severity: minor
  summary: "The published OpenAPI spec now matches what the API returns."
  details: >
    The spec at /openapi.yaml is regenerated from the API on every change (CI
    fails when it is stale), so it now documents the endpoints and parameters
    added since the last manual export, including /v1/taxonomy/counts and
    /v1/taxonomy/tax-clauses/counts. The `Error` schema now describes the real
    error body, {"error": <code>, "message": <text>}, instead of
    flask-smorest's {code, status, message, errors}. Response fields that are
    always present are marked required, and target_pe / acquirer_pe are
    documented as the 0/1 integers (or null) the API returns. Responses
    themselves are unchanged.
  refs: []
- type: api
  severity: notable
  summary: "Error responses now carry a machine code in `error` instead of the HTTP reason phrase."
  details: >
    Every /v1 error body is {"error": <code>, "message": <text>}. Generic errors
    used to put the HTTP reason phrase in `error` ("Bad Request", "Not Found",
    "Unprocessable Entity", ...); they now use stable snake_case codes:
    bad_request (400), unauthorized (401), forbidden (403), not_found (404),
    method_not_allowed (405), conflict (409), validation_error (422),
    rate_limited (429), internal_error (500), service_unavailable (503). Other
    statuses use the snake_case reason phrase. Codes that were already
    specific (validation_error, rate_limited, captcha_required, legal_required,
    ...) are unchanged. A 422 from query-parameter parsing now names the field
    in `message` ("page_size: Not a valid integer.") instead of a generic
    sentence. Status codes and the /mcp JSON-RPC errors are unchanged.
  migration: >
    Clients that compared `error` to a reason phrase should compare it to the
    new code, or branch on the HTTP status.
  refs: []
- type: api
  severity: minor
  summary: "REST responses carry industry and taxonomy labels next to the raw codes."
  details: >
    Agreement rows on /v1/agreements, /v1/agreements/{uuid}, and
    /v1/search/agreements gain target_industry_label and acquirer_industry_label:
    the NAICS description of the code (a code with no catalog entry of its own
