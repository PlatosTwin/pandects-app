- type: data
  severity: notable
  summary: "342 agreements that were already in the dataset but not searchable are now served: 297 whose XML failed validation and 45 that had pages but no XML."
  details: >
    Failing XMLs were reviewed against the filing. Where the failure came from a
    tagging error, a mislabeled page or an isolated numbering typo in the
    filing, the heading tags, page labels or heading numbers were corrected to
    match the source and the XML rebuilt. Where the filing itself has an unusual
    but valid structure (an inserted 4.7A section, a printed numbering restart,
    an agreement that starts at Article 0), the XML was accepted as printed;
    such hand-accepted XMLs carry xml.status_source = 'manual' (220 served, up from 35). An agreement whose whole text prints no section numbers is served with its printed headings as section titles. Latest XMLs that fail validation fell from 352 to none: 297 of the
    352 were cured and are served, 54 were rejected on review, and 1 was cured,
    served and later removed as outside the dataset's scope (see the removal entry). 23 latest XMLs
    still carry status 'invalid' because their agreement is not served: 8 side
    agreements (the 6 removed from serving, see the removal entry, and 2 newly
    admitted filings), 9 superseded originals whose restated version is served and
    6 duplicates of a served agreement.
