- type: data
  severity: breaking
  summary: "298 previously served agreements removed: 226 filings outside the dataset's scope and 72 duplicates. agreements now holds 1,432 rows with status = 'invalid'."
  details: >
    Outside the dataset's scope (226): sponsor drop-downs to a controlled MLP or
    affiliate, guaranties, voting and support agreements, subscription,
    registration-rights and note-purchase agreements, financing documents,
    unexecuted forms and bidder proposals, amendments, proxy statements and an option plan, and 6 side agreements rather than acquisitions (PIPEs, a recapitalization, a block share sale, a JV contribution and a financing), 167 in all.
    59 more were removed after two independent reads. 58 fail the property
    rule: 52 are bare property or lease packages and 6 are vehicles with no
    business of their own (companies that only hold property or projects). 1 is
    the formation of a 50/50 joint venture in which no party gains control, a
    side agreement rather than an acquisition. Their sections, counsel, clauses and index rows are removed, and so is the XML of all but those 6 side agreements, whose latest XML stays with status 'invalid'; the agreements row stays, with status = 'invalid', so the filing is
    not re-ingested. Duplicates (72 served): 71 originals superseded
    by their amended and restated version, which is now served under its own
    agreement_uuid, and 1 agreement filed twice (the earlier copy is kept).
    The agreements rows of 65 of the superseded originals and of the copy filed
    twice are deleted (70 agreements rows deleted in all, counting 4 duplicates
    from the EDGAR queue review). The other 6 superseded originals were removed
    later and keep their agreements row (5 with status 'verified', 1 with no
    status) and their XML, whose latest version has status 'invalid'; their
    sections, counsel and index rows are removed. The last of them is the Disney /
    Fox agreement of December 2017: the amended and restated agreement of June
    20, 2018, the version in force at closing, was added and is served, and the
    2017 row now has deal_status 'cancelled' and no close date. In the previous release no agreements row
    had status 'invalid'; now 1,432 do (1,118 from the EDGAR queue review, the 226 removed above, 21 rejected new filings, and 67 filings that
    were not served in the previous release: 66 rejected after their XML failed
    validation or was never built, and 1 newly served agreement later removed
    under the property rule).
  tables: [agreements, xml, sections, latest_sections_search, latest_sections_search_standard_ids, agreement_counsel, agreement_index_summary, clauses, tax_clause_assignments]
  migration: >
    Count or join served agreements through latest_sections_search or
    agreement_index_summary. Do not derive them from agreements: a plain
    COUNT(*) includes 1,432 invalid rows and other unserved filings, status
    is NULL on most served agreements, so `status <> 'invalid'` drops them, and
    status = 'verified' does not mean served (5 of the 6 superseded originals
    above are among the exceptions). 70
    agreement_uuid values from the previous dump no longer exist; for the 65
    amended and restated replacements, look the deal up by target and acquirer.
    The agreement_uuid values of the other 6 superseded originals still exist in
    agreements but have no sections.
