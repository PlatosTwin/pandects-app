- type: data
  severity: breaking
  summary: "Section text and structure corrected across the corpus: of the 9,560 agreements served in both releases, 4,781 have changed words, 309 have a different number of sections and 2,565 have a changed outline; 2,796 keep identical section text, though their titles may differ."
  details: >
    Every served XML was rebuilt with the current builder (builder PRs listed
    below and the NER fixes #175, #177), and at least 1,666 agreements also had
    hand-reviewed corrections to their heading tags, page labels or source text
    (18,137 text edits, 1,070 page-label edits). Main changes: (1) Page
    furniture is no longer served as section text: running titles, page numbers,
    document IDs, "Execution Version" and confidentiality legends ("confidential
    treatment requested ... omitted and filed separately with the Securities and
    Exchange Commission"), table-of-contents headers repeated on body pages and
    EDGAR SGML markup. In continuing agreements 318,406 words were removed from
    section text, 4,665 agreements lost at least one word and 494 lost 50 or
    more. (2) Headings the tagger missed are now their own sections: final
    sections folded into the one before, whole articles, sections printed
    without a number, back-to-back headings of the same kind, and closing
    sections that sat on a page labeled as a signature page. 266 agreements
    gained sections and 43 lost some (signature pages, exhibits and schedules
    that had been served as the last sections, or as the first ones from a table
    of contents); net +589 sections. Section and article titles were cleaned
    (cross-references no longer read as titles, glued words split, heading
    periods and separator dashes dropped), which changes the outline of 2,565
    agreements. (3) Spacing and punctuation now follow the filed page: no space
    before closing punctuation, split ordinals and possessives rejoined ("3 rd"
    -> "3rd"), glued words separated, page-text lines the HTML prints as one
    block joined, table rows of malformed HTML emitted once, and HTML paragraphs
    kept in page order. 1,948 continuing agreements changed only in spacing or
    punctuation; 69,131 words were added in all (rejoined tokens and recovered
    text). Conventions: an article that prints no sections is served as one
    untitled section holding the article's text (94 agreements have no titled
    section at all, up from 42; 32,955 untitled sections, up from 24,913; 3,036
    sections have no text, up from 2,178); a signature block printed on the same
    page as the last clause stays in the body; the testimonium may sit inside
    the last section.
  tables: [xml, sections, latest_sections_search]
  migration: >
    96.7% of section_uuid values survive: 923,278 of the 954,483 previous ids
    still exist. 11,895 ids in 756 continuing agreements changed (resectioned
    agreements) and 19,310 belong to removed agreements. Re-fetch section ids
    rather than joining on ids saved from the previous dump; to find changed
    agreements, compare sections rather than whole XMLs: only 1 continuing XML
    is byte-identical, while 878,396 of the 923,278 surviving sections (95.1%)
    are.
  refs: ["#175", "#177", "#227", "#228", "#229", "#230", "#231", "#232", "#233", "#234", "#235", "#236", "#237", "#238", "#239", "#241", "#242", "#244", "#245", "#246", "#248", "#249", "#250", "b5a626a2", "54955dea", "5fc61492", "17706a9b"]

- type: data
  severity: breaking
  summary: "Deal parties and listing status corrected: acquirer changed on 2,559 and target on 1,189 of the 9,560 continuing agreements; acquirer_type on 749, target_type on 491, acquirer_pe on 172, target_pe on 370."
  details: >
    Parties now follow written rules applied to the whole corpus: the acquirer
    and target are the parties the agreement prints (a parent counts only when
    the preamble names it as a party, not when it appears only as a guarantor or
    owner; no roll-ups to a parent found only in SEC filings), a transitory
    merger subsidiary gives way to the parent named as a party while a printed
    buying vehicle stays as printed, a sponsor buying through a vehicle is
    stored as the printed sponsor funds, a portfolio company buying in its own
    name is stored as that company, and names are as at signing. A printed
    unlisted subsidiary of a listed parent is a public acquirer; OTC-quoted
    companies are public; non-traded REITs and BDCs and blank-check shells
    without a quote are private. Most changes were checked against the agreement
    text by an independent second read before they were written. Missing parties
    among the served corpus: none (all 11,979 have target and acquirer). Type
    coverage: target_type 11,979 and acquirer_type 11,979 of 11,979. target_pe
    now counts only named buyout-style sponsors, not venture-capital, hedge,
    distressed or credit funds. All 2,004 served targets stored at 1 were
    reviewed for venture backing, and hedge and credit holders were then swept
    by manager name, so a few of those may remain: 547 (476 private, 71 public)
    were set to 0, and 203 with an unclear investor stay at 1. Against the
    previous release, 359 of the 547 went from 1 to 0, 79 were empty, 9 were
    already 0 and 100 are newly served.
  tables: [agreements, latest_sections_search, agreement_index_summary, agreement_filter_option_summary]
  refs: []

- type: data
  severity: breaking
  summary: "Deal price, consideration and dates corrected: price total changed on 2,641, filled on 439 and cleared on 768 continuing agreements; consideration type changed on 707; deal status on 329."
  details: >
    Prices now mean the headline price at signing, including assumed or repaid
    debt, without earnouts or CVRs, and as signed (not as later amended). The
    headline comes from the signed agreement, except on public-target deals,
    where the value the parties announced at signing takes precedence (see the
    separate entry on announced values). Elsewhere a stock leg the agreement
    does not value is cleared,
    and so is the total. Price total coverage among served agreements fell from
    89.4% (8,752 of 9,787) to 84.1% (10,077 of 11,979) for two reasons. Among
    continuing agreements 768 totals were cleared, mostly where the agreement
    does not value a stock leg, and 439 were filled (89.5% -> 86.1%). The 2,419
    newly served agreements have lower coverage (76.4%). Stock price legs: 1,010
    cleared, 354 changed; cash legs: 1,297 changed, 591 cleared; asset legs: 321
    cleared. Consideration type: 366 mixed deals are now cash and 331 now stock
    (a deal with one real form of payment is no longer mixed, and cash paid in
    lieu of fractional shares does not count as a second form); served deals
    marked mixed 3,193 -> 3,116 while the corpus grew by 2,192. Deal status: 156
    empty and 122 pending deals are now complete, 31 pending and 15 empty now
    cancelled; empty deal_status among served agreements 182 -> 7. Close date
    filled on 273, changed on 27 and cleared on 31; announce date changed on 62.
  tables: [agreements, latest_sections_search, summary_data, agreement_ownership_deal_size_summary, agreement_ownership_mix_summary, agreement_buyer_type_matrix_summary, agreement_industry_pairing_summary, agreement_counsel_leaderboard_summary]
  migration: >
    Sums and medians of transaction_price_total change, and fewer deals have a
    total; the summary tables were rebuilt from the corrected values.
  refs: ["#179", "65a87fcb"]

- type: data
  severity: breaking
  summary: "transaction_price_total on 1,528 deals, all but one with a public target, now holds the value the parties announced at signing, including the debt-inclusive headline where one was stated; the cash and stock legs moved with it only on 240 single-form deals."
  details: >
    On public-target deals, the value stated in the announcement press release
    or filing at signing now takes precedence over per-share arithmetic or a
    closing-date value when they differ by more than 5%: 1,409 totals changed
    and 119 were filled, measured against the value stored before this pass.
    Against the previous release, 1,373 changed, 91 were filled and 11 match
    among the 1,475 continuing agreements; the other 53 are newly served. Where
    the release states a value including assumed or
    repaid debt, or the deal's enterprise value, the total holds that figure.
    Mixed cash-and-stock deals whose agreement does not value the stock get
    the announced total, and the stock leg stays empty. On 240 single-form
    deals the cash or stock leg moved with the total: 17 were checked against
    share counts, and on the other 223 the value is at most 25% above the
    prior leg and can include some debt. 15 further legs were corrected from the
    filings. All other legs are untouched by this entry. These totals come
    from the release, not the agreement, and metadata_sources cites it. A deal
    with no announced value in the filer's own announcement filings keeps its
    existing total, so across public targets the field holds a debt-inclusive
    value on some deals and an equity value on others. Other private-target
    deals are unchanged by this entry. The 1,475 continuing agreements are
    included in the price counts in the entry above.
  tables: [agreements, latest_sections_search, summary_data, agreement_ownership_deal_size_summary, agreement_ownership_mix_summary, agreement_buyer_type_matrix_summary, agreement_industry_pairing_summary, agreement_counsel_leaderboard_summary]
  migration: >
    transaction_price_total need not equal the sum of transaction_price_cash,
    transaction_price_stock and transaction_price_assets: it exceeds the legs
    by more than 1% on 1,157 served agreements and falls below them by more than
    1% on 69. Do not test total = cash + stock + assets, and do not treat the
    gap as an exact debt figure. The legs are the closest measure of what
    holders receive, with three limits: on the 240 deals above the leg holds
    the announced value; a leg is empty where the agreement does not value it
    (the stock leg on 378 served mixed deals that have a total); and 201
    served deals with a total have no legs. No field gives a like-for-like
    equity value across all deals. Sums and medians of deal value change; the summary tables were
    rebuilt from the new values.
  refs: []

- type: data
  severity: breaking
  summary: "Counsel rebuilt from each agreement's notices section: counsel changed on 1,482 continuing agreements and filled on 199; links 18,619 -> 24,119, firms 1,398 -> 1,712."
  details: >
    Counsel is the law firm the agreement's notices clause copies for each side
    ("with a copy, which shall not constitute notice, to"). Strings that joined
