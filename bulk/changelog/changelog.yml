    read 12,059 served agreements in four parts (see the end of this entry). Some of the
    finer points below were settled while that pass ran, and agreements read
    before a point was settled were not all read again. The other 139 served
    agreements are on no list of that pass, because the check of the largest
    deals read them (49 of them had also had a two-reader price read in the
    earlier, narrower passes). Every served agreement has thus had a
    two-reader price read, and 12,059 of the 12,198 had the full pass. Earnouts, CVRs and other contingent payments are in no
    leg. They count in the total only where a party prints the combined
    figure "up to $X" in the signing release or the signing 8-K, which is then
    stored as X. Rolled equity is target equity that sellers, management or
    other holders exchange for equity of the buyer or its parent instead of
    selling it. It is part of the price: transaction_price_rollover holds its
    value at the deal price, and transaction_price_total includes it. It is in
    no leg and does not change the consideration label, so a cash buyout with
    a rollover has the label cash. Holders who join a vehicle that an outside
    sponsor or another buyer controls roll equity. Holders who are themselves
    the controlling buyer hold buyer-owned shares, which stay out of the
    total. Stock of a
    listed acquirer is the stock leg, also where the agreement calls it a
    rollover; rolled equity is equity of a private buying vehicle. De-SPAC
    rows keep the de-SPAC rule below. The rollover value is a dollar amount
    that a party prints for the rollover at signing; else the printed count of
    rolled shares times the per-share deal price (the count may come from the
    merger proxy, a Schedule 13E-3 or a Schedule 13D filed for the deal); else
    a percentage of the outstanding shares that a party prints, times the
    printed outstanding count and the deal price; else the field is empty. An
    announced headline for the whole company stays the total where it covers
    rolled equity. Where the total is arithmetic, it is the price of the
    shares bought plus the rolled equity. Left out of the total are shares
    that the buyer or the holder that controls it already owns, the unsold
    part of a stake, and employee awards that the buyer assumes; the count of
    such shares or of rolled shares may come from the merger proxy or a Schedule 13D or 13E-3 where no
    signing source prints it. The value of shares that the buyer or the holder that controls it already owns is stored in transaction_price_buyer_owned (see the buyer-owned reread below). Where the stored total was a headline for the whole company that covers the buyer's stake, the total is the value of the part bought where a party prints it, else the headline less the stake where a source prints the stake's size. A headline that also covers shares of the acquirer itself is not used where the price of the shares bought is printed (GreenLight Biosciences, KnowBe4); the total is then the cash for the shares bought plus the rolled equity. Where the buyer's stake cannot be sized from printed figures, the announced headline stays the total (Jaguar Holding / PPD, $9.05 billion); a total is not emptied only because the headline covers the buyer's own shares. These rules apply to every pass, the check of the largest deals included. The headline comes from the signed agreement, except mainly on public-target deals, where the value the parties announced at signing takes precedence (see the
    separate entry on announced values). Elsewhere a stock leg is valued only
    where a party states a per-share value that holders get (in the signing
    release, an investor deck, or the agreement's own collar or reference price)
    and a signing source prints the share count; a market price quoted in passing
    does not count. A stock leg with no such value is cleared, and so is the
    total unless a party release states one. Where no single total is printed but its pieces are, the total is arithmetic on printed figures only (a per-share price times a printed share count, or cash plus separately stated assumed debt); a partial purchase is priced at what is actually bought; a served agreement that covers one part of a larger deal holds the price it prints for that part (Westcor Realty LP / Macerich: $284.4 million, not the $1.475 billion of the whole deal); the total of a leveraged joint-venture carve-out is the printed price of the stake the buyer takes (Emerald JV (Emerson Climate Technologies) / Blackstone: the $4.4 billion equity contribution that the joint signing release prints, not the $14.0 billion headline or the $9.5 billion of cash to the seller, which the venture's own debt partly funds); an agreement buying several separately printed companies lists them all as the target and sums their prices; a deal priced in a foreign currency has a USD price only where the agreement or a party's signing release prints one, and a USD value that first appears in a closing document, or a USD figure net of cash where the parties print the equity value only in the foreign currency, does not count (Leitch / Harris); one price that covers this agreement and a sister agreement, with no printed split, leaves the price fields empty (Emmis Television / SJL); a price that depends on an election, collar or cap settled after signing holds the base case or cap printed at signing, and a cash price is the base case where stock is paid only if the buyer's financing fails (KPMG Consulting AG); and a de-SPAC price is the equity value the agreement prints for the target holders' shares at the SPAC share price (usually $10.00) plus printed cash, never a pro forma or combined value; earnout shares count in no field, and cash that the target pays to buy back its own shares under separate agreements is not consideration (HeartFlow / Longview Acquisition Corp. II). An exchange-ratio valuation in a reverse merger or a merger of equals is not a price; a party's statement that the deal values the target at a stated amount counts. Where no party prints the equity value, an announced value net of cash acquired, or an enterprise value below the equity value, is the total. A go-private done as a company tender offer and a merger under one agreement has one price for both steps. Where a new holding company is the acquirer and both combining companies are the target, the total and the stock leg are empty unless a signing source prints a dollar value for the holders of each company (the total is then the sum); the value of one company's shares alone, or a combined or pro forma value, does not count. None of the 14 served rows of this form holds a total, and Cedar Fair / Six Flags keeps a cash leg that a party prints. Legs follow the same standard: a leg holds a dollar figure that a party prints for that leg, valued at signing, or arithmetic on printed figures, such as a per-share price times a printed share count. Printed legs may sum to up to 5% more than the total, mostly where the total is a rounded headline, and the total then stays: 12 served agreements have legs 2% to 5% above the total (for example VISX / Advanced Medical Optics, 4.4% above the rounded $1.27 billion), and none more than 5%. Where a party states the value per share that holders get for mixed consideration and prints the cash part per share, the stock leg is that value less the cash part, times the printed share count. A seller note, or a fixed cash payment due on a fixed date or schedule more than 90 days after closing, goes in the assets leg; deferred stock stays in the stock leg; cash plus such a payment has the consideration label mixed. A closing-date or purchase-accounting value does not count, and neither does a leg that no party prints and that is only a share or a difference of other figures. A value a party prints only in a later filing counts only when its value date is within 7 days of signing; an implied value a party prints in the proxy as of such a date counts. The exception is a fixed cash price per share: the aggregate at that price that the tender offer document prints shortly after signing counts (9 and 11 days after signing on the two deals concerned). A leg with no such figure is empty, except the 203 legs set from the announced value (next entry). Price total coverage among served agreements rose from
