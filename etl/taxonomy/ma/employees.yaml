# Pandects taxonomy, M&A pack (`ma`). Navigation branch: Employees and Benefits.
# Source of truth for these nodes. Field reference: etl/taxonomy/README.md.
# Validate with: python -m etl.domain.taxonomy_pack
pack: ma
release: '2026.1'
branch:
  id: ma.nav.employees
  label: Employees and Benefits
  kind: branch
  order: 8
  description: Covenants on the treatment of employees and benefit plans.
  introduced_in: '2026.1'
groups:

  - id: ma.nav.employees.continuing
    label: Continuing Employees
    kind: group
    nav_parent: ma.nav.employees
    description: What the buyer must provide to employees who stay after closing.
    introduced_in: '2026.1'

  - id: ma.nav.employees.transaction
    label: Transaction-Related Employee Matters
    kind: group
    nav_parent: ma.nav.employees
    description: Severance, retention, plant closing law, parachute payments and employee transfers.
    introduced_in: '2026.1'
concepts:

  - id: ma.employee.comp_benefits_continuation
    label: Continuing Employees; Compensation, Benefits and Plan Transition
    kind: provision
    nav_parent: ma.nav.employees.continuing
    tier: label
    wave: 1
    description: >-
      The covenants for employees who stay after closing: pay and benefits at stated levels for a stated
      period, credit for past service and waiver of pre-existing condition limits under the buyer's plans,
      and termination of the target's 401(k) plan if the buyer asks.
    canonical_terms:
      - Continuing Employees
      - for a period of one year following the Effective Time
      - no less favorable in the aggregate
      - base salary and target bonus opportunity
      - service credit
      - credited for purposes of eligibility and vesting
      - pre-existing condition
      - deductibles and co-payments
      - Company 401(k) Plan
      - terminate effective as of the day prior to the Closing Date
      - rollover contributions
    example_phrases:
      - >-
        Parent shall, or shall cause the Surviving Corporation to, maintain the Company Benefit Plans,
        or provide benefits that are substantially comparable in the aggregate, until the first anniversary
        of the Closing.
      - >-
        Parent shall cause each Continuing Employee to be credited with his or her years of service with
        the Company for purposes of eligibility, vesting and level of benefits under the Parent Benefit
        Plans.
      - >-
        If requested by Parent at least ten Business Days prior to the Closing Date, the Company shall
        terminate the Company 401(k) Plan effective as of the day immediately preceding the Closing Date.
    exclusion_cues:
      - The interim limit on raising pay before closing is ma.conduct.restriction.compensation.
      - >-
        The statement that these covenants create no rights for employees and amend no plan is
        ma.employee.no_third_party_rights.
    value_schema:
      status: stub
      fields:
        - name: protection_period
          type: Duration
        - name: standard
          type: text
    crosswalk:
      section_v1:
        - id: 079056f26925e599
          relation: narrower
      section_v2:
        - id: e8bf9419566b043c
          relation: narrower
        - id: 7ea0e3846121a19c
          relation: related
    introduced_in: '2026.1'

  - id: ma.employee.no_third_party_rights
    label: No Employee Third-Party Rights
    kind: component
    nav_parent: ma.nav.employees.continuing
    parent: ma.employee.comp_benefits_continuation
    tier: label
    wave: 2
    description: >-
      A statement that the employee covenants create no rights for employees, amend no plan, and do not
      limit the buyer's right to end employment or change plans.
    canonical_terms:
      - nothing in this Section shall confer any rights on any employee
      - shall not be treated as an amendment of any benefit plan
      - no third-party beneficiary rights
    example_phrases:
      - >-
        Nothing in this Section shall be construed to create any third-party beneficiary rights in any
        Continuing Employee or to amend any Company Benefit Plan.
    exclusion_cues:
      - The general no third-party beneficiaries clause is ma.third_party_beneficiaries.
    crosswalk:
      section_v1:
        - id: 079056f26925e599
          relation: narrower
      section_v2:
        - id: e8bf9419566b043c
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.employee.retention_severance
    label: Severance, Retention and Bonuses
    kind: provision
    nav_parent: ma.nav.employees.transaction
    tier: label
    wave: 1
    description: >-
      Covenants to honor severance plans, pay annual bonuses for the closing year, or set up a retention
      program.
    canonical_terms:
      - severance
      - Retention Bonus
      - retention pool
      - annual bonus for the fiscal year in which the Closing occurs
      - honor in accordance with their terms
    example_phrases:
      - >-
        Parent shall honor, in accordance with their terms, all severance and change in control agreements
        of the Company in effect on the date hereof.
    exclusion_cues:
      - >-
        A covenant that a payment will be made in compliance with Section 409A is part of the concept of
        that payment: this concept for bonuses, retention and severance payments. The statement that the
        plans comply with Section 409A is ma.rep.employee_benefits.
    crosswalk:
      section_v1:
        - id: 079056f26925e599
          relation: narrower
      section_v2:
        - id: 7ea0e3846121a19c
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.employee.warn
    label: WARN Act
    kind: provision
    nav_parent: ma.nav.employees.transaction
    tier: label
    wave: 1
    description: >-
      Covenants on plant closings and mass layoffs under the WARN Act: who is responsible, and limits
      on layoffs around closing.
    canonical_terms:
      - WARN Act
      - Worker Adjustment and Retraining Notification Act
      - plant closing
      - mass layoff
    example_phrases:
      - >-
        Buyer shall be responsible for all liabilities under the WARN Act arising from any action taken
        by Buyer on or after the Closing Date.
    exclusion_cues:
      - The representation on labor law compliance is ma.rep.labor_employment.
    crosswalk:
      section_v1:
        - id: 079056f26925e599
          relation: narrower
      section_v2:
        - id: e8bf9419566b043c
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.employee.section_280g
    label: Section 280G Stockholder Vote
    kind: provision
    nav_parent: ma.nav.employees.transaction
    also_listed_under:
      - tax.nav.other
    tier: label
    wave: 1
    description: >-
      The target's duty to seek waivers from disqualified individuals and a stockholder vote so that payments
      are not parachute payments under Section 280G.
    canonical_terms:
      - Section 280G
      - parachute payments
      - disqualified individual
      - 280G Stockholder Vote
      - waiver of excess payments
    example_phrases:
      - >-
        Prior to the Closing, the Company shall submit to a stockholder vote, in a manner that satisfies
        Section 280G(b)(5)(B) of the Code, the right of any disqualified individual to receive any payment
        that would be a parachute payment.
    exclusion_cues:
      - The representation on parachute payments is ma.rep.employee_benefits.
    introduced_in: '2026.1'

  - id: ma.employee.transfer
    label: Employee Transfers and Offers of Employment
    kind: provision
    nav_parent: ma.nav.employees.transaction
    tier: label
    wave: 1
    description: >-
      In an asset or carve-out deal, the buyer's duty to offer jobs to the business's employees, the terms
      of the offers, and the split of employee liabilities.
    canonical_terms:
      - Transferred Employees
      - Offered Employees
      - offer of employment
      - Business Employees
      - effective as of the Closing
    example_phrases:
      - >-
        At least [•] days prior to the Closing Date, Buyer shall offer employment, effective as of the
        Closing, to each Business Employee on terms consistent with this Section.
    introduced_in: '2026.1'
