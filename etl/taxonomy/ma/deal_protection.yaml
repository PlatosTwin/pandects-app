        - name: deadline
          type: Duration
    crosswalk:
      section_v2:
        - id: a87f03505324d055
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.approval.voting_agreements
    label: Voting and Support Agreements
    kind: provision
    nav_parent: ma.nav.deal_protection.stockholder_approval
    tier: label
    description: >-
      Terms on agreements under which named stockholders promise to vote for the deal or tender their
      shares.
    canonical_terms:
      - Voting Agreement
      - Support Agreement
      - Tender and Support Agreement
      - irrevocable proxy
    example_phrases:
      - >-
        Concurrently with the execution of this Agreement, certain stockholders have executed and delivered
        Support Agreements pursuant to which they have agreed to vote their Shares in favor of the adoption
