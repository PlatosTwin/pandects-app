    value_schema:
      status: stub
      fields:
        - name: pct_of_shares_committed
          type: number
    crosswalk:
      section_v1:
        - id: 1333a485313cb368
          relation: narrower
      section_v2:
        - id: 9af153875ed400cb
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.takeover.statutes
    label: Takeover Statutes
    kind: provision
    nav_parent: ma.nav.deal_protection.takeover_defenses
    also_listed_under:
      - ma.nav.reps.transaction
    tier: label
    description: >-
      The statement that anti-takeover statutes do not apply to the deal because the board has approved
      it, and the duty to act so that none applies.
    canonical_terms:
      - Takeover Statute
      - Takeover Laws
      - Section 203 of the DGCL
      - fair price, moratorium, control share acquisition
      - anti-takeover
    example_phrases:
      - >-
        The Company Board has taken all actions necessary to ensure that the restrictions on business
        combinations set forth in Section 203 of the DGCL do not apply to this Agreement or the transactions.
    exclusion_cues:
      - A stockholder rights plan is ma.takeover.rights_plan.
      - The buyer's statement that it owns no target stock is ma.rep.ownership_of_target_stock.
    crosswalk:
      section_v1:
        - id: 6d1ca58b2fed8a2d
          relation: exact
      section_v2:
        - id: 2ba79d8226115fb6
          relation: narrower
    introduced_in: '2026.1'

  - id: ma.takeover.rights_plan
    label: Rights Plan
    kind: provision
    nav_parent: ma.nav.deal_protection.takeover_defenses
    also_listed_under:
      - ma.nav.reps.transaction
    tier: label
    description: >-
      Statements and duties about a stockholder rights plan: that it has been amended so that the deal
      does not trigger it, or that the target has none and will adopt none.
    canonical_terms:
      - Rights Agreement
      - Company Rights
      - Distribution Date
      - Acquiring Person
      - stockholder rights plan
    example_phrases:
      - >-
        The Company has amended the Rights Agreement so that neither the execution of this Agreement nor
        the consummation of the Merger will cause Parent to become an "Acquiring Person" or result in
        a "Distribution Date".
    crosswalk:
      section_v2:
        - id: 2ba79d8226115fb6
          relation: narrower
    introduced_in: '2026.1'
