  - id: ma.rep.other
    label: Other Representation
    kind: provision
    nav_parent: ma.nav.reps.industry
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      A representation on a topic that no other concept in this branch covers. Check the general topics and
      the industry concepts first. Industry statements that have no concept of their own belong here: gaming
      licenses and gaming law, education (Title IV programs and accreditation), franchise systems,
      transportation (motor carriers, aviation and vessels), and government grants, incentives and pandemic
      relief loans.
    canonical_terms:
      - Gaming Laws
      - Gaming Authorities
      - Title IV Programs
      - Educational Agency
      - Franchise Disclosure Document
      - franchisees
      - motor carrier
      - Governmental Grants
      - PPP Loan
    exclusion_cues:
      - >-
        Check the industry concepts first: ma.rep.banking, ma.rep.healthcare_regulatory,
        ma.rep.insurance_business, ma.rep.energy_natural_resources and ma.rep.communications.
      - >-
        Statements found in bank deals are ma.rep.banking: reports filed with bank regulators, capital and
        well-capitalized status, loans, deposits, and risk management or contingency programs.
      - >-
        Pending or threatened actions against any party, the buyer included, and compliance with an existing
        order or consent decree are ma.rep.litigation.
      - >-
        A statement that no representation or document contains an untrue statement of a material fact is
        ma.rep.full_disclosure.
      - >-
        Title to real property and valid leases are ma.rep.real_property. Title to other assets is
        ma.rep.title_sufficiency_assets.
      - A statement that no governmental consent, approval or filing is required is ma.rep.no_conflict.
      - A SPAC's statement that it is an emerging growth company is ma.rep.investment_company.
      - The lead-in of a representations article that stands as a section of its own is ma.other.lead_in.
      - >-
        A section that holds all of a party's representations takes the concept of each statement in it. Use
        this concept only for a statement that fits none.
    introduced_in: '2026.1'
