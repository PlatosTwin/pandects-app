# Pandects taxonomy, M&A pack (`ma`). Navigation branch: Representations and Warranties.
# Source of truth for these nodes. Field reference: etl/taxonomy/README.md.
# Validate with: python -m etl.domain.taxonomy_pack
pack: ma
release: '2026.1'
branch:
  id: ma.nav.reps
  label: Representations and Warranties
  kind: branch
  order: 3
  description: >-
    Statements of fact that a party makes about itself or the business. Each concept covers every party.
    The party that makes the representation is the `party` attribute of the instance, read from the article
    heading.
  introduced_in: '2026.1'
groups:

  - id: ma.nav.reps.fundamental
    label: Fundamental
    kind: group
    nav_parent: ma.nav.reps
    description: Existence, power, ownership and the absence of conflicts.
    introduced_in: '2026.1'

  - id: ma.nav.reps.financial
    label: Financial
    kind: group
    nav_parent: ma.nav.reps
    description: >-
      Financial statements, SEC reports, liabilities and changes since the balance sheet date. Tax representations
      are listed here from the tax pack.
    introduced_in: '2026.1'

  - id: ma.nav.reps.legal
    label: Legal and Compliance
    kind: group
    nav_parent: ma.nav.reps
    description: Litigation, compliance with laws, permits and anti-corruption.
    introduced_in: '2026.1'

  - id: ma.nav.reps.commercial
    label: Commercial
    kind: group
    nav_parent: ma.nav.reps
    description: Contracts, customers, suppliers, affiliates, products and insurance.
    introduced_in: '2026.1'

  - id: ma.nav.reps.assets
    label: Assets, IP and Environmental
    kind: group
    nav_parent: ma.nav.reps
    description: Real property, other assets, intellectual property, data and environmental matters.
    introduced_in: '2026.1'

  - id: ma.nav.reps.employees
    label: Employees
    kind: group
    nav_parent: ma.nav.reps
    description: Benefit plans and labor matters.
    introduced_in: '2026.1'

  - id: ma.nav.reps.transaction
    label: Transaction-Specific
    kind: group
    nav_parent: ma.nav.reps
    description: >-
      Statements tied to this deal: disclosure documents, the fairness opinion, the required vote and
      brokers.
    introduced_in: '2026.1'

  - id: ma.nav.reps.buyer
    label: Buyer-Specific
    kind: group
    nav_parent: ma.nav.reps
    description: >-
      Statements normally made only by the buyer: funds, solvency, investment intent and the merger subsidiary.
    introduced_in: '2026.1'

  - id: ma.nav.reps.disclaimers
    label: Disclaimers
    kind: group
    nav_parent: ma.nav.reps
    description: Limits on what counts as a representation and on what a party relied on.
    introduced_in: '2026.1'

  - id: ma.nav.reps.industry
    label: Industry-Specific
    kind: group
    nav_parent: ma.nav.reps
    description: Statements found mainly in one regulated industry.
    introduced_in: '2026.1'
concepts:

  - id: ma.rep.organization
    label: Organization; Good Standing; Qualification
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The party is duly organized, validly existing and in good standing, has the power to carry on its
      business, is qualified to do business where required, and has delivered its organizational documents.
    canonical_terms:
      - duly organized, validly existing and in good standing
      - qualified to do business
      - corporate power and authority to own its properties
      - organizational documents
    example_phrases:
      - >-
        The Company is a corporation duly organized, validly existing, and in good standing under the
        laws of its jurisdiction of incorporation.
    exclusion_cues:
      - Power to sign and perform this agreement is ma.rep.authority.
      - The list of subsidiaries is ma.rep.subsidiaries.
    crosswalk:
      section_v1:
        - id: c73a2e77f18750ae
          relation: narrower
          party: target
        - id: 402f00af1acdc5d8
          relation: narrower
          party: buyer
      section_v2:
        - id: d61c3de37ed27743
          relation: narrower
          party: target
        - id: adde4944d8f8847a
          relation: narrower
          party: buyer
    introduced_in: '2026.1'

  - id: ma.rep.authority
    label: Authority; Board Approval; Enforceability
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The party has the power and authority to sign and perform the agreement, its board has approved
      the deal, and the agreement is a valid and binding obligation, subject to the bankruptcy and equity
      exception.
    canonical_terms:
      - corporate power and authority to execute and deliver
      - duly authorized by all necessary corporate action
      - valid and binding obligation
      - enforceable in accordance with its terms
      - Bankruptcy and Equity Exception
    example_phrases:
      - >-
        The Company has all requisite corporate power and authority to enter into this Agreement and to
        consummate the transactions, and the execution and delivery have been duly authorized by all necessary
        corporate action.
      - >-
        This Agreement has been duly executed and delivered and constitutes a valid and binding obligation
        of the Company, enforceable against it in accordance with its terms, subject to the Enforceability
        Exceptions.
    exclusion_cues:
      - The stockholder vote needed to approve the deal is ma.rep.required_vote.
      - Existence and good standing are ma.rep.organization.
    crosswalk:
      section_v1:
        - id: c73a2e77f18750ae
          relation: narrower
          party: target
        - id: 402f00af1acdc5d8
          relation: narrower
          party: buyer
      section_v2:
        - id: d61c3de37ed27743
          relation: narrower
          party: target
        - id: adde4944d8f8847a
          relation: narrower
          party: buyer
    introduced_in: '2026.1'

  - id: ma.rep.capitalization
    label: Capitalization
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The party's authorized and outstanding shares, options, warrants and other equity rights, and that
      the outstanding shares are validly issued, fully paid and free of preemptive rights.
    canonical_terms:
      - authorized capital stock
      - issued and outstanding
      - duly authorized, validly issued, fully paid and nonassessable
      - no outstanding options, warrants or other rights
      - preemptive rights
    example_phrases:
      - >-
        The authorized capital stock of the Company consists of the shares set forth on the Schedule,
        and all outstanding shares are duly authorized, validly issued, fully paid, and non-assessable.
      - >-
        Except for the equity awards set forth on the Schedule, there are no outstanding options, warrants,
        or other rights to acquire capital stock of the Company.
    exclusion_cues:
      - A seller's ownership of the shares it sells is ma.rep.title_to_shares.
      - Ownership of subsidiaries is ma.rep.subsidiaries.
    crosswalk:
      section_v1:
        - id: 6069a2d0ab1b2e82
          relation: narrower
          party: target
        - id: 9b01dbbf243c5aeb
          relation: narrower
          party: buyer
      section_v2:
        - id: 41dad5682b1f26e0
          relation: narrower
          party: target
        - id: 42436348d3eb2268
          relation: narrower
          party: buyer
    introduced_in: '2026.1'

  - id: ma.rep.subsidiaries
    label: Subsidiaries; Equity Investments
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The list of the party's subsidiaries, its ownership of their equity, and its other equity investments.
    canonical_terms:
      - Subsidiaries
      - all of the outstanding equity interests of each Subsidiary
      - owned directly or indirectly
      - no equity interest in any other Person
    example_phrases:
      - >-
        Section [•] of the Disclosure Schedule sets forth each Subsidiary of the Company and its jurisdiction
        of organization. All of the outstanding equity interests of each Subsidiary are owned by the Company,
        free and clear of all Liens.
    crosswalk:
      section_v1:
        - id: 6069a2d0ab1b2e82
          relation: narrower
          party: target
        - id: 9b01dbbf243c5aeb
          relation: narrower
          party: buyer
      section_v2:
        - id: 41dad5682b1f26e0
          relation: narrower
          party: target
        - id: 42436348d3eb2268
          relation: narrower
          party: buyer
    introduced_in: '2026.1'

  - id: ma.rep.title_to_shares
    label: Title to the Shares Being Sold
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      A seller's statement that it owns the shares or interests it sells, free of liens, and that the
      buyer will receive good title at closing.
    canonical_terms:
      - record and beneficial owner
      - good and valid title to the Shares
      - free and clear of all Liens
      - upon delivery, Buyer will acquire
    example_phrases:
      - >-
        Seller is the record and beneficial owner of the Shares, free and clear of all Liens, and upon
        the Closing, Buyer will acquire good and valid title to the Shares.
    exclusion_cues:
      - The target's own capital structure is ma.rep.capitalization.
      - Title to operating assets is ma.rep.title_sufficiency_assets.
    introduced_in: '2026.1'

  - id: ma.rep.no_conflict
    label: No Conflict; Required Consents and Filings
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      Signing and performing the agreement will not breach the party's organizational documents, its contracts
      or the law, and no governmental consent or filing is needed other than those listed, such as the
      HSR Act and securities filings.
    canonical_terms:
      - non-contravention
      - conflict with or violate
      - result in a breach of or default under
      - no consent, approval or authorization of any Governmental Authority
      - HSR Act
      - required filings and consents
    example_phrases:
      - >-
        The execution and delivery of this Agreement do not, and the consummation of the transactions
        will not, conflict with or violate the Organizational Documents of the Company.
      - >-
        No consent, approval, or authorization of, or filing with, any Governmental Authority is required
        by the Company except for the HSR filing and the filings set forth on the Schedule.
    exclusion_cues:
      - The covenant to make antitrust filings is ma.regulatory.antitrust_filings.
      - The covenant to seek contract consents is ma.efforts.third_party_consents.
    crosswalk:
      section_v1:
        - id: 7aa7be7c5d9555c2
          relation: exact
          party: target
        - id: 1b47e9b79ea6c6b6
          relation: exact
          party: buyer
      section_v2:
        - id: 050e7a070fb83cae
          relation: exact
          party: target
        - id: a1e8195771e73101
          relation: exact
          party: buyer
    introduced_in: '2026.1'

  - id: ma.rep.required_vote
    label: Required Stockholder Vote
    kind: provision
    nav_parent: ma.nav.reps.fundamental
    also_listed_under:
      - ma.nav.reps.transaction
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The stockholder vote that is needed to approve the deal, stated as the only vote required.
    canonical_terms:
      - Required Company Stockholder Vote
      - Company Stockholder Approval
      - affirmative vote of the holders of a majority
      - only vote of the holders of any class
    example_phrases:
      - >-
        The affirmative vote of the holders of a majority of the outstanding shares of Company Common
        Stock is the only vote of the holders of any class of capital stock of the Company necessary to
        adopt this Agreement.
    exclusion_cues:
      - The covenant to hold the meeting is ma.approval.stockholder_meeting.
      - The closing condition is ma.condition.stockholder_approval.
    value_schema:
      status: stub
      fields:
        - name: threshold
          type: text
        - name: majority_of_minority
          type: boolean
    introduced_in: '2026.1'

  - id: ma.rep.sec_reports
    label: SEC Reports
    kind: provision
    nav_parent: ma.nav.reps.financial
    tier: label
    wave: 1
    attributes:
      party: maker
    description: >-
      The party has filed all required reports with the SEC, the reports complied with the securities
      laws when filed, and none contained a material misstatement or omission.
    canonical_terms:
      - Company SEC Documents
      - filed or furnished all forms, reports and documents
      - untrue statement of a material fact
      - Securities Act
      - Exchange Act
      - Sarbanes-Oxley Act
    example_phrases:
      - >-
        The Company has timely filed all forms, reports, and documents required to be filed with the SEC,
        and such SEC Reports complied in all material respects with the Securities Act and the Exchange
        Act.
      - >-
        Each required certification under Sections 302 and 906 of the Sarbanes-Oxley Act has been made.
    exclusion_cues:
      - The financial statements inside those reports are ma.rep.financial_statements.
      - Controls over financial reporting are ma.rep.internal_controls.
      - Accuracy of the proxy statement for this deal is ma.rep.information_supplied.
      - A SPAC's promise to keep filing its SEC reports until closing is ma.spac.public_filings.
    crosswalk:
      section_v2:
        - id: 89adfe54f18848d5
          relation: exact
          party: target
        - id: a8793b071d8025d4
          relation: exact
          party: buyer
    introduced_in: '2026.1'

