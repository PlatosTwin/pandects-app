        makes no other representation or warranty, express or implied, at law or in equity, and the Company
        hereby disclaims any such other representation or warranty.
    exclusion_cues:
      - >-
        The other party's statement that it did not rely on outside statements is ma.rep.non_reliance.
      - A clause limiting tax representations to the tax section is tax.rep.ring_fencing.
      - >-
        The speaker decides. The party that disclaims its own other representations takes this concept. The
        other party's acknowledgment that no other representation is made takes ma.rep.non_reliance, with
        the acknowledging party as the maker, also under a heading such as No Other Representations. One
        section often holds both statements: label each.
    crosswalk:
      section_v1:
