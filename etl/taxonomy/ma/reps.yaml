        - id: d85b9718366d99a5
          relation: narrower
          party: buyer
      section_v2:
        - id: 35716c409b331426
          relation: narrower
          party: target
        - id: 303f5a4e8a0af7b6
          relation: narrower
          party: buyer
    introduced_in: '2026.1'

