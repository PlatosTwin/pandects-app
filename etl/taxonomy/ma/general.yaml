    introduced_in: '2026.1'
concepts:

  - id: ma.notices
    label: Notices
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: How notices under the agreement must be given and when they take effect.
    canonical_terms:
      - notices
      - shall be in writing
      - delivered personally, by email or by overnight courier
      - with a copy to
    example_phrases:
      - >-
        All notices, requests, consents, and other communications hereunder shall be in writing and shall
        be deemed duly given (i) when delivered personally, (ii) one Business Day after being sent by
        reputable overnight courier, or (iii) when sent by email (with confirmation of transmission),
        in each case to the addresses set forth below.
      - >-
        If to the Company: [address]; with a copy (which shall not constitute notice) to its counsel at
        [address].
    crosswalk:
      section_v1:
        - id: d75eeddb4839a607
          relation: exact
      section_v2:
        - id: 45e396494397aa1a
          relation: exact
    introduced_in: '2026.1'

  - id: ma.entire_agreement
    label: Entire Agreement
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: >-
      The agreement and the named related documents are the whole agreement of the parties and replace
      earlier ones.
    canonical_terms:
      - entire agreement
      - integration
      - supersedes all prior agreements and understandings
      - complete agreement
    example_phrases:
      - >-
        This Agreement, together with the Disclosure Schedules, the Exhibits, and the Confidentiality
        Agreement, constitutes the entire agreement among the parties with respect to the subject matter
        hereof and supersedes all prior and contemporaneous agreements, representations, warranties, and
        understandings, both written and oral.
    exclusion_cues:
      - A statement that a party relied on nothing outside the agreement is ma.rep.non_reliance.
    crosswalk:
      section_v1:
        - id: e63ceec3215c234b
          relation: narrower
      section_v2:
        - id: 9bfdbe24e1314cb3
          relation: exact
    introduced_in: '2026.1'

  - id: ma.amendment
    label: Amendment; Waiver; Extension
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: >-
      How the agreement may be amended, including limits on amendments after the stockholder vote, and how
      a party may waive a right or extend the time for performance.
    canonical_terms:
      - amendment
      - modification
      - may be amended only by an instrument in writing
      - after receipt of the Company Stockholder Approval
      - waiver
      - extension; waiver
      - no failure or delay shall operate as a waiver
      - extend the time for the performance
    example_phrases:
      - >-
        This Agreement may be amended, modified, or supplemented only by a written instrument duly executed
        by or on behalf of each party hereto.
      - >-
        After the Company Stockholder Approval has been obtained, no amendment shall be made that by Law
        requires further approval of the Company's stockholders without such approval.
      - >-
        Any agreement on the part of a party to any extension or waiver shall be valid only if set forth
        in a written instrument signed on behalf of such party.
      - >-
        No failure or delay by any party in exercising any right, power, or privilege hereunder shall
        operate as a waiver thereof, nor shall any single or partial exercise thereof preclude any other
        or further exercise thereof.
    crosswalk:
      section_v1:
        - id: 5fddb016bfeff147
          relation: exact
      section_v2:
        - id: 5a37b2bc58e3784b
          relation: broader
        - id: 78fd5d5468f81aa4
          relation: broader
    introduced_in: '2026.1'

  - id: ma.assignment
    label: Assignment; Successors and Assigns
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: >-
      Whether a party may assign the agreement, the exceptions, and that the agreement binds successors.
    canonical_terms:
      - assignment
      - successors and assigns
      - binding effect
      - may not be assigned without the prior written consent
    example_phrases:
      - >-
        Neither this Agreement nor any of the rights, interests, or obligations hereunder may be assigned
        by any party (whether by operation of law or otherwise) without the prior written consent of the
        other parties, and any purported assignment without such consent shall be null and void.
      - >-
        Notwithstanding the foregoing, Parent may assign its rights and obligations to any wholly owned
        Subsidiary and may collaterally assign its rights to the Financing Sources, in each case without
        relieving Parent of its obligations.
    crosswalk:
      section_v1:
        - id: 679b4920063265f9
          relation: exact
      section_v2:
        - id: bc9ef8b45c800b0c
          relation: exact
    introduced_in: '2026.1'

  - id: ma.third_party_beneficiaries
    label: No Third-Party Beneficiaries
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: >-
      The agreement gives rights only to the parties, with listed exceptions such as indemnified directors
      and officers.
    canonical_terms:
      - no third-party beneficiaries
      - parties in interest
      - not intended to confer upon any Person other than the parties
      - third party beneficiaries
    example_phrases:
      - >-
        This Agreement is for the sole benefit of the parties hereto and their permitted successors and
        assigns and nothing herein, express or implied, is intended to or shall confer upon any other
        Person any legal or equitable right, benefit, or remedy of any nature whatsoever.
      - >-
        Notwithstanding the foregoing, (i) the D&O Indemnified Persons are intended third-party beneficiaries
        of Section [•], (ii) the Financing Sources are intended third-party beneficiaries of the provisions
        referenced in Section [•], and (iii) from and after the Effective Time, the holders of Shares
        are intended third-party beneficiaries of the right to receive the Merger Consideration.
    exclusion_cues:
      - The lenders' rights are ma.financing.source_protections.
      - The rule for employees is ma.employee.comp_benefits_continuation.
    crosswalk:
      section_v1:
        - id: e63ceec3215c234b
          relation: narrower
      section_v2:
        - id: 66b59f33e17688fa
          relation: exact
    introduced_in: '2026.1'

  - id: ma.severability
    label: Severability; Counterparts; Remedies Cumulative
    kind: provision
    nav_parent: ma.nav.general.agreement
    tier: label
    wave: 1
    description: >-
      Three standard clauses. An invalid term does not affect the rest of the agreement. The agreement may
      be signed in counterparts and by electronic means. The remedies in the agreement add to those
      available at law or in equity.
    canonical_terms:
      - severability
      - invalid, illegal or incapable of being enforced
      - remain in full force and effect
      - counterparts
      - electronic signature
      - facsimile
      - .pdf
      - effectiveness
      - remedies cumulative
      - cumulative and not exclusive
      - other remedies
    example_phrases:
      - >-
        If any term or other provision of this Agreement is held to be invalid, illegal, or incapable
        of being enforced by any rule of Law or public policy, all other terms and provisions of this
        Agreement shall nevertheless remain in full force and effect.
      - >-
        Upon a determination that any term or provision is invalid, illegal, or incapable of being enforced,
        the parties shall negotiate in good faith to modify this Agreement so as to effect the original
        intent of the parties as closely as possible in an acceptable manner.
      - >-
        This Agreement may be executed in two or more counterparts, each of which shall be deemed an original,
        but all of which together shall constitute one and the same instrument.
      - >-
        Delivery of an executed counterpart of a signature page by facsimile or by email in .pdf or other
        electronic format shall be as effective as delivery of a manually executed counterpart.
      - >-
        All rights and remedies under this Agreement are cumulative and not exclusive of any rights or
        remedies provided by Law.
    crosswalk:
      section_v1:
        - id: e63ceec3215c234b
          relation: related
      section_v2:
        - id: 0d45fa1a398d6a35
          relation: broader
        - id: 83418c5cdc530887
          relation: broader
    introduced_in: '2026.1'

  - id: ma.expenses
    label: Fees and Expenses
    kind: provision
    nav_parent: ma.nav.general.costs
    tier: label
    wave: 1
    description: >-
      The general rule on who pays the costs of the deal, usually each party its own, with listed exceptions.
    canonical_terms:
      - expenses
      - fees and expenses
      - shall be paid by the party incurring such fees or expenses
      - whether or not the Merger is consummated
    example_phrases:
      - >-
        Except as otherwise expressly set forth herein, all fees and expenses incurred in connection with
        this Agreement shall be paid by the party incurring such fees and expenses, whether or not the
        Merger is consummated.
    exclusion_cues:
      - Reimbursement of expenses on termination is ma.termination.expense_reimbursement.
      - Transfer taxes are tax.transfer.allocation.
      - Regulatory filing fees are ma.regulatory.filing_fee_allocation.
    crosswalk:
      section_v1:
        - id: 426429d401a47a6b
          relation: exact
      section_v2:
        - id: 54b5db7d36480690
          relation: exact
    introduced_in: '2026.1'

  - id: ma.merger_sub_obligations
    label: Obligations of Merger Sub; Parent Undertaking
    kind: provision
    nav_parent: ma.nav.general.costs
    tier: label
    wave: 1
    description: >-
      The buyer's promise to cause its merger subsidiary to perform, its guarantee of the subsidiary's
      duties, and its vote as the subsidiary's sole stockholder.
    canonical_terms:
      - obligations of Merger Sub
      - Parent shall cause Merger Sub to perform
      - sole stockholder of Merger Sub
      - Parent vote
      - performance guaranty
    example_phrases:
      - >-
        Parent shall cause Merger Sub to perform its obligations under this Agreement and to consummate
        the Merger on the terms and subject to the conditions set forth herein.
    exclusion_cues:
      - A sponsor's limited guarantee is ma.financing.limited_guarantee.
    introduced_in: '2026.1'

  - id: ma.legal_representation
    label: Legal Representation; Privilege
    kind: provision
    nav_parent: ma.nav.general.costs
    tier: label
    wave: 1
    description: >-
      Waiver of conflicts so that the sellers' law firm may act for them after closing, and the rule that
      pre-closing privileged communications about the deal stay with the sellers.
    canonical_terms:
      - legal representation
      - waiver of conflicts
      - attorney-client privilege
      - Privileged Communications
      - conflicts and privilege
    example_phrases:
      - >-
        All communications between the Sellers and [Law Firm] relating to the negotiation of this Agreement
        shall be deemed attorney-client privileged, and the privilege shall belong solely to the Sellers
        and shall not pass to Buyer or the Company.
    introduced_in: '2026.1'

  - id: ma.misc.other
    label: Other General Provision
    kind: provision
    nav_parent: ma.nav.general.other
    tier: label
    wave: 1
    description: >-
      A standard term that fits no other concept, such as time of the essence, currency, or a statement
