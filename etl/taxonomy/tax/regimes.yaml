# Pandects taxonomy, tax pack (`tax`). Navigation branch: Special Regimes.
# Structure and labels mirror tax_clause_taxonomy_l1/l2/l3, which was built with a tax professor.
# Nodes marked `proposed: true` are additions that await the maintainer's decision.
# Field reference: etl/taxonomy/README.md. Validate with: python -m etl.domain.taxonomy_pack
pack: tax
release: '2026.1'
branch:
  id: tax.nav.regimes
  label: Special Regimes
  kind: branch
  order: 6
  assignable: true
  description: >-
    Provisions tied to a special tax regime: international rules, pass-through entities and industry-specific
    rules.
  also_listed_under:
    - ma.nav.covenants.tax
  crosswalk:
    tax_v1:
      - id: tax.6
        relation: exact
  introduced_in: '2026.1'
groups:

  - id: tax.nav.regimes.international
    label: International Tax
    kind: group
    nav_parent: tax.nav.regimes
    assignable: true
    description: Provisions on cross-border tax rules.
    crosswalk:
      tax_v1:
        - id: tax.6.1
          relation: exact
    introduced_in: '2026.1'

  - id: tax.nav.regimes.pass_through
    label: Pass-Through Regimes
    kind: group
    nav_parent: tax.nav.regimes
    assignable: true
    description: Provisions tied to REIT, RIC, S corporation or partnership status.
    crosswalk:
      tax_v1:
        - id: tax.6.2
          relation: exact
    introduced_in: '2026.1'

  - id: tax.nav.regimes.industry
    label: Industry-Specific Rules
    kind: group
    nav_parent: tax.nav.regimes
    assignable: true
    description: Provisions tied to industry-specific tax rules.
    crosswalk:
      tax_v1:
        - id: tax.6.3
          relation: exact
    introduced_in: '2026.1'
concepts:

  - id: tax.international.cfc
    label: CFC / Subpart F / GILTI / NCTI-Related Matters
    kind: provision
    nav_parent: tax.nav.regimes.international
    tier: label
    description: >-
      Provisions on controlled foreign corporations: Subpart F income, GILTI or net CFC tested income,
      Section 956 and related elections.
    canonical_terms:
      - controlled foreign corporation
      - Subpart F
      - GILTI
      - Section 951A
      - Section 956
    example_phrases:
      - >-
        No Subsidiary that is a controlled foreign corporation holds an investment in United States property
        within the meaning of Section 956 of the Code.
    crosswalk:
      tax_v1:
        - id: tax.6.1.1
          relation: exact
    introduced_in: '2026.1'

  - id: tax.international.pfic
    label: PFIC-Related Matters
    kind: provision
    nav_parent: tax.nav.regimes.international
    tier: label
    description: Provisions on passive foreign investment company status.
    canonical_terms:
      - passive foreign investment company
      - PFIC
      - Section 1297
      - QEF election
    example_phrases:
      - >-
        The Company is not, and has never been, a passive foreign investment company within the meaning
        of Section 1297 of the Code.
    crosswalk:
      tax_v1:
        - id: tax.6.1.2
          relation: exact
    introduced_in: '2026.1'

  - id: tax.international.residency_pe
    label: Tax Residency / Permanent Establishment
    kind: provision
    nav_parent: tax.nav.regimes.international
    tier: label
    description: >-
      Provisions on tax residency and on a permanent establishment or taxable presence outside the country
      of organization.
    canonical_terms:
      - permanent establishment
      - resident for Tax purposes
      - taxable presence
    example_phrases:
      - >-
        The Company does not have a permanent establishment in any country other than the country of its
        organization.
    exclusion_cues:
      - The interim covenant not to change residency is tax.interim.no_residency_change.
    crosswalk:
      tax_v1:
        - id: tax.6.1.3
          relation: exact
    introduced_in: '2026.1'

  - id: tax.international.treaty_withholding
    label: Treaty Claims / Cross-Border Withholding
    kind: provision
    nav_parent: tax.nav.regimes.international
    tier: label
    description: Provisions on tax treaty claims and withholding on cross-border payments.
    canonical_terms:
      - income tax treaty
      - treaty benefits
      - cross-border withholding
    example_phrases:
      - >-
        The Company is entitled to the benefits of the income tax treaty between [•] and the United States.
    exclusion_cues:
      - Withholding from deal payments is tax.withholding.provision.
    crosswalk:
      tax_v1:
        - id: tax.6.1.4
          relation: exact
    introduced_in: '2026.1'

  - id: tax.passthrough.reit
    label: REIT
    kind: provision
    nav_parent: tax.nav.regimes.pass_through
    tier: label
    description: >-
      Provisions on real estate investment trust status: qualification, the REIT opinion, and covenants
      that protect the status.
    canonical_terms:
      - real estate investment trust
      - REIT
      - Section 856
      - REIT opinion
    example_phrases:
      - >-
        The Company has been organized and operated in conformity with the requirements for qualification
        and taxation as a REIT.
    crosswalk:
      tax_v1:
        - id: tax.6.2.1
          relation: exact
    introduced_in: '2026.1'

  - id: tax.passthrough.ric
    label: RIC
    kind: provision
    nav_parent: tax.nav.regimes.pass_through
    tier: label
    description: Provisions on regulated investment company status.
    canonical_terms:
      - regulated investment company
      - RIC
      - Subchapter M
    example_phrases:
      - >-
        The Company has qualified as a regulated investment company under Subchapter M of the Code.
    crosswalk:
      tax_v1:
        - id: tax.6.2.2
          relation: exact
    introduced_in: '2026.1'

  - id: tax.passthrough.s_corporation
    label: S Corporation
    kind: provision
    nav_parent: tax.nav.regimes.pass_through
    tier: label
    description: >-
      Covenants and other operative provisions tied to S corporation status, such as the final S corporation
      return, tax distributions and Section 1374 tax.
    canonical_terms:
      - S corporation
      - Section 1362
      - built-in gains tax
      - Section 1374
    example_phrases:
      - >-
        Seller shall be responsible for any Tax imposed on the Company under Section 1374 of the Code.
    exclusion_cues:
      - Representations on a valid S election are under tax.nav.reps.s_corporation.
    crosswalk:
      tax_v1:
        - id: tax.6.2.3
          relation: exact
    introduced_in: '2026.1'

  - id: tax.passthrough.partnership
    label: Partnership
    kind: provision
    nav_parent: tax.nav.regimes.pass_through
    tier: label
    description: >-
      Covenants and other operative provisions tied to partnership tax status, such as tax distributions,
      the partnership representative and allocations for the year of sale.
    canonical_terms:
      - partnership representative
      - tax distributions
      - Section 706
      - allocation for the year of the Closing
    example_phrases:
      - >-
        The Company's items of income and loss for the taxable year that includes the Closing shall be
        allocated using the interim closing method under Section 706 of the Code.
    exclusion_cues:
      - Partnership tax representations are under tax.nav.reps.partnership.
      - The intended treatment of the deal is tax.treatment.partnership.
    crosswalk:
      tax_v1:
        - id: tax.6.2.4
          relation: exact
    introduced_in: '2026.1'

  - id: tax.industry.insurance
    label: Insurance
    kind: provision
    nav_parent: tax.nav.regimes.industry
    tier: label
    description: Tax provisions specific to insurance companies.
    canonical_terms:
      - Section 816
      - life insurance company
      - insurance reserves for Tax purposes
    example_phrases:
      - >-
        Each Insurance Subsidiary is a life insurance company within the meaning of Section 816 of the
        Code.
    exclusion_cues:
      - Insurance policies of the business are ma.rep.insurance.
    crosswalk:
      tax_v1:
        - id: tax.6.3.1
          relation: exact
    introduced_in: '2026.1'

  - id: tax.industry.energy
    label: Energy
    kind: provision
    nav_parent: tax.nav.regimes.industry
    tier: label
    description: >-
      Tax provisions specific to energy businesses, such as production tax credits, tax equity structures,
      depletion and tax partnerships for oil and gas.
    canonical_terms:
      - production tax credit
      - investment tax credit
      - tax equity
      - tax partnership
    example_phrases:
      - None of the Oil and Gas Properties is subject to any tax partnership agreement.
    crosswalk:
      tax_v1:
        - id: tax.6.3.2
          relation: exact
    introduced_in: '2026.1'

  - id: tax.industry.other
    label: Other Industry-Specific Rules
    kind: provision
    nav_parent: tax.nav.regimes.industry
    tier: label
    description: Tax provisions specific to another industry.
    canonical_terms:
      - industry-specific Tax
    crosswalk:
      tax_v1:
        - id: tax.6.3.3
          relation: exact
    introduced_in: '2026.1'

  - id: tax.international.transfer_pricing
    label: Transfer Pricing
    kind: provision
    nav_parent: tax.nav.regimes.international
    proposed: true
    tier: label
    description: >-
      A representation or covenant on compliance with transfer pricing rules and documentation, including
      Section 482.
    canonical_terms:
      - transfer pricing
      - Section 482
      - arm's length
      - contemporaneous documentation
    example_phrases:
      - >-
        The Company is in compliance in all material respects with all applicable transfer pricing Laws,
        including Section 482 of the Code.
    introduced_in: '2026.1'
