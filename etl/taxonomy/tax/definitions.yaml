# Pandects taxonomy, tax pack (`tax`). Navigation branch: Tax Definitions.
# Structure and labels mirror tax_clause_taxonomy_l1/l2/l3, which was built with a tax professor.
# Nodes marked `new_in_redesign: true` are additions to the legacy tax tree. The maintainer accepted them on 2026-11-22.
# Field reference: etl/taxonomy/README.md. Validate with: python -m etl.domain.taxonomy_pack
pack: tax
release: '2026.1'
branch:
  id: tax.nav.definitions
  label: Tax Definitions
  kind: branch
  order: 10
  assignable: true
  new_in_redesign: true
  description: >-
    Defined terms that set the scope of the tax provisions. Proposed addition: the legacy tree has no
    node for them.
  also_listed_under:
    - ma.nav.definitions.key_terms
  introduced_in: '2026.1'
groups: []
concepts:

  - id: tax.def.tax
    label: '"Tax" / "Taxes" Definition'
    kind: definition
    nav_parent: tax.nav.definitions
    new_in_redesign: true
    tier: label
    description: >-
      The definition of Tax or Taxes: the kinds of taxes covered, and whether it reaches interest, penalties
      and the taxes of another person.
    canonical_terms:
      - '"Tax" or "Taxes" means'
      - including any interest, penalty or addition thereto
      - whether disputed or not
    example_phrases:
      - >-
        "Taxes" means all federal, state, local and foreign taxes, including income, gross receipts, sales,
        use, payroll, withholding and property taxes, together with any interest, penalties or additions.
    exclusion_cues:
      - >-
        A definition of "Indemnified Taxes" is not this concept. Its listed categories take the concepts
        under tax.nav.indemnity.indemnified_taxes, and its lead-in takes that group.
      - A definition of "Pre-Closing Taxes" is tax.indemnity.pre_closing_taxes.
      - >-
        A definition of "Transfer Taxes" is tax.nav.transfer_withholding.transfer. When the term is defined
        inside the sentence that says who bears those taxes, the sentence is tax.transfer.allocation.
    introduced_in: '2026.1'

  - id: tax.def.tax_return
    label: '"Tax Return" Definition'
    kind: definition
    nav_parent: tax.nav.definitions
    new_in_redesign: true
    tier: label
    description: The definition of Tax Return.
    canonical_terms:
      - '"Tax Return" means'
      - return, declaration, report, claim for refund or information return
    example_phrases:
      - >-
        "Tax Return" means any return, declaration, report, claim for refund or information return relating
        to Taxes, including any schedule or amendment.
    introduced_in: '2026.1'

  - id: tax.def.tax_period
    label: Tax Period Definitions
    kind: definition
    nav_parent: tax.nav.definitions
    new_in_redesign: true
    tier: label
    description: The definitions of Pre-Closing Tax Period, Post-Closing Tax Period and Straddle Period.
    canonical_terms:
      - '"Pre-Closing Tax Period" means'
      - '"Straddle Period" means'
      - '"Post-Closing Tax Period" means'
    example_phrases:
      - >-
        "Straddle Period" means any taxable period that begins on or before, and ends after, the Closing
        Date.
    exclusion_cues:
      - The rule that splits the tax of a straddle period is under tax.nav.indemnity.straddle.
      - >-
        A definition of "Pre-Closing Taxes", the taxes for those periods, is tax.indemnity.pre_closing_taxes.
    introduced_in: '2026.1'
