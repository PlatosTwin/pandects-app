[project]
name = "etl"
requires-python = ">=3.11.5,<=3.13.3"
version = "0.1.0"
dependencies = [
    "dagster==1.13.1",
    "datasketch>=1.6.0",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.1",
    "numpy>=2.4.6",
    "torch>=2.15.0,<2.16",
    "pytorch-lightning>=2.5",
    "lightning>=2.5",
    # Held below 1.9: 1.9 cannot unpickle the live page-classifier review model
    # (GradientBoostingClassifier saved under 1.8; "No module named '_loss'").
    # Lift only after retraining and re-saving that model.
    "scikit-learn>=1.9.1,<1.10",
    "scipy>=1.17.1",
    "requests>=2.34.2",
    "joblib>=1.6.0",
    "xgboost>=3.0",
    "transformers>=5.23.0",
    "openai>=1.100",
    "voyageai>=0.6.0",
    "optuna>=4.4",
    "optuna-integration[pytorch_lightning]>=4.4",
    "sklearn-crfsuite>=0.5",
    "tensorboard>=2.21.0",
    "huggingface-hub>=0.34",
    "mysqlclient>=2.3.1",
    "pyarrow>=23",
    "basedpyright>=1.40.2",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.1",
    "dagster-dg-cli==1.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "etl"
registry_modules = [
    "etl.components.*",
]
