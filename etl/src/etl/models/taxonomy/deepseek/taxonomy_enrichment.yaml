- standard_id: 5a37b2bc58e3784b
  level: l3
  label: Amendment; Modification
  l1_label: Miscellaneous and General Provisions
  l2_label: Amendment, Waiver, Assignment
  description: Section specifying how the agreement may be amended or modified — only by a written instrument
    signed by the parties — with any post-stockholder-approval limitations required by the applicable
    corporate statute.
  canonical_terms:
  - amended
  - modified
  - only by an instrument in writing
  - signed by each of the parties
  - no amendment after Stockholder Approval that requires further approval
  - supplement
  example_phrases:
  - This Agreement may be amended, modified, or supplemented only by a written instrument duly executed
    by or on behalf of each party hereto.
  - After the Company Stockholder Approval has been obtained, no amendment shall be made that by Law requires
    further approval of the Company's stockholders without such approval.
  - No course of dealing shall be deemed to amend or modify any provision of this Agreement.
  exclusion_cues:
  - Waiver of rights is the Waiver; No Waiver leaf.
  - Assignment is the Assignment; Successors and Assigns leaf.
- standard_id: bc9ef8b45c800b0c
  level: l3
  label: Assignment; Successors and Assigns; Binding Effect
  l1_label: Miscellaneous and General Provisions
  l2_label: Amendment, Waiver, Assignment
  description: Section restricting assignment of the agreement or rights thereunder without consent (often
    with a permitted assignment to affiliates or financing collateral assignment), and providing that
    the agreement binds and inures to the benefit of the parties and their permitted successors and assigns.
  canonical_terms:
  - may not assign
  - without the prior written consent
  - by operation of law
  - permitted assignment to an Affiliate
  - collateral assignment to Financing Sources
  - binding upon and inure to the benefit of
  - successors and permitted assigns
  - void assignment
  example_phrases:
  - Neither this Agreement nor any of the rights, interests, or obligations hereunder may be assigned
    by any party (whether by operation of law or otherwise) without the prior written consent of the other
    parties, and any purported assignment without such consent shall be null and void.
  - Notwithstanding the foregoing, Parent may assign its rights and obligations to any wholly owned Subsidiary
    and may collaterally assign its rights to the Financing Sources, in each case without relieving Parent
    of its obligations.
  - This Agreement shall be binding upon and inure to the benefit of the parties and their respective
    successors and permitted assigns.
  exclusion_cues:
  - Amendment/waiver are the other Amendment, Waiver, Assignment leaves.
  - Whether non-parties may enforce is the No Third-Party Beneficiaries leaf.
- standard_id: 78fd5d5468f81aa4
  level: l3
  label: Waiver; No Waiver
  l1_label: Miscellaneous and General Provisions
  l2_label: Amendment, Waiver, Assignment
  description: Section providing that any waiver must be in writing, that no failure or delay in exercising
    a right operates as a waiver, and that a single or partial exercise does not preclude further exercise
    of that or any other right.
  canonical_terms:
  - waiver in writing
  - no failure or delay shall operate as a waiver
  - single or partial exercise
  - no waiver of subsequent breach
  - rights and remedies cumulative
  - extension of time
  example_phrases:
  - Any agreement on the part of a party to any extension or waiver shall be valid only if set forth in
    a written instrument signed on behalf of such party.
  - No failure or delay by any party in exercising any right, power, or privilege hereunder shall operate
    as a waiver thereof, nor shall any single or partial exercise thereof preclude any other or further
    exercise thereof.
  - No waiver of any breach shall be deemed a waiver of any subsequent breach, and all rights and remedies
    are cumulative.
  exclusion_cues:
  - Amendment of the contract is the Amendment; Modification leaf.
  - Indemnification anti-sandbagging (knowledge-based waiver) is Indemnification.
