- standard_id: 83418c5cdc530887
  level: l3
  label: Counterparts; Electronic Signatures
  l1_label: Miscellaneous and General Provisions
  l2_label: General Provisions
  description: Section providing that the agreement may be executed in counterparts, each of which is
    an original and all of which together constitute one instrument, and that electronic or PDF signatures
    (and electronic transmission) are valid and binding.
  canonical_terms:
  - executed in counterparts
  - each of which shall be deemed an original
  - together constitute one and the same instrument
  - delivery by PDF or electronic transmission
  - electronic signatures
  - DocuSign / .pdf
  - E-SIGN / UETA
  example_phrases:
  - This Agreement may be executed in two or more counterparts, each of which shall be deemed an original,
    but all of which together shall constitute one and the same instrument.
  - Delivery of an executed counterpart of a signature page by facsimile or by email in .pdf or other
    electronic format shall be as effective as delivery of a manually executed counterpart.
  - The parties agree that electronic signatures shall have the same legal effect as manual signatures
    under the E-SIGN Act and applicable Law.
