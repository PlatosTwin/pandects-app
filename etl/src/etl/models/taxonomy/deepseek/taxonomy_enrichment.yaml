nodes:
- standard_id: 860e0ad54a2e573b
  level: l2
  label: Buyer/Parent Conditions
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: 'Conditions solely to the buyer''s/parent''s obligation to close: accuracy of the company''s
    reps (bring-down), performance of the company''s covenants, no Company MAE, any financing condition,
    and other customary buyer conditions.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - conditions to obligations of Parent
  - bring-down of Company representations
  - performance of covenants
  - no Company Material Adverse Effect
  - officer's certificate
  example_phrases:
  - This is the 'Buyer/Parent Conditions' category within Conditions to Closing; it groups related sub-leaves
    and is not itself an operative provision — classify to the specific child leaf that matches the section's
    operative text.
  - Use this Buyer/Parent Conditions grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - Conditions common to both parties are Mutual Conditions.
  - Conditions only for the company's benefit are Company/Seller Conditions.
- standard_id: 599e2650722eff66
  level: l3
  label: Accuracy of Company Representations; Bring-Down (condition)
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: Condition that the company's representations and warranties are true and correct as of
    signing and the Closing, subject to the applicable materiality / MAE bring-down standard, evidenced
    by an officer's certificate.
  canonical_terms:
  - representations and warranties true and correct
  - as of the Closing Date
  - de minimis / materiality qualifier
  - Material Adverse Effect standard
  - bring-down certificate
  example_phrases:
  - The representations and warranties of the Company set forth in Article [•] shall be true and correct
    (without giving effect to any materiality or Material Adverse Effect qualifiers) as of the date of
    this Agreement and as of the Closing Date as though made on the Closing Date, except where the failure
    to be so true and correct would not, individually or in the aggregate, reasonably be expected to have
    a Material Adverse Effect.
  - The Fundamental Representations shall be true and correct in all respects (other than de minimis inaccuracies)
    as of the Closing Date.
  - Parent shall have received a certificate signed by an executive officer of the Company to such effect.
  exclusion_cues:
  - The reps themselves are Representations and Warranties.
  - Performance of the company's covenants is the Performance of Company Covenants leaf.
  - How long the reps survive Closing for indemnity is Indemnification (Survival of Representations, Warranties,
    and Covenants).
- standard_id: f7721ad48affcb83
  level: l3
  label: Financing / Funding Condition (if present)
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: Condition (where present, atypical in strategic deals) that the buyer has obtained the
    proceeds of its debt/equity financing, or a marketing-period construct relating to financing availability.
  canonical_terms:
  - financing condition
  - proceeds of the Financing
  - Marketing Period
  - funding condition
  - availability of funds condition
  example_phrases:
  - The obligations of Parent shall be subject to Parent having received the proceeds of the Debt Financing
    (or any Alternative Financing) on the terms set forth in the Commitment Letters.
  - This condition shall be deemed satisfied upon funding of the Financing at the Closing.
  exclusion_cues:
  - The buyer's affirmative covenant to obtain financing is the Financing L1.
  - Most strategic deals expressly disclaim a financing condition; do not infer one.
- standard_id: 77fc7df1fe850a90
  level: l3
  label: No Company Material Adverse Effect (condition)
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: Condition that since the date of the agreement no Company Material Adverse Effect has occurred
    and is continuing.
  canonical_terms:
  - no Material Adverse Effect
  - since the date of this Agreement
  - Company MAE condition
  - no event that would reasonably be expected to have a MAE
  example_phrases:
  - Since the date of this Agreement, there shall not have occurred any Effect that has had or would reasonably
    be expected to have, individually or in the aggregate, a Company Material Adverse Effect.
  - No Company Material Adverse Effect shall have occurred and be continuing as of the Closing Date.
  exclusion_cues:
  - The MAE-related rep / absence-of-changes rep is Representations and Warranties.
  - Bring-down accuracy of all reps is the Accuracy of Company Representations leaf.
- standard_id: d6c13c12f0313084
  level: l3
  label: Other Buyer Closing Conditions (officer's cert; consents; no litigation; dissenters)
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: 'Residual buyer-side conditions not captured by the standard bring-down set: delivery of
    specified third-party consents, absence of specified litigation, a cap on dissenting shares, or other
    deal-specific items.'
  canonical_terms:
  - third-party consents obtained
  - no pending litigation condition
  - dissenting shares threshold
  - specified approvals
  - key consents delivered
  example_phrases:
  - Each of the Consents set forth on Schedule [•] shall have been obtained and shall be in full force
    and effect.
  - Holders of no more than [•]% of the outstanding Shares shall have demanded appraisal rights.
  - There shall not be pending any Action brought by a third party that would reasonably be expected to
    have a Material Adverse Effect.
  exclusion_cues:
  - Standard bring-down accuracy/performance conditions are the dedicated leaves above.
  - Mutual no-injunction is the No Legal Restraint leaf.
- standard_id: 452a003ee641f64b
  level: l3
  label: Performance of Company Covenants (condition)
  l1_label: Conditions to Closing
  l2_label: Buyer/Parent Conditions
  description: Condition that the company has performed and complied in all material respects with its
    covenants and agreements required to be performed at or prior to the Closing.
  canonical_terms:
  - covenants performed or complied with in all material respects
  - on or prior to the Closing Date
  - covenant-compliance condition
  - covenant-compliance certificate
  example_phrases:
  - The Company shall have performed or complied in all material respects with all agreements and covenants
    required by this Agreement to be performed or complied with by it on or prior to the Closing Date.
  - Parent shall have received a certificate of an executive officer of the Company certifying that the
    condition set forth in this Section has been satisfied.
  exclusion_cues:
  - Accuracy/bring-down of the reps is the Accuracy of Company Representations leaf.
  - The covenants themselves are Covenants.
- standard_id: 5754f3e5278857cb
  level: l2
  label: Company/Seller Conditions
  l1_label: Conditions to Closing
  l2_label: Company/Seller Conditions
  description: 'Conditions solely to the company''s/seller''s obligation to close: accuracy of the buyer''s/parent''s
    reps (bring-down), performance of the buyer''s covenants, and other customary company-side conditions.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - conditions to obligations of the Company
  - bring-down of Parent representations
  - performance of Parent covenants
  - Parent officer's certificate
  example_phrases:
  - This is the 'Company/Seller Conditions' category within Conditions to Closing; it groups related sub-leaves
    and is not itself an operative provision — classify to the specific child leaf that matches the section's
    operative text.
  - Use this Company/Seller Conditions grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - Conditions common to both parties are Mutual Conditions.
  - Conditions only for the buyer's benefit are Buyer/Parent Conditions.
- standard_id: 375b798822ae7ee5
  level: l3
  label: Accuracy of Buyer/Parent Representations; Bring-Down (condition)
  l1_label: Conditions to Closing
  l2_label: Company/Seller Conditions
  description: Condition that the buyer's/parent's representations and warranties are true and correct
    as of signing and the Closing, subject to the applicable materiality standard, evidenced by a Parent
    officer's certificate.
  canonical_terms:
  - Parent representations true and correct
  - as of the Closing Date
  - materiality qualifier
  - Parent Material Adverse Effect standard
  - bring-down certificate
  example_phrases:
  - The representations and warranties of Parent and Merger Sub set forth in Article [•] shall be true
    and correct in all material respects as of the date hereof and as of the Closing Date as though made
    on the Closing Date.
  - The Company shall have received a certificate signed by an executive officer of Parent to such effect.
  exclusion_cues:
  - Performance of Parent's covenants is the Performance of Buyer/Parent Covenants leaf.
  - The reps themselves are Representations and Warranties (Buyer/Parent).
  - How long the reps survive Closing for indemnity is Indemnification (Survival of Representations, Warranties,
    and Covenants).
- standard_id: 8e652eaa2ad91753
  level: l3
  label: Other Company Closing Conditions
  l1_label: Conditions to Closing
  l2_label: Company/Seller Conditions
  description: Residual company-side conditions not captured by the standard bring-down set — deal-specific
    items required for the company's benefit (e.g., delivery of the closing payment, specified instruments,
    or tax opinions).
  canonical_terms:
  - other conditions to the Company's obligations
  - tax opinion delivered
  - closing payment funded
  - specified Parent deliverables
  example_phrases:
  - The Company shall have received a written opinion of its tax counsel, dated the Closing Date, to the
    effect that the Merger will qualify as a 'reorganization' within the meaning of Section 368(a) of
    the Code.
  - Parent shall have deposited the aggregate Merger Consideration with the Paying Agent.
  exclusion_cues:
  - Standard bring-down accuracy/performance conditions are the dedicated leaves above.
  - Mutual conditions are the Mutual Conditions leaves.
- standard_id: 949c5df3928699f5
  level: l3
  label: Performance of Buyer/Parent Covenants (condition)
  l1_label: Conditions to Closing
  l2_label: Company/Seller Conditions
  description: Condition that the buyer/parent has performed and complied in all material respects with
    its covenants and agreements required to be performed at or prior to the Closing.
  canonical_terms:
  - Parent covenants performed or complied with in all material respects
  - on or prior to the Closing Date
  - Parent covenant-compliance condition
  - Parent covenant-compliance certificate
  example_phrases:
  - Parent and Merger Sub shall have performed or complied in all material respects with all agreements
    and covenants required by this Agreement to be performed or complied with by them on or prior to the
    Closing Date.
  - The Company shall have received a certificate of an executive officer of Parent certifying that this
    condition has been satisfied.
  exclusion_cues:
  - Accuracy/bring-down of Parent's reps is the Accuracy of Buyer/Parent Representations leaf.
  - The covenants themselves are Covenants.
- standard_id: 33a3eaac3bfe08ba
  level: l2
  label: Mutual Conditions
  l1_label: Conditions to Closing
  l2_label: Mutual Conditions
  description: 'Conditions to each party''s obligation to close that are common to both sides: stockholder
    approval, regulatory approvals/HSR, no legal restraint, and (in stock deals) effectiveness/listing
    of the registration statement.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - mutual conditions
  - conditions to each party's obligations
  - Stockholder Approval
  - HSR clearance
  - no Law or Order
  - no injunction
  example_phrases:
  - This is the 'Mutual Conditions' category within Conditions to Closing; it groups related sub-leaves
    and is not itself an operative provision — classify to the specific child leaf that matches the section's
    operative text.
  - Use this Mutual Conditions grouping only as an umbrella; prefer a specific sub-leaf whenever one concept
    dominates the section.
  exclusion_cues:
  - Conditions only for the buyer's benefit are Buyer/Parent Conditions.
  - Conditions only for the company's benefit are Company/Seller Conditions.
- standard_id: 42009cc7708b6875
  level: l3
  label: No Legal Restraint; No Injunction; No Governmental Order (condition)
  l1_label: Conditions to Closing
  l2_label: Mutual Conditions
  description: Condition that no law, order, or injunction is in effect that prohibits, enjoins, or makes
    illegal the consummation of the transaction.
  canonical_terms:
  - no Law or Order
  - no injunction
  - no legal restraint
  - not enjoined
  - no Governmental Order prohibiting
  - illegal to consummate
  example_phrases:
  - No Governmental Authority of competent jurisdiction shall have enacted, issued, or enforced any Law
    or Order (whether temporary, preliminary, or permanent) that is in effect and restrains, enjoins,
    or otherwise prohibits consummation of the Merger.
  - There shall not be pending any Action by a Governmental Authority seeking to enjoin the consummation
    of the transactions.
  exclusion_cues:
  - Obtaining affirmative regulatory approvals is the Regulatory Approvals leaf.
  - The litigation rep is Representations and Warranties.
- standard_id: 3be445493d6e135b
  level: l3
  label: Registration Statement Effectiveness / Listing (condition)
  l1_label: Conditions to Closing
  l2_label: Mutual Conditions
  description: Condition (stock-deal context) that the Form S-4 / registration statement has become effective,
    no stop order is in effect, and the buyer's shares to be issued have been approved for listing.
  canonical_terms:
  - Registration Statement effective
  - Form S-4
  - no stop order
  - approved for listing
  - NYSE/Nasdaq listing
  - SEC effectiveness
  example_phrases:
  - The Registration Statement shall have been declared effective by the SEC and shall not be the subject
    of any stop order or proceeding seeking a stop order.
  - The shares of Parent Common Stock to be issued in the Merger shall have been approved for listing
    on the NYSE, subject to official notice of issuance.
  exclusion_cues:
  - The covenant to prepare/file the registration statement is Covenants (Stockholder Approval & SEC Process).
  - Cash-only deals will not have this condition; do not stretch to fit.
- standard_id: e2dd92cb9764f512
  level: l3
  label: Regulatory Approvals; HSR Waiting Periods (condition)
  l1_label: Conditions to Closing
  l2_label: Mutual Conditions
  description: Condition that required antitrust/regulatory approvals have been obtained and applicable
    waiting periods (HSR and foreign) have expired or been terminated.
  canonical_terms:
  - HSR waiting period
  - expired or terminated
  - Regulatory Approvals obtained
  - antitrust clearance
  - foreign merger control
  - CFIUS clearance
  example_phrases:
  - The waiting period (and any extension thereof) applicable to the Merger under the HSR Act shall have
    expired or been earlier terminated.
  - All Regulatory Approvals set forth on the Schedule shall have been obtained and shall be in full force
    and effect.
  - Any required approval under the foreign Antitrust Laws set forth on the Schedule shall have been obtained.
  exclusion_cues:
  - The substantive efforts/remedies covenant to obtain clearance is Covenants (Efforts and Regulatory).
  - No-injunction generally is the No Legal Restraint leaf.
- standard_id: e9c123e67b1e047d
  level: l3
  label: Stockholder / Shareholder Approval (condition)
  l1_label: Conditions to Closing
  l2_label: Mutual Conditions
  description: Condition that the requisite stockholder/shareholder approval of the transaction has been
    obtained.
  canonical_terms:
  - Requisite Stockholder Approval
  - Company Stockholder Approval obtained
  - shareholder vote
  - adopted this Agreement
  - Written Consent delivered
  example_phrases:
  - The Company Stockholder Approval shall have been obtained in accordance with the DGCL and the Company's
    Organizational Documents.
  - This Agreement shall have been duly adopted by the affirmative vote of the holders of a majority of
    the outstanding Shares.
  exclusion_cues:
  - The covenant to hold the meeting / solicit consents is Covenants (Stockholder Approval & SEC Process).
  - Buyer-side bring-down conditions are Buyer/Parent Conditions.
- standard_id: f95ff876c20f2d80
  level: l2
  label: Deal Process / No-Shop
  l1_label: Covenants and Agreements
  l2_label: Deal Process / No-Shop
  description: 'Covenants governing the deal process between signing and closing: the no-shop / non-solicitation
    restriction, the fiduciary-out and change-of-recommendation construct, and support / voting / tender
    agreements.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - no-shop
  - non-solicitation
  - Acquisition Proposal
  - fiduciary out
  - Change of Recommendation
  - support agreement
  - force the vote
  example_phrases:
  - This is the 'Deal Process / No-Shop' category within Covenants and Agreements; it groups related sub-leaves
    and is not itself an operative provision — classify to the specific child leaf that matches the section's
    operative text.
  - Use this Deal Process / No-Shop grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - The right to terminate to accept a Superior Proposal is Termination.
  - Efforts to obtain regulatory clearance are the Efforts and Regulatory L2.
- standard_id: 4eae406295a1787b
  level: l3
  label: Fiduciary Out; Change of Recommendation; Superior Proposal (covenant)
  l1_label: Covenants and Agreements
  l2_label: Deal Process / No-Shop
  description: Covenant defining the board's ability to engage on an unsolicited Superior Proposal, make
    a Change of Recommendation (or effect an Intervening Event), the match/negotiation period, and the
    conditions on exercising the fiduciary out — distinct from the termination right itself.
  canonical_terms:
  - Superior Proposal
  - Change of Recommendation
  - Intervening Event
  - fiduciary duties
  - match period
  - negotiate in good faith
  - but-for materiality
  example_phrases:
  - Prior to obtaining the Company Stockholder Approval, the Company Board may make a Change of Recommendation
    in response to a Superior Proposal if it determines in good faith, after consultation with outside
    counsel, that the failure to do so would be inconsistent with its fiduciary duties.
  - Prior to making a Change of Recommendation, the Company shall provide Parent with four Business Days'
    prior written notice and shall negotiate in good faith with Parent during such period regarding adjustments
    to the terms of this Agreement.
  - The Company Board may make a Change of Recommendation in response to an Intervening Event subject
    to the same procedures.
  exclusion_cues:
  - The prohibition on soliciting deals is the No-Shop leaf.
  - Terminating to accept the Superior Proposal is Termination (Termination Rights).
- standard_id: 60b50919d9882565
  level: l3
  label: No-Shop / Non-Solicitation of Alternative Proposals
  l1_label: Covenants and Agreements
  l2_label: Deal Process / No-Shop
  description: Covenant prohibiting the company from soliciting, initiating, or knowingly facilitating
    alternative acquisition proposals, restricting discussions and information sharing, requiring cessation
    of existing discussions, and (where applicable) a go-shop or window-shop construct.
  canonical_terms:
  - shall not solicit
  - non-solicitation
  - Acquisition Proposal
  - go-shop
  - window shop
  - cease existing discussions
  - notify within 24 hours
  - match right
  example_phrases:
  - From the date hereof until the earlier of the Effective Time and termination, the Company shall not,
    and shall cause its Subsidiaries and Representatives not to, initiate, solicit, or knowingly encourage
    any inquiry or the making of any proposal that constitutes or would reasonably be expected to lead
    to an Acquisition Proposal.
  - The Company shall, and shall cause its Representatives to, immediately cease and cause to be terminated
    any existing discussions with any Person with respect to any Acquisition Proposal.
  - The Company shall notify Parent promptly (and in any event within 24 hours) of the receipt of any
    Acquisition Proposal and the material terms thereof.
  exclusion_cues:
  - The board's right to change its recommendation / take a Superior Proposal is the Fiduciary Out leaf.
  - Terminating the agreement to sign the Superior Proposal is Termination.
- standard_id: 9af153875ed400cb
  level: l3
  label: Support / Voting / Tender Agreements; Force-the-Vote
  l1_label: Covenants and Agreements
  l2_label: Deal Process / No-Shop
  description: 'Covenant relating to stockholder support: voting/support or tender agreements from significant
    holders, and a ''force-the-vote'' covenant requiring the company to submit the transaction to a stockholder
    vote even after a Change of Recommendation.'
  canonical_terms:
  - Support Agreement
  - Voting Agreement
  - Tender and Support Agreement
  - force the vote
  - submit to stockholders notwithstanding
  - irrevocable proxy
  - rollover commitment
  example_phrases:
  - Concurrently with the execution of this Agreement, certain stockholders have executed and delivered
    Support Agreements pursuant to which they have agreed to vote their Shares in favor of the adoption
    of this Agreement.
  - Notwithstanding any Change of Recommendation, unless this Agreement has been terminated, the Company
    shall submit this Agreement to a vote of its stockholders at the Company Stockholders Meeting.
  - Each Supporting Stockholder grants an irrevocable proxy to Parent to vote its Shares in accordance
    with the Support Agreement.
  exclusion_cues:
  - The meeting/proxy mechanics generally are the Stockholder / Shareholder Meeting leaf.
  - The no-shop restriction is the No-Shop leaf.
- standard_id: 558b938990a547ab
  level: l2
  label: Disclosure and Communications
  l1_label: Covenants and Agreements
  l2_label: Disclosure and Communications
  description: 'Covenants governing external and inter-party communications: public announcements / press
    releases coordination and the confidentiality covenant governing information exchanged in connection
    with the deal.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - public announcements
  - press release
  - coordinate disclosure
  - Confidentiality Agreement
  - confidential information
  - no unilateral disclosure
  example_phrases:
  - This is the 'Disclosure and Communications' category within Covenants and Agreements; it groups related
    sub-leaves and is not itself an operative provision — classify to the specific child leaf that matches
    the section's operative text.
  - Use this Disclosure and Communications grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - Disclosure-schedule conventions are Definitions and Interpretation.
  - Notice of events between the parties is the Information and Access L2.
- standard_id: 0f6da6e437b9fdf7
  level: l3
  label: Confidentiality (covenant)
  l1_label: Covenants and Agreements
  l2_label: Disclosure and Communications
  description: Covenant addressing confidentiality of information exchanged in connection with the transaction
    — typically continuing or incorporating the pre-existing Confidentiality/NDA agreement and providing
    for its survival or termination upon Closing.
  canonical_terms:
  - Confidentiality Agreement
  - hold in confidence
  - non-public information
  - Evaluation Material
  - use solely for evaluating the transaction
  - non-disclosure obligation
  example_phrases:
  - Each party shall, and shall cause its Representatives to, hold in confidence all non-public information
    furnished in connection with the transactions in accordance with the terms of the Confidentiality
    Agreement.
  - Parent shall use any Evaluation Material solely for the purpose of evaluating and consummating the
    transactions and shall not disclose such information except as permitted by the Confidentiality Agreement.
  - The Confidentiality Agreement is hereby incorporated by reference and the obligations of the parties
    thereunder shall continue in accordance with its terms.
  exclusion_cues:
  - Public-announcement coordination is the Public Announcements leaf.
  - Confidentiality as a surviving provision after termination is Termination.
- standard_id: d15905045d20e6a6
  level: l3
  label: Public Announcements; Press Releases
  l1_label: Covenants and Agreements
  l2_label: Disclosure and Communications
  description: Covenant requiring the parties to consult and coordinate on the timing and content of press
    releases and public statements about the transaction, with carve-outs for legal/stock-exchange requirements
    and for communications consistent with prior public disclosures.
  canonical_terms:
  - press release
  - public announcement
  - consult prior to issuing
  - mutually agree on the initial press release
  - as required by Law or stock exchange
  - consistent with prior public disclosure
  example_phrases:
  - The initial press release with respect to the execution of this Agreement shall be a joint press release
    in a form mutually agreed by Parent and the Company.
  - Thereafter, no party shall issue any press release or make any public announcement concerning the
    transactions without the prior written consent of the other party, except as such party may reasonably
    determine is required by applicable Law or the rules of any stock exchange.
  - The restrictions shall not apply to any disclosure of information that is consistent with prior public
    disclosures made in compliance with this Section.
  exclusion_cues:
  - Confidential treatment of shared diligence information is the Confidentiality (covenant) leaf.
  - Proxy/registration-statement disclosure is the Proxy / Registration Statement leaf.
- standard_id: a7c08f049c38a07f
  level: l2
  label: Efforts and Regulatory
  l1_label: Covenants and Agreements
  l2_label: Efforts and Regulatory
  description: 'Covenants to obtain regulatory clearance and otherwise consummate the deal: reasonable
    best efforts and cooperation, antitrust/HSR filings, remedies/divestitures and hell-or-high-water,
    and CFIUS / foreign-investment and other regulatory approvals.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - reasonable best efforts
  - HSR filing
  - antitrust clearance
  - hell or high water
  - divestiture
  - CFIUS
  - regulatory cooperation
  example_phrases:
  - This is the 'Efforts and Regulatory' category within Covenants and Agreements; it groups related sub-leaves
    and is not itself an operative provision — classify to the specific child leaf that matches the section's
    operative text.
  - Use this Efforts and Regulatory grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - The closing condition that approvals are obtained is Conditions to Closing.
  - A reverse termination fee for regulatory failure is Termination.
- standard_id: e080500390c96970
  level: l3
  label: Antitrust / HSR Filings and Clearances
  l1_label: Covenants and Agreements
  l2_label: Efforts and Regulatory
  description: 'Covenant governing antitrust/competition filings and clearance: making HSR and foreign
    merger-control filings, timing, responding to second requests, information sharing, and coordination
    with the other party on strategy and contacts.'
  canonical_terms:
  - HSR Act
  - Notification and Report Form
  - Second Request
  - early termination
  - foreign merger control
  - antitrust clearance
  - joint defense
  - no pull-and-refile without consent
  example_phrases:
  - Each party shall (i) file its Notification and Report Form pursuant to the HSR Act no later than fifteen
    Business Days after the date hereof and (ii) request early termination of the waiting period.
  - Each party shall promptly supply any additional information and documentary material that may be requested
    pursuant to a Second Request.
  - The parties shall keep each other apprised of the status of communications with, and any inquiries
    or requests for additional information from, any Antitrust Authority.
  exclusion_cues:
  - Commitments to divest / litigate to obtain clearance are the Antitrust/Regulatory Remedies leaf.
  - The HSR-clearance closing condition is Conditions to Closing.
- standard_id: 8ec7524a756ddd05
  level: l3
  label: Antitrust/Regulatory Remedies; Divestitures; Hell-or-High-Water; Reg Litigation
  l1_label: Covenants and Agreements
  l2_label: Efforts and Regulatory
  description: Covenant addressing the extent to which the buyer must accept remedies to obtain clearance
    — divestitures, behavioral commitments, hold-separate, a 'hell or high water' standard or a defined
    cap — and whether the parties must litigate against a government challenge.
  canonical_terms:
  - hell or high water
  - divestitures
  - hold separate
  - behavioral remedies
  - Burdensome Condition
  - defend any Action
  - litigate to avoid an Order
  - remedy cap
  example_phrases:
  - Parent shall take any and all actions necessary to obtain the Regulatory Approvals, including proposing,
    negotiating, and agreeing to the sale, divestiture, or disposition of assets or businesses (a 'hell
    or high water' obligation).
