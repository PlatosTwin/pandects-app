  - D&O run-off insurance is the D&O Indemnification and Insurance L2.
- standard_id: 75301be761b8c91e
  level: l3
  label: Representation & Warranty Insurance (RWI)
  l1_label: Indemnification and Insurance
  l2_label: R&W Insurance
  description: 'Section addressing the R&W insurance policy: the obligation to obtain/bind the policy,
    allocation of premium and retention, the no-subrogation-against-seller requirement (except fraud),
    and that the policy is the primary or exclusive recourse for rep breaches.'
  canonical_terms:
  - R&W Insurance Policy
  - buyer-side policy
  - premium and retention allocation
  - waiver of subrogation except for Fraud
  - exclusive recourse to the Policy
  - policy may not be amended adversely
  - binder delivered at signing
  example_phrases:
  - Buyer shall obtain, effective as of the Closing, a buyer-side representation and warranty insurance
    policy (the 'R&W Insurance Policy'), the premium, underwriting fees, and retention for which shall
    be borne [•].
  - The R&W Insurance Policy shall expressly provide that the insurer waives, and agrees not to pursue,
    any subrogation rights against Seller except in the case of Fraud.
  - Except for claims for Fraud, the R&W Insurance Policy shall be the sole and exclusive source of recovery
    of the Buyer Indemnified Parties for any breach of the representations and warranties of Seller.
  exclusion_cues:
  - Escrow/holdback and recovery ordering are the Escrow / Holdback leaf.
  - General exclusive-remedy/limitation language is the Exclusive Remedy leaf.
