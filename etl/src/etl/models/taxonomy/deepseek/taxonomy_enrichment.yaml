- standard_id: 9f8f97f1f06b1756
  level: l2
  label: D&O Indemnification and Insurance
  l1_label: Indemnification and Insurance
  l2_label: D&O Indemnification and Insurance
  description: 'Post-closing protection of the target''s directors and officers: continuing indemnification,
    advancement, and exculpation, and the purchase of a D&O tail / run-off insurance policy.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - D&O indemnification
  - advancement of expenses
  - exculpation
  - tail policy
  - run-off coverage
  - six-year period
  - no amendment adverse to indemnitees
  example_phrases:
  - This is the 'D&O Indemnification and Insurance' category within Indemnification and Insurance; it
    groups related sub-leaves and is not itself an operative provision — classify to the specific child
    leaf that matches the section's operative text.
  - Use this D&O Indemnification and Insurance grouping only as an umbrella; prefer a specific sub-leaf
    whenever one concept dominates the section.
  exclusion_cues:
  - The company's own insurance rep is Representations and Warranties.
  - R&W insurance is the R&W Insurance L2.
- standard_id: 9078d910f23d3f13
  level: l3
  label: D&O Indemnification; Advancement; Exculpation (post-closing)
  l1_label: Indemnification and Insurance
  l2_label: D&O Indemnification and Insurance
  description: 'Section providing post-closing protection for the target''s former directors and officers:
    continued indemnification and expense advancement for pre-closing acts, maintenance of existing charter/bylaw
    exculpation and indemnification provisions for a specified period, and that these are third-party-beneficiary
    rights of the indemnitees.'
  canonical_terms:
  - indemnify present and former directors and officers
  - advancement of expenses
  - exculpation provisions maintained
  - for six years after the Effective Time
  - no amendment adverse to Indemnified Persons
  - third-party beneficiary rights of D&O indemnitees
  example_phrases:
  - From and after the Effective Time, Parent shall cause the Surviving Corporation to honor and fulfill
    the obligations of the Company under its existing indemnification and exculpation provisions and any
    indemnification agreements with its current or former directors and officers.
  - For a period of six years after the Effective Time, the Surviving Corporation shall indemnify and
    hold harmless, and provide advancement of expenses to, each Indemnified Person to the fullest extent
    permitted by Law for acts or omissions occurring at or prior to the Effective Time.
  - The provisions of this Section are intended to be for the benefit of, and shall be enforceable by,
    each Indemnified Person and his or her heirs, and shall not be amended in a manner adverse to any
    Indemnified Person without his or her consent.
  exclusion_cues:
  - The prepaid tail/run-off insurance policy itself is the D&O Tail / Run-Off Insurance leaf.
  - Indemnification between the buyer and seller for deal breaches is the Indemnification Scope & Survival
    L2.
- standard_id: dc39c0827248d3be
  level: l3
  label: D&O Tail / Run-Off Insurance
  l1_label: Indemnification and Insurance
  l2_label: D&O Indemnification and Insurance
  description: Section requiring procurement of a prepaid 'tail' / run-off directors' and officers' liability
    insurance policy covering pre-closing acts for a specified period (commonly six years), with a cap
    on the premium (e.g., a multiple of the current annual premium) and a fallback to maintain comparable
    coverage.
  canonical_terms:
  - tail policy
  - run-off D&O insurance
  - prepaid six-year policy
  - coverage no less favorable
  - premium cap / 300% of annual premium
  - in lieu of obtaining the tail
  - claims-made for pre-Closing acts
  example_phrases:
  - Prior to the Effective Time, the Company shall purchase a six-year prepaid 'tail' policy with respect
    to its directors' and officers' liability insurance covering acts or omissions occurring at or prior
    to the Effective Time on terms no less favorable than the Company's existing policy.
  - In no event shall Parent or the Surviving Corporation be required to expend for such tail policy an
    annual premium in excess of 300% of the last annual premium paid by the Company prior to the date
    hereof.
  - If the tail policy is not obtained, the Surviving Corporation shall maintain in effect the Company's
    existing D&O policy (or comparable coverage) for six years.
  exclusion_cues:
  - Continuing contractual/charter D&O indemnification is the D&O Indemnification; Advancement leaf.
  - The company's general insurance rep is Representations and Warranties.
- standard_id: 2b8bd1bd1545a092
  level: l2
  label: Indemnification Limitations
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Limitations
  description: 'The contractual limits on indemnification: caps, baskets/deductibles, thresholds and de
    minimis amounts, and other limitations such as exclusive remedy, sandbagging/anti-sandbagging, mitigation,
    and damage exclusions.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - cap
  - basket
  - deductible
  - de minimis
  - exclusive remedy
  - sandbagging
  - mitigation
  - limitations on indemnification
  example_phrases:
  - This is the 'Indemnification Limitations' category within Indemnification and Insurance; it groups
    related sub-leaves and is not itself an operative provision — classify to the specific child leaf
    that matches the section's operative text.
  - Use this Indemnification Limitations grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - Who indemnifies for what is the Indemnification Scope & Survival L2.
  - Escrow as a source of recovery is the Indemnification Procedures L2.
- standard_id: bb4d0ba11aae2936
  level: l3
  label: Caps; Baskets; Deductibles; Thresholds; De Minimis
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Limitations
  description: 'Section setting the quantitative limits on indemnification: the de minimis per-claim threshold,
    the tipping-basket or deductible, the general cap (often tied to an escrow or a percentage of price),
    and separate (often higher) caps for fundamental reps, fraud, and special indemnities.'
  canonical_terms:
  - de minimis amount
  - tipping basket vs. deductible
  - Basket / threshold
  - Cap
  - escrow amount
  - separate cap for Fundamental Representations
  - RWI retention
  example_phrases:
  - No Losses shall be taken into account unless such Loss exceeds $[•] (the 'De Minimis Amount').
  - Seller shall have no liability for indemnification until the aggregate amount of all Losses exceeds
    $[•] (the 'Basket'), in which event Seller shall be liable for the amount of all Losses (i.e., a tipping
    basket) / only those Losses in excess of the Basket (i.e., a deductible).
  - The aggregate liability of Seller for breaches of representations and warranties (other than Fundamental
    Representations) shall not exceed the Indemnity Escrow Amount, and in no event shall aggregate liability
    exceed the Purchase Price.
  exclusion_cues:
  - Sandbagging / mitigation / damage exclusions are the Exclusive Remedy; Sandbagging leaf.
  - The survival periods are the Survival leaf.
- standard_id: 3d843646fd60ebda
  level: l3
  label: Exclusive Remedy; Sandbagging / Anti-Sandbagging; Mitigation; Other Limitations
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Limitations
  description: 'Section containing the non-quantitative limitations: indemnification as the sole and exclusive
    remedy (with fraud/equitable carve-outs), pro-sandbagging or anti-sandbagging treatment of known breaches,
    duty to mitigate, exclusion of consequential/punitive damages, and double-recovery / insurance-and-tax-benefit
    offsets.'
  canonical_terms:
  - sole and exclusive remedy
  - sandbagging
  - anti-sandbagging / knowledge qualifier
  - duty to mitigate
  - no consequential or punitive damages
  - no double recovery
  - net of insurance and tax benefits
  - fraud carve-out
  example_phrases:
  - From and after the Closing, the indemnification provisions of this Article shall be the sole and exclusive
    remedy of the parties for any and all claims relating to this Agreement, except in the case of Fraud
    or for equitable relief.
  - The right to indemnification shall not be affected by any investigation conducted or knowledge acquired
    by the Indemnified Party (pro-sandbagging) / The Indemnified Party shall not be entitled to indemnification
    for any matter of which it had Knowledge prior to the Closing (anti-sandbagging).
  - Losses shall be determined net of any insurance proceeds and Tax Benefits actually received, and in
    no event shall any party be liable for punitive or consequential damages except to the extent paid
    to a third party.
  exclusion_cues:
  - The dollar caps and baskets are the Caps; Baskets leaf.
  - General waiver of consequential damages outside indemnity is Dispute Resolution.
- standard_id: d24b0cf45ea428c0
  level: l2
  label: Indemnification Procedures
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Procedures
  description: 'How indemnification claims are made and satisfied: notice and defense procedures for direct
    and third-party claims, and the sources and ordering of recovery (escrow, holdback, setoff, insurance).'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - claim notice
  - third-party claim
  - defense and control
  - escrow
  - holdback
  - setoff
  - source of recovery
  example_phrases:
  - This is the 'Indemnification Procedures' category within Indemnification and Insurance; it groups
    related sub-leaves and is not itself an operative provision — classify to the specific child leaf
    that matches the section's operative text.
  - Use this Indemnification Procedures grouping only as an umbrella; prefer a specific sub-leaf whenever
    one concept dominates the section.
  exclusion_cues:
  - The caps and baskets are the Indemnification Limitations L2.
  - Who owes the indemnity is the Indemnification Scope & Survival L2.
- standard_id: 710cc9ed4c7c5296
  level: l3
  label: Claims Procedure; Notice; Third-Party Claim Defense and Control
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Procedures
  description: 'Section setting the procedural mechanics for indemnification: content and timing of claim
    notices (and effect of failure to give timely notice), direct-claim response periods, and third-party-claim
    defense — control, counsel selection, the indemnified party''s participation rights, and consent rights
    over settlement.'
  canonical_terms:
  - Claim Notice
  - Direct Claim
  - Third-Party Claim
  - assume the defense
  - control of the defense
  - right to participate with own counsel
  - no settlement without consent
  - failure to notify not a bar absent prejudice
  example_phrases:
  - Promptly after receipt of notice of any Third-Party Claim, the Indemnified Party shall give the Indemnifying
    Party a Claim Notice; failure to do so shall not relieve the Indemnifying Party of its obligations
    except to the extent it is actually prejudiced thereby.
  - The Indemnifying Party shall be entitled to assume and control the defense of such Third-Party Claim
    with counsel of its choice, and the Indemnified Party may participate with its own counsel at its
    own expense.
  - The Indemnifying Party shall not settle any Third-Party Claim without the prior written consent of
    the Indemnified Party unless the settlement is solely for money damages that are fully indemnified
    and includes an unconditional release.
  exclusion_cues:
  - Where the money actually comes from (escrow/setoff) is the Escrow / Holdback leaf.
  - Stockholder/transaction-litigation cooperation (pre-closing) is Covenants.
- standard_id: 82441ff5092e1695
  level: l3
  label: Escrow / Holdback; Setoff; Source of Recovery; Insurance Offset
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Procedures
  description: 'Section governing the sources and ordering of indemnity recovery: the indemnity escrow
    or purchase-price holdback and its release schedule, rights of setoff against earn-out or deferred
    consideration, and the requirement to look first to R&W insurance or other insurance before (or instead
    of) the indemnifying party.'
  canonical_terms:
  - Indemnity Escrow
  - Escrow Agreement
  - holdback
  - release of the Escrow Amount
  - right of setoff
  - recourse / non-recourse
  - first recover from the RWI Policy
  - order of recovery / waterfall
  example_phrases:
  - At the Closing, Buyer shall deposit the Indemnity Escrow Amount with the Escrow Agent to be held and
    disbursed in accordance with the Escrow Agreement.
  - The Indemnity Escrow Amount (less any pending claims) shall be released to Seller on the date that
    is eighteen months after the Closing Date.
  - The Buyer Indemnified Parties shall first seek recovery under the R&W Insurance Policy and the Indemnity
    Escrow before proceeding against Seller directly, and Buyer shall have the right to set off indemnifiable
    Losses against any unpaid Earnout Payment.
  exclusion_cues:
  - The defense/notice mechanics are the Claims Procedure leaf.
  - The RWI policy terms themselves are the R&W Insurance leaf.
- standard_id: 3ad82a390340a3d3
  level: l2
  label: Indemnification Scope & Survival
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Scope & Survival
  description: 'The core of the indemnity bargain: how long the reps, warranties, and covenants survive
    the Closing, and each party''s indemnification obligations and the categories of losses covered.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - survival
  - survival period
  - indemnification by Seller
  - indemnification by Buyer
  - Losses
  - covered claims
  - indemnifiable damages
  example_phrases:
  - This is the 'Indemnification Scope & Survival' category within Indemnification and Insurance; it groups
    related sub-leaves and is not itself an operative provision — classify to the specific child leaf
    that matches the section's operative text.
  - Use this Indemnification Scope & Survival grouping only as an umbrella; prefer a specific sub-leaf
    whenever one concept dominates the section.
  exclusion_cues:
  - Caps, baskets, and other limits are the Indemnification Limitations L2.
  - Claim notice/defense mechanics are the Indemnification Procedures L2.
- standard_id: 71555bbd7059319e
  level: l3
  label: Indemnification by Buyer/Parent; Covered Losses
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Scope & Survival
  description: Section setting out the buyer's/parent's indemnification obligation in favor of the seller
    — typically for breaches of the buyer's reps and covenants and for Assumed Liabilities — and the scope
    of covered Losses.
  canonical_terms:
  - Buyer shall indemnify
  - Seller Indemnified Parties
  - breach of Buyer representation or covenant
  - Assumed Liabilities
  - post-Closing operation
  - hold harmless
  example_phrases:
  - From and after the Closing, Buyer shall indemnify, defend, and hold harmless Seller and its Affiliates
    (the 'Seller Indemnified Parties') from and against any and all Losses arising out of (i) any breach
    of any representation or warranty of Buyer, (ii) any breach of any covenant of Buyer, and (iii) the
    Assumed Liabilities.
  - Buyer shall indemnify the Seller Indemnified Parties for all Losses arising from the operation of
    the Business after the Closing.
  - The provisions of this Section are subject to the limitations set forth in Section [•].
  exclusion_cues:
  - The seller's primary indemnity is the Indemnification by Seller/Company leaf.
  - Procedural mechanics are the Indemnification Procedures L2.
  - Continuing indemnification of the target's pre-closing directors and officers is D&O Indemnification
    and Insurance.
- standard_id: 6ca2b66c7ee43167
  level: l3
  label: Indemnification by Seller/Company; Covered Losses
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Scope & Survival
  description: 'Section setting out the seller''s/company''s (or the securityholders'') indemnification
    obligation: the triggers (breach of reps, breach of covenants, specified/special indemnities such
    as pre-closing taxes or identified matters) and the definition/scope of indemnifiable Losses.'
  canonical_terms:
  - Seller shall indemnify
  - indemnify and hold harmless
  - Buyer Indemnified Parties
  - breach of representation or covenant
  - special indemnities
  - pre-Closing Taxes
  - Losses defined
  - diminution in value
  example_phrases:
  - From and after the Closing, Seller shall indemnify, defend, and hold harmless Buyer and its Affiliates
    and their respective officers, directors, and employees (the 'Buyer Indemnified Parties') from and
    against any and all Losses actually incurred arising out of or resulting from (i) any breach of any
    representation or warranty of Seller, (ii) any breach of any covenant of Seller, and (iii) any Excluded
    Liability.
  - '''Losses'' means losses, damages, liabilities, costs, and expenses, including reasonable attorneys''
    fees.'
  - Seller shall indemnify the Buyer Indemnified Parties for all Taxes of the Company with respect to
    any Pre-Closing Tax Period.
  exclusion_cues:
  - The buyer's reverse indemnity is the Indemnification by Buyer/Parent leaf.
  - Dollar caps/baskets are the Caps; Baskets leaf.
  - Continuing indemnification of the target's pre-closing directors and officers is D&O Indemnification
    and Insurance.
- standard_id: 2e5f7f24f7f8e8c0
  level: l3
  label: Survival of Representations, Warranties, and Covenants
  l1_label: Indemnification and Insurance
  l2_label: Indemnification Scope & Survival
  description: 'Section specifying the survival periods: how long the representations and warranties survive
    Closing (with longer periods for fundamental and specified reps such as tax), the survival of covenants
    per their terms, and any contractual statute-of-limitations / claims-deadline construct.'
  canonical_terms:
  - survive the Closing
  - survival period
  - Fundamental Representations survive longer
  - covenants survive until performed
  - claims must be asserted by
  - expiration of survival
  - no survival / survive only to escrow
  example_phrases:
  - The representations and warranties of the parties contained in this Agreement shall survive the Closing
    until the date that is eighteen (18) months after the Closing Date.
  - Notwithstanding the foregoing, the Fundamental Representations shall survive until sixty (60) days
    following the expiration of the applicable statute of limitations, and the Tax Representations shall
    survive accordingly.
  - Each covenant shall survive the Closing until fully performed in accordance with its terms; no claim
    may be asserted after the expiration of the applicable survival period.
  exclusion_cues:
  - The bring-down condition (accuracy at Closing) is Conditions to Closing.
  - Caps/baskets keyed to those periods are the Caps; Baskets leaf.
