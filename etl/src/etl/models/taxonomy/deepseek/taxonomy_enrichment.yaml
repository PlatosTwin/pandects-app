  level: l3
  label: Merger Consideration; Exchange Ratio / Per-Share Amount
  l1_label: Transaction Mechanics and Consideration
  l2_label: Consideration
  description: 'Section setting the consideration per share: the per-share cash amount and/or stock exchange
    ratio, conversion of shares at the Effective Time, and treatment of treasury and dissenting shares.'
  canonical_terms:
  - Per Share Merger Consideration
  - Exchange Ratio
  - converted into the right to receive
  - cash election
  - stock consideration
  - treasury shares cancelled
  example_phrases:
  - Each share of Company Common Stock issued and outstanding immediately prior to the Effective Time
    shall be converted into the right to receive $[•] in cash, without interest.
  - Each Share shall be converted into the right to receive the Exchange Ratio of validly issued shares
    of Parent Common Stock.
  - Each Share held in treasury or owned by Parent immediately prior to the Effective Time shall be cancelled
    and shall cease to exist, and no consideration shall be delivered in exchange therefor.
  exclusion_cues:
  - Cash-out/conversion of options and RSUs is the Treatment of Equity Awards leaf.
  - Purchase-price true-up mechanics are the Purchase Price; Purchase Price Adjustments leaf.
- standard_id: d3937510a948cfee
  level: l3
  label: Purchase Price; Purchase Price Adjustments; Closing Statement
  l1_label: Transaction Mechanics and Consideration
  l2_label: Consideration
  description: 'Section setting the purchase price and the post-closing true-up: estimated and final closing
    statements, working-capital / cash / debt / transaction-expense adjustments, and the dispute-resolution
    / accounting-firm process.'
  canonical_terms:
  - Purchase Price
  - working capital adjustment
  - net debt
  - Estimated Closing Statement
  - Final Closing Statement
  - true-up
  - Independent Accountant
  - target working capital
  example_phrases:
  - Not less than three Business Days prior to Closing, Seller shall deliver an Estimated Closing Statement
    setting forth its good-faith estimate of Closing Working Capital, Cash, Indebtedness, and Transaction
    Expenses.
  - The Purchase Price shall be (i) increased dollar-for-dollar by the amount, if any, by which Closing
    Working Capital exceeds Target Working Capital, and (ii) decreased by the amount of any Closing Indebtedness.
  - Any disputed items shall be submitted to the Independent Accountant, whose determination shall be
    final and binding on the parties.
  exclusion_cues:
  - The fixed per-share merger consideration is the Merger Consideration leaf.
  - Contingent post-closing milestone payments are the Earn-Out leaf.
  - A general binding-arbitration clause for all disputes (not the accounting-firm price true-up) is Dispute
    Resolution (Arbitration).
- standard_id: 795347ada3b70efb
  level: l3
  label: Tax Withholding on Payments
  l1_label: Transaction Mechanics and Consideration
  l2_label: Consideration
  description: Section authorizing the payor/paying agent to deduct and withhold required taxes from amounts
    payable under the agreement and treating withheld amounts as paid to the recipient.
  canonical_terms:
  - deduct and withhold
  - withholding Taxes
  - treated as having been paid
  - backup withholding
  - Code Section 3406
  - required under applicable Tax Law
  example_phrases:
  - Each of Parent, the Surviving Corporation, and the Paying Agent shall be entitled to deduct and withhold
    from the consideration otherwise payable such amounts as are required to be deducted and withheld
    under applicable Tax Law.
  - To the extent amounts are so withheld and paid over to the appropriate Governmental Authority, such
    amounts shall be treated for all purposes as having been paid to the Person in respect of which such
    deduction was made.
  - Any amounts subject to backup withholding under Section 3406 of the Code shall be withheld and remitted
    as required.
  exclusion_cues:
  - Transfer taxes and broader tax cooperation are Covenants (Tax Matters).
  - The FIRPTA non-foreign-person affidavit delivered as a closing deliverable is Closing Deliverables.
  - The general payment mechanics are the Exchange Procedures leaf.
- standard_id: 984defd83e1666c2
  level: l3
  label: Treatment of Equity Awards (Options / RSUs / PSUs / Warrants)
  l1_label: Transaction Mechanics and Consideration
  l2_label: Consideration
  description: Section specifying how outstanding stock options, RSUs, PSUs, and warrants are treated
    at the Effective Time — cash-out, assumption, conversion, or accelerated vesting.
  canonical_terms:
  - Company Options
  - RSUs
  - PSUs
  - warrants
  - vested and unvested
  - cashed out
  - assumed and converted
  - accelerated vesting
  example_phrases:
  - At the Effective Time, each Company Option that is outstanding and unexercised, whether vested or
    unvested, shall be cancelled and converted into the right to receive an amount in cash equal to the
    product of the number of Shares subject thereto and the excess of the Per Share Merger Consideration
    over the exercise price.
  - Each outstanding Company RSU shall be assumed by Parent and converted into a Parent RSU covering a
    number of shares determined using the Exchange Ratio.
  - Each Company PSU shall vest based on deemed performance as set forth in the Schedule.
  exclusion_cues:
  - The base per-share price for common stock is the Merger Consideration leaf.
  - Employee-benefit-plan continuation generally is Covenants (Employees and Benefits).
- standard_id: dc1f06ef23338ff3
  level: l2
  label: Deal Structure
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: 'How the transaction is structured and effected: the merger and its constituent entities,
    the effective time and surviving-entity governance, tender-offer mechanics, and (in asset deals) the
    assets and liabilities transferred.'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - merger
  - Merger Sub
  - Effective Time
  - tender offer
  - asset purchase
  - constituent corporations
  - surviving corporation
  example_phrases:
  - This is the 'Deal Structure' category within Transaction Mechanics and Consideration; it groups related
    sub-leaves and is not itself an operative provision — classify to the specific child leaf that matches
    the section's operative text.
  - Use this Deal Structure grouping only as an umbrella; prefer a specific sub-leaf whenever one concept
    dominates the section.
  exclusion_cues:
  - The amount and form of consideration is the Consideration L2.
  - The mechanical closing logistics (time/place/deliverables) are Closing Mechanics.
- standard_id: 0f300351061e2efe
  level: l3
  label: Assumed & Excluded Liabilities (asset deal)
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: Section in an asset purchase specifying which liabilities the buyer assumes (Assumed Liabilities)
    and which remain with the seller (Excluded/Retained Liabilities).
  canonical_terms:
  - Assumed Liabilities
  - Excluded Liabilities
  - Retained Liabilities
  - successor liability
  - liabilities expressly assumed
  - no other liabilities
  example_phrases:
  - Upon the terms and subject to the conditions of this Agreement, Purchaser shall assume and agree to
    pay, perform, and discharge only the Assumed Liabilities.
  - Purchaser shall not assume and shall have no liability for any Excluded Liabilities, which shall remain
    the sole responsibility of Seller.
  - The Assumed Liabilities consist solely of the trade payables and executory Contract obligations set
    forth on the Schedule.
  exclusion_cues:
  - Purchased/excluded assets are the Purchased & Excluded Assets leaf.
  - Indemnification for retained liabilities is Indemnification.
- standard_id: 4e259fa432ddf707
  level: l3
  label: Effective Time; Certificate of Merger; Surviving Entity Charter & Bylaws
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: Section specifying when the merger becomes effective (filing of the certificate of merger)
    and the surviving entity's certificate of incorporation, bylaws, directors, and officers from the
    Effective Time.
  canonical_terms:
  - Effective Time
  - Certificate of Merger
  - filed with the Secretary of State
  - Surviving Corporation charter
  - bylaws
  - directors and officers
  example_phrases:
  - At the Closing, the parties shall cause a Certificate of Merger to be executed and filed with the
    Secretary of State of the State of Delaware.
  - The Merger shall become effective at such time as the Certificate of Merger is duly filed, or at such
    later time as the parties agree and specify therein.
  - At the Effective Time, the certificate of incorporation and bylaws of the Surviving Corporation shall
    be amended and restated to read as set forth in the applicable Exhibit.
  exclusion_cues:
  - The overall merger structure / constituent entities is the Transaction Structure leaf.
  - Closing time and place is the Closing; Time and Place leaf.
- standard_id: eb4322c2cf4f699e
  level: l3
  label: Purchased & Excluded Assets (asset deal)
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: Section in an asset purchase identifying the assets to be sold and transferred (Purchased
    Assets) and those expressly retained by the seller (Excluded Assets).
  canonical_terms:
  - Purchased Assets
  - Acquired Assets
  - Excluded Assets
  - Transferred Assets
  - assets to be conveyed
  - retained assets
  example_phrases:
  - At the Closing, Seller shall sell, convey, assign, transfer, and deliver to Purchaser all of Seller's
    right, title, and interest in and to the Purchased Assets.
  - Notwithstanding anything to the contrary, the Purchased Assets shall not include the Excluded Assets.
  - The Purchased Assets include all inventory, equipment, Contracts, and Intellectual Property primarily
    used in the Business.
  exclusion_cues:
  - Assumed/retained liabilities are the Assumed & Excluded Liabilities leaf.
  - Stock/merger structures are the Transaction Structure leaf.
- standard_id: 966f343de9937fdf
  level: l3
  label: Tender Offer Structure; Offer Terms; Top-Up / Subsequent Offering Period
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: 'Section governing a two-step tender/exchange offer: the offer and its terms and conditions,
    the minimum condition, a top-up option, a subsequent offering period, and the back-end merger (often
    under DGCL §251(h)).'
  canonical_terms:
  - tender offer
  - exchange offer
  - Offer
  - Minimum Condition
  - top-up option
  - subsequent offering period
  - Section 251(h)
  - Schedule TO
  example_phrases:
  - Merger Sub shall commence the Offer to purchase all outstanding Shares at the Offer Price as promptly
    as practicable.
  - The Offer shall be subject to the satisfaction of the Minimum Condition and the other Offer Conditions
    set forth on the Annex.
  - The Company grants to Merger Sub an irrevocable Top-Up Option to purchase a number of Shares sufficient
    to effect a short-form merger under Section 251(h) of the DGCL.
  exclusion_cues:
  - A one-step merger structure is the Transaction Structure leaf.
  - Force-the-vote / support agreements are Covenants (Deal Process / No-Shop).
- standard_id: 77acaf04badfbf9e
  level: l3
  label: Transaction Structure; Merger Sub; Constituent Entities
  l1_label: Transaction Mechanics and Consideration
  l2_label: Deal Structure
  description: 'Section establishing the structure of the deal: the merger of Merger Sub into the target
    (or vice versa), the constituent and surviving entities, and the governing merger statute.'
  canonical_terms:
  - the Merger
  - Merger Sub
  - constituent corporations
  - surviving corporation
  - DGCL Section 251
  - forward/reverse triangular merger
  example_phrases:
  - Upon the terms and subject to the conditions set forth in this Agreement, and in accordance with the
    DGCL, at the Effective Time Merger Sub shall be merged with and into the Company.
  - The Company shall be the Surviving Corporation and shall continue as a wholly owned Subsidiary of
    Parent.
  - The Merger shall have the effects set forth in this Agreement and the applicable provisions of the
    DGCL.
  exclusion_cues:
  - The timing of effectiveness and surviving-entity charter/bylaws are the Effective Time leaf.
  - Tender-offer structures are the Tender Offer Structure leaf.
- standard_id: e47b83b1b9dd3e96
  level: l2
  label: Fees and Expenses
  l1_label: Transaction Mechanics and Consideration
  l2_label: Fees and Expenses
  description: 'Allocation of transaction costs: each party bears its own fees except as specified, and
    treatment of specific shared costs (filing fees, transfer taxes by cross-reference).'
  canonical_terms:
  - umbrella category (route to a specific sub-leaf)
  - fees and expenses
  - each party bears its own
  - Transaction Expenses
  - filing fees
  - expense allocation
  example_phrases:
  - This is the 'Fees and Expenses' category within Transaction Mechanics and Consideration; it groups
    related sub-leaves and is not itself an operative provision — classify to the specific child leaf
    that matches the section's operative text.
  - Use this Fees and Expenses grouping only as an umbrella; prefer a specific sub-leaf whenever one concept
    dominates the section.
  exclusion_cues:
  - Termination fees and expense reimbursement on termination are Termination.
  - Purchase-price adjustment for transaction expenses is the Purchase Price Adjustments leaf.
- standard_id: 54b5db7d36480690
  level: l3
  label: Transaction Expenses; Allocation of Fees and Expenses
  l1_label: Transaction Mechanics and Consideration
  l2_label: Fees and Expenses
  description: Section allocating responsibility for transaction fees and expenses — generally each party
    bears its own — and specifying any shared or specifically allocated costs such as HSR filing fees
    or transfer agent fees.
  canonical_terms:
  - each party shall bear its own fees and expenses
  - Transaction Expenses
  - HSR filing fees split
  - costs and expenses
  - whether or not the Closing occurs
  example_phrases:
  - Except as otherwise expressly set forth herein, all fees and expenses incurred in connection with
    this Agreement shall be paid by the party incurring such fees and expenses, whether or not the Merger
    is consummated.
  - Parent shall pay all filing fees payable under the HSR Act and any other Antitrust Law.
  - The Company's Transaction Expenses shall be paid by the Company at or prior to the Closing and shall
    reduce the aggregate consideration to the extent included in the definition of Transaction Expenses.
  exclusion_cues:
  - A termination fee or expense reimbursement triggered by termination is Termination.
  - Transfer, documentary, and sales Taxes are Covenants (Tax Matters), not this expense-allocation leaf.
