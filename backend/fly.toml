# fly.toml app configuration file generated for pandects-api on 2025-07-14T18:29:41-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pandects-api'
primary_region = 'iad'

[build]

[env]
  MARIADB_DATABASE = 'pdx'
  MAIN_DB_SCHEMA = 'pdx'
  MARIADB_USER = 'panda'
  MARIADB_HOST = 'pandects-db.internal'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # 0 since 2026-11-02: the frontend calls https://api.pandects.org through Fly's
  # proxy, which resumes a suspended machine, and the liveness check below goes
  # straight to the machine so it never holds one awake. It was 1 only because
  # `fly launch` generated it that way.
  min_machines_running = 0
  processes = ['app']

  # Liveness check; a rolling deploy waits on it before moving to the next
  # machine. Checks go straight to the machine, so they don't wake suspended ones.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[deploy]
  release_command = "python3 -m backend.init_auth_db"

# 512 MB since 2026-11-02: measured 255 MB resident serving requests at 512 MB
# (422 MB at 1 GB, the difference mostly page cache). Raise it if a heavier
# endpoint or an in-process cache lands here.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
