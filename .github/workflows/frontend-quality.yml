name: Frontend Quality

# Reusable quality checks for frontend/. Called by OSS Quality (PRs and
# non-deploy pushes) and by Deploy Frontend (gates flyctl on a green run).
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated API types are current
        # shared/api.gen.ts must match backend/openapi/ui-openapi.json (npm run gen:api).
        run: npm run check:api

      - name: Run frontend tests
        run: npm test

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend lint
        run: npm run lint
